# Emulator-only authorization checks. NEVER deploy production rules from this workflow.
name: Security Rules Tests
on:
  push:
    branches:
      - 'security/**'
      - 'fix/**'
    paths:
      - 'firestore.rules'
      - 'index.html'
      - 'checkin/index.html'
      - 'flow-client-checkin.html'
      - 'track.html'
      - 'security/**'
      - 'treatment/index.html'
      - 'treatment/store.js'
      - 'treatment/owner-access.js'
      - 'sgvp/assessment/index.html'
      - 'sgvp/assessment/reviewer-access.js'
      - '.github/workflows/security-rules-check.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security/**'
      - 'treatment/index.html'
      - 'treatment/store.js'
      - 'treatment/owner-access.js'
      - 'sgvp/assessment/index.html'
      - 'sgvp/assessment/reviewer-access.js'
      - '.github/workflows/security-rules-check.yml'
permissions:
  contents: read
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --prefix security --no-audit --no-fund
      - name: Verify client check-in persistence and payload semantics
        run: node security/checkin-source.test.cjs
      - name: Verify shared-workstation privacy cleanup
        run: node security/flow-privacy.test.cjs
      - name: Verify proposed edge HTTPS and headers policy (local simulation)
        run: node security/edge/worker.test.mjs
      - name: Verify owner onboarding in Treatment Sheets
        run: node security/treatment-owner-access.test.cjs
      - name: Verify Heather assessment reviewer access
        run: node security/sgvp-heather-access.test.cjs
      - name: Verify confidential intake translation never uses public providers
        run: node security/translation-privacy.test.cjs
      - name: Verify tracker expiry, revocation, randomness and intake schema
        run: node security/tracker-intake-source.test.cjs
      - name: Check browser privacy meta and staged hosting edge
        run: node security/browser-policy-source.test.cjs
      # ro1 (Nov 4 2026): review-only accounts are checked in the same emulator run
      - name: Run Firestore rule tests in local emulator
        run: >
          npx --yes firebase-tools@13.29.1 emulators:exec
          --only firestore --project demo-pravix-security
          "node security/firestore.rules.test.cjs && node security/sgvp-review-only.test.cjs"
