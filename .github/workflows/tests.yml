# Pravix tests. Every push to a branch other than main runs every test in _ci/ (see _ci/README.md):
# Chromium in six even parts, and the sections written for both engines again in WebKit (Safari's engine).
# A build goes to its branch, these run, and merging it into main is the deploy.
#
# Licensed drug data and staff-only data never come here; their sections run on the build machine before each merge.
name: Tests
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['firestore.rules']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_VERSION: '1.56.0'
  TZ: America/New_York
jobs:
  chromium:
    name: Chromium ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fonts (the same faces as the build machine, so text measures the same)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-liberation fonts-dejavu-core fonts-noto-color-emoji fonts-noto-cjk > /dev/null
          sudo cp _ci/fonts/56-prefer-inter.conf /etc/fonts/conf.d/ && fc-cache -f > /dev/null
      - name: Playwright
        run: |
          pip install -q "playwright==$PLAYWRIGHT_VERSION"
          python -m playwright install --with-deps chromium > /dev/null
      - name: Tests
        run: python _ci/run.py . --shots shots --shard ${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-${{ matrix.shard }}
          path: shots/
          retention-days: 7

  webkit:
    name: WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-liberation fonts-dejavu-core fonts-noto-color-emoji fonts-noto-cjk > /dev/null
          sudo cp _ci/fonts/56-prefer-inter.conf /etc/fonts/conf.d/ && fc-cache -f > /dev/null
      - name: Playwright
        run: |
          pip install -q "playwright==$PLAYWRIGHT_VERSION"
          python -m playwright install --with-deps webkit > /dev/null
      - name: Tests
        run: python _ci/run.py . --shots shots --engine webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit
          path: shots/
          retention-days: 7
