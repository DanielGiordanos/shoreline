# One-purpose, prelaunch authorization restoration.
# This workflow operates on two existing, verified Firebase Auth identities only.
# Changes are atomic and it creates NO Auth accounts.
name: Provision two authorized Shoreline accounts
on:
  push:
    branches: ['security/provision-two-accounts-2026-11-02']
    paths: ['security/provision-two-accounts.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shoreline-staff-provision-2026-11-02
  cancel-in-progress: false
jobs:
  provision:
    if: github.repository == 'DanielGiordanos/shoreline'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Firebase Admin SDK in isolated directory
        run: npm install --prefix "$RUNNER_TEMP/pravix-provision" --no-save --ignore-scripts --no-audit --no-fund firebase-admin@13.5.0
      - name: Verify two existing accounts and atomically grant Shoreline membership
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          node security/provision-two-accounts.cjs
