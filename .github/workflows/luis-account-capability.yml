name: Check account provisioning capability
on:
  push:
    branches: ["ops/luis-account-capability-20261105"]
    paths: [".github/workflows/luis-account-capability.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check existing Firebase permissions without changing accounts
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const {createSign}=require('node:crypto');
          (async()=>{
            if (!process.env.SA) throw new Error('Deployment credential is unavailable');
            const sa=JSON.parse(process.env.SA);
            delete process.env.SA;
            if(sa.project_id!=='shoreline-flow') throw new Error('Unexpected Firebase project');
            const now=Math.floor(Date.now()/1000);
            const b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
            const payload=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+600});
            const sig=createSign('RSA-SHA256').update(payload).sign(sa.private_key,'base64url');
            const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:payload+'.'+sig})});
            if(!tr.ok) throw new Error('Credential authentication failed: HTTP '+tr.status);
            const {access_token}=await tr.json();
            const permissions=['firebaseauth.users.create','firebaseauth.users.get','firebaseauth.users.update','datastore.entities.create','datastore.entities.get','datastore.entities.update','datastore.databases.get','firebaserules.releases.update'];
            const r=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/shoreline-flow:testIamPermissions',{method:'POST',headers:{Authorization:'Bearer '+access_token,'Content-Type':'application/json'},body:JSON.stringify({permissions})});
            if(!r.ok) throw new Error('Permission check failed: HTTP '+r.status);
            const granted=(await r.json()).permissions||[];
            console.log('PROVISIONING_CAPABILITIES '+JSON.stringify(Object.fromEntries(permissions.map(p=>[p,granted.includes(p)]))));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          
          NODE
