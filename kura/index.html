  <script type="module">
    // Kura on shoreline.pravix.app: the engine runs on this device; Firebase keeps the shared, ordered record.
    import { install } from './src/web/kura-web.js?v=6f411ada51';
    try {
      if (!window.firebase) throw new Error('Firebase did not load. Check your connection, then reload.');
      install({ firebase: window.firebase, workerUrl: new URL('src/web/engine-worker.js?v=6f411ada51', location.href).href });
      await import('./src/app.js?v=6f411ada51');
    } catch (error) { document.querySelector('.boot').textContent = 'Kura could not start. ' + error.message; }
  </script>
