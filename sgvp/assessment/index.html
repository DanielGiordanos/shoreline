<script id="pvx-n225-text">
/* PVX-N225 - Dynamic Type: on iPhone and iPad the page's text follows the system text size (-apple-system-body is 17 pt
   at the default size), re-read when the app comes back. Elsewhere the browser's own text size applies. The shared top bar
   keeps its size in points, like an iOS tab bar. */
(function(){
  var de=document.documentElement;
  function ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1); }
  function probe(){
    try{
      if(!ios()||!(window.CSS&&CSS.supports&&CSS.supports('font','-apple-system-body'))) return;
      var d=document.createElement('div'); d.style.cssText='position:absolute;visibility:hidden;pointer-events:none;font:-apple-system-body';
      de.appendChild(d); var f=parseFloat(getComputedStyle(d).fontSize); d.remove();
      if(!f) return; var pct=Math.max(82,Math.min(235,f/17*100));
      de.style.fontSize=Math.abs(pct-100)<1?'':pct.toFixed(1)+'%';
    }catch(e){}
  }
  function mark(){ var sc=parseFloat(getComputedStyle(de).fontSize)/16; de.classList.toggle('pvx-text-l',sc>=1.25); }
  probe(); mark();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ probe(); mark(); } });
  window.addEventListener('resize',mark);
  try{ new MutationObserver(mark).observe(de,{attributes:true,attributeFilter:['style']}); }catch(e){}
  window.pvxTextScale=function(){ return parseFloat(getComputedStyle(de).fontSize)/16; };
})();
</script>

<script id="pvx-n223-guard-js">
/* PVX-N223: the managers' shared account (au733@vca.com) can open https://shoreline.pravix.app/sgvp/ only.
   On every other Pravix page it sees the shared top bar and "Unauthorized" - nothing else, nothing to use.
   Runs first in <head>. It reads who is signed in from Firebase's own storage (works on pages without Firebase)
   and follows sign-in changes where Firebase is loaded. */
(function () {
  'use strict';
  var AU = 'au733@vca.com', KEY = 'pvx_acct', d = document.documentElement, on = false, box = null, mo = null;
  var css = document.createElement('style'); css.id = 'pvx-n223-guard';
  css.textContent = 'html.pvx-ua-wait body{visibility:hidden!important}'
    + 'html.pvx-ua body{overflow:hidden!important}html.pvx-ua [data-pvx-ua]{visibility:hidden!important}'
    + '.pvx-ua-box{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;'
    + 'background:#0A1222;color:#E6EEF6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif}'
    + 'html.pvx-ua-light .pvx-ua-box{background:#F2F4F8;color:#0E1A2B}'
    + '.pvx-ua-box h1{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:0}'
    + '.pvx-ua-box p{margin:0;font-size:.9375rem;line-height:1.45;color:#A7C2D8}html.pvx-ua-light .pvx-ua-box p{color:#52698A}'
    + '.pvx-ua-box a{margin-top:6px;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:linear-gradient(150deg,#38BDD2,#2C7FB8);color:#fff;font-weight:600;font-size:.9375rem;text-decoration:none}'
    + '.pvx-ua-box a:focus-visible{outline:2px solid #38BDD2;outline-offset:3px}';
  (document.head || d).appendChild(css);
  try { if (localStorage.getItem(KEY) === 'au733') d.classList.add('pvx-ua-wait'); } catch (e) {}
  var waitT = setTimeout(function () { d.classList.remove('pvx-ua-wait'); }, 4000);   /* never leave anyone with a blank page */
  function ready(f) { if (document.body && document.readyState !== 'loading') f(); else document.addEventListener('DOMContentLoaded', f); }
  function top() { return document.querySelector('#pvxTopnav') || document.querySelector('nav.topnav') || document.querySelector('.topnav'); }
  function freeTop() {   /* some apps lock their own page for this account (inert on the wrapper that holds the top bar) */
    var t = top(); if (!t) return;
    for (var x = t; x && x !== document.body; x = x.parentElement) if (x.hasAttribute('inert')) { x.removeAttribute('inert'); x.setAttribute('data-pvx-ua-freed', ''); }
  }
  function setInert(v) {
    if (v) freeTop();
    var keep = [box, top()].filter(Boolean);
    function walk(parent) {
      [].forEach.call(parent.children, function (c) {
        if (keep.indexOf(c) >= 0 || c.tagName === 'SCRIPT' || c.tagName === 'STYLE') return;
        if (keep.some(function (k) { return c.contains(k); })) { walk(c); return; }
        if (v) { if (!c.hasAttribute('data-pvx-ua')) { c.setAttribute('data-pvx-ua', c.hasAttribute('inert') ? '1' : '0'); c.setAttribute('inert', ''); } }
        else if (c.hasAttribute('data-pvx-ua')) { if (c.getAttribute('data-pvx-ua') === '0') c.removeAttribute('inert'); c.removeAttribute('data-pvx-ua'); }
      });
    }
    walk(document.body);
  }
  function place() { if (!box) return; var t = top(), b = t ? Math.max(0, Math.round(t.getBoundingClientRect().bottom)) : 0; box.style.top = b + 'px'; }
  function show() {
    ready(function () {
      if (!on) return;
      d.classList.add('pvx-ua');
      var light = /(?:^|;\s*)pvx_theme=light/.test(document.cookie);
      if (!/(?:^|;\s*)pvx_theme=/.test(document.cookie)) { try { var m = getComputedStyle(document.body).backgroundColor.match(/\d+/g); if (m && (+m[0] + +m[1] + +m[2]) / 3 > 140) light = true; } catch (e) {} }
      if (light) d.classList.add('pvx-ua-light');
      if (!box) {
        box = document.createElement('main'); box.className = 'pvx-ua-box'; box.setAttribute('aria-labelledby', 'pvxUaT');
        box.innerHTML = '<h1 id="pvxUaT">Unauthorized</h1><p>This account can only open the intern curriculum.</p><a href="https://shoreline.pravix.app/sgvp/">Open the curriculum</a>';
        document.body.appendChild(box);
      }
      place(); setInert(true);
      d.classList.remove('pvx-ua-wait'); clearTimeout(waitT);
      if (!mo) {   /* the page keeps adding things (its own sign-in cards, banners): keep them out of reach */
        var busy = false;
        mo = new MutationObserver(function () { if (!on || busy) return; busy = true; setTimeout(function () { busy = false; if (on) { setInert(true); place(); } }, 60); });
        mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['inert'] });
      }
      window.addEventListener('resize', place);
      setTimeout(place, 300); setTimeout(place, 1500);
    });
  }
  function hide() {
    if (mo) { mo.disconnect(); mo = null; }
    if (box) { box.remove(); box = null; }
    d.classList.remove('pvx-ua', 'pvx-ua-wait'); clearTimeout(waitT);
    if (document.body) setInert(false);
  }
  function decide(email) {
    var au = String(email || '').toLowerCase() === AU;
    try { if (au) localStorage.setItem(KEY, 'au733'); else localStorage.removeItem(KEY); } catch (e) {}
    if (au) { if (!on) { on = true; show(); } }
    else { on = false; hide(); }
  }
  window.pvxGuardDecide = decide;
  /* 1. who is signed in, from Firebase's own storage (any page) */
  try {
    var req = indexedDB.open('firebaseLocalStorageDb');
    req.onupgradeneeded = function () { try { req.transaction.abort(); } catch (e) {} };   /* no database: nobody signed in */
    req.onerror = function () { decide(null); };
    req.onsuccess = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains('firebaseLocalStorage')) { db.close(); decide(null); return; }
      var g = db.transaction('firebaseLocalStorage', 'readonly').objectStore('firebaseLocalStorage').getAll();
      g.onsuccess = function () {
        var em = null;
        (g.result || []).forEach(function (x) { var v = x && x.value; if (v && v.email && String(x.fbase_key || '').indexOf('firebase:authUser:') === 0 && String(v.email).toLowerCase() === AU) em = AU; });
        db.close(); if (!fbSeen) decide(em);
      };
      g.onerror = function () { db.close(); };
    };
  } catch (e) {}
  /* 2. sign-in changes on pages that load Firebase */
  var fbSeen = false, tries = 0;
  (function poll() {
    try {
      if (window.firebase && firebase.apps && firebase.apps.length && firebase.auth) {
        firebase.auth().onAuthStateChanged(function (u) { fbSeen = true; decide(u && u.email); });
        return;
      }
    } catch (e) {}
    if (++tries < 60) setTimeout(poll, 250);
  })();
})();
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --brand-navy:#0C2952; --brand-cyan:#4DC8E0; --brand-purple:#8B4DB5; --brand-coral:#E8644A; --brand-green:#1a9e6e; --brand-amber:#E8A830;
  --bg:#E4F0F8; --surface-0:#FFFFFF; --surface-1:#F4F9FC; --surface-2:#EAF3F8; --nav-bg:#0C2952;
  --text-primary:#0A2240; --text-secondary:#3A5572; --text-muted:#56708A;
  --border:rgba(12,41,82,0.10); --border-subtle:rgba(12,41,82,0.06); --border-strong:rgba(12,41,82,0.18);
  --glass-bg:rgba(255,255,255,0.32); --glass-border:rgba(255,255,255,0.9);
  --glass-shadow:0 20px 60px rgba(20,50,95,0.14),0 6px 18px rgba(20,50,95,0.07),inset 0 1px 0 rgba(255,255,255,0.98),inset 0 0 0 1px rgba(255,255,255,0.4);
  --radius-lg:20px; --radius-xl:28px;
}
body.dark{
  --bg:#080E1A; --surface-0:#0E1628; --surface-1:#131E34; --surface-2:#192540; --nav-bg:#0A1222;
  --text-primary:#D8E8F4; --text-secondary:#93AAC4; --text-muted:#7690AE;
  --border:rgba(77,200,224,0.10); --border-subtle:rgba(77,200,224,0.05); --border-strong:rgba(77,200,224,0.18);
  --glass-bg:rgba(14,22,40,0.45); --glass-border:rgba(77,200,224,0.18);
  --glass-shadow:0 8px 40px rgba(0,0,0,0.5),0 2px 4px rgba(0,0,0,0.6),inset 0 1px 0 rgba(77,200,224,0.08);
  --brand-cyan:#38BDD2; --brand-purple:#A888E0; --brand-coral:#E07060; --brand-green:#48B888;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text-primary);min-height:100vh;transition:background .4s,color .4s;overflow-x:hidden;}
body:not(.dark){background:linear-gradient(135deg,#EAF3FB 0%,#E9ECF8 48%,#F4ECF6 100%);background-attachment:fixed;}
.bg-orb-1{position:fixed;z-index:0;pointer-events:none;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(77,200,224,0.16) 0%,transparent 70%);top:-120px;right:-120px;}
.bg-orb-2{position:fixed;z-index:0;pointer-events:none;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(139,75,181,0.13) 0%,transparent 70%);bottom:-60px;left:-120px;}
.bg-orb-3{position:fixed;z-index:0;pointer-events:none;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(232,140,200,0.11) 0%,transparent 70%);top:34%;left:40%;}
body.dark .bg-orb-3{display:none;}

/* ═══ NAV ═══ */
.topnav{position:sticky;top:0;z-index:300;background:var(--nav-bg);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;box-shadow:0 2px 24px rgba(0,0,0,0.25);backdrop-filter:blur(20px);transition:background .4s;}

.topnav img.logo{height:72px;width:auto;}
.nav-center{display:flex;gap:3px;align-items:center;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 13px;border-radius:8px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,0.55);font-size:10px;font-weight:600;letter-spacing:.3px;border:1px solid transparent;text-decoration:none;background:transparent;font-family:var(--font,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif);white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9);}
.nav-item.active{background:rgba(77,200,224,0.15);color:var(--brand-cyan);border-color:rgba(77,200,224,0.25);}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.nav-right{display:flex;gap:10px;align-items:center;}
.live{display:flex;align-items:center;gap:6px;background:rgba(26,158,110,0.15);border:1px solid rgba(26,158,110,0.3);color:#48c88c;font-size:0.6875rem;font-weight:700;padding:5px 12px;border-radius:50px;}
.live i{width:7px;height:7px;border-radius:50%;background:#48c88c;display:inline-block;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.7;transform:scale(1.3);}}
.theme-toggle{cursor:pointer;background:none;border:none;border-radius:50px;overflow:hidden;width:72px;height:34px;flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,0.15);position:relative;transition:box-shadow .2s;}
.theme-toggle:hover{box-shadow:0 0 0 2px rgba(77,200,224,0.5);}
.theme-toggle img{width:72px;height:34px;object-fit:cover;display:block;border-radius:50px;pointer-events:none;transition:opacity .3s;position:absolute;top:0;left:0;}
.theme-toggle .img-light{opacity:1;}.theme-toggle .img-dark{opacity:0;}
body.dark .theme-toggle .img-light{opacity:0;}body.dark .theme-toggle .img-dark{opacity:1;}

/* ═══ PAGE ═══ */
.page{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:34px 32px 80px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px;}
.page-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(77,200,224,0.12);border:1px solid rgba(77,200,224,0.25);color:var(--brand-cyan);font-size:0.6875rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 13px;border-radius:20px;margin-bottom:14px;}
body:not(.dark) .page-tag{background:rgba(12,41,82,0.07);border-color:rgba(12,41,82,0.14);color:var(--brand-navy);}
.page-title{font-size:2.125rem;font-weight:800;letter-spacing:-1px;line-height:1.1;}
.page-sub{font-size:0.875rem;color:var(--text-secondary);margin-top:8px;}
.block-card{position:relative;overflow:hidden;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);padding:18px 26px;text-align:right;min-width:240px;}
.block-card>*{position:relative;z-index:1;}
.bl-glow{position:absolute;inset:-50% -25%;border-radius:50%;z-index:0;pointer-events:none;filter:blur(16px);opacity:.7;
  background:radial-gradient(ellipse at 62% 42%,rgba(77,200,224,0.20),rgba(139,75,181,0.13) 40%,rgba(70,120,235,0.09) 64%,transparent 78%);
  animation:blGlow 7s ease-in-out infinite;}
@keyframes blGlow{0%,100%{opacity:.5;transform:scale(.95);}50%{opacity:.85;transform:scale(1.07);}}
.block-card .bl-lab{font-size:0.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);}
.block-card .bl-name{font-size:1.375rem;font-weight:800;color:var(--text-primary);margin:4px 0;letter-spacing:-.3px;}
.block-card .bl-dates{font-size:0.75rem;font-weight:700;letter-spacing:0;color:var(--brand-cyan);text-transform:none;}

/* ═══ CARD ═══ */
.card{position:relative;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:var(--glass-shadow);backdrop-filter:blur(42px) saturate(1.9);-webkit-backdrop-filter:blur(42px) saturate(1.9);padding:22px 24px;}
.week-card{transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s ease;}
.week-card:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(10,40,80,0.15),0 0 0 1px rgba(77,200,224,0.12),0 0 28px rgba(77,200,224,0.10);}
body.dark .week-card:hover{box-shadow:0 16px 52px rgba(0,0,0,0.62),0 0 0 1px rgba(77,200,224,0.18),0 0 32px rgba(77,200,224,0.13);}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-h .ttl{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-muted);}
.card-h .rng{font-size:0.6875rem;font-weight:600;color:var(--text-secondary);}

/* Section separators between weeks */
.week-divider{height:1px;margin:50px auto;max-width:88%;position:relative;background:linear-gradient(90deg,transparent,rgba(77,200,224,0.30),transparent);}
.week-divider::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;height:64px;border-radius:50%;background:radial-gradient(ellipse,rgba(77,200,224,0.10),transparent 70%);filter:blur(9px);pointer-events:none;}

/* ═══ TABLE ═══ */
.tbl-wrap{overflow-x:auto;}
table.sched{width:100%;border-collapse:separate;border-spacing:5px;min-width:760px;}
table.sched th,table.sched td{padding:0;}
table.sched thead th{text-align:center;font-size:0.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);padding:6px 4px;}
table.sched thead th .dt{display:block;font-size:0.6875rem;font-weight:600;color:var(--text-muted);margin-top:2px;letter-spacing:0;}

.doc{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:16px;background:var(--surface-2);font-size:0.8125rem;font-weight:700;color:var(--text-primary);white-space:nowrap;}

.dept .dept-name{display:inline-block;}
table.sched td:first-child{width:1%;}
.doc .ini{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand-cyan),var(--brand-purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.6875rem;font-weight:800;flex-shrink:0;}
.cell{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;border-radius:19px;font-size:0.75rem;font-weight:600;padding:6px;border:1px solid transparent;line-height:1.25;transition:transform .15s ease;}
.cell:hover{transform:translateY(-1px);}

.cell sup{font-size:0.6875rem;font-weight:800;color:var(--brand-coral);margin-left:1px;}

/* ═══ CURRICULUM-STYLE TABLE ═══ */
.table-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:var(--glass-shadow);backdrop-filter:blur(42px) saturate(1.9);-webkit-backdrop-filter:blur(42px) saturate(1.9);overflow:hidden;position:relative;transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s ease;}

.table-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85) 50%,transparent);pointer-events:none;z-index:2;}

.table-card:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(10,40,80,0.15),0 0 0 1px rgba(77,200,224,0.12),0 0 28px rgba(77,200,224,0.10);}
body.dark .table-card:hover{box-shadow:0 16px 52px rgba(0,0,0,0.62),0 0 0 1px rgba(77,200,224,0.18),0 0 32px rgba(77,200,224,0.13);}
.tc-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-subtle);}

.curr-table tbody tr:last-child td{border-bottom:none;}
.curr-table .svc-col{min-width:172px;width:172px;}
.curr-table td.svc-col{background:var(--surface-1);}
body.dark .curr-table td.svc-col{background:rgba(255,255,255,0.02);}
.svc-dot{background:var(--brand-cyan);}
.svc-cell{display:flex;align-items:center;gap:10px;padding:14px 16px;border-left:4px solid transparent;min-height:56px;}
.svc-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--text-muted);}
.svc-name{font-size:0.8125rem;font-weight:700;color:var(--text-primary);line-height:1.3;}
.block-th{padding:10px 6px;text-align:center;}
.block-num{font-size:0.6875rem;font-weight:800;letter-spacing:1px;color:var(--text-secondary);margin-bottom:2px;text-transform:uppercase;}
.block-dates{font-size:0.6875rem;color:var(--text-muted);font-weight:600;letter-spacing:.2px;}
.block-cell{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:8px 7px;font-size:0.75rem;font-weight:600;line-height:1.3;color:var(--text-primary);transition:background .15s;}
.block-cell:hover{background:rgba(77,200,224,0.06);}
.block-cell.empty{color:var(--text-muted);font-weight:500;}
.block-cell sup{font-size:0.6875rem;font-weight:800;color:var(--brand-coral);margin-left:1px;}
.foot{padding:12px 20px;}

/* ═══ BOTTOM ═══ */
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:24px;margin-top:36px;}
.legend-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.leg{display:flex;align-items:center;gap:10px;font-size:0.8125rem;color:var(--text-secondary);}
.leg .ini{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand-cyan),var(--brand-purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.6875rem;font-weight:800;flex-shrink:0;}
.leg b{color:var(--text-primary);font-weight:700;}
.key-list{display:flex;flex-wrap:wrap;gap:9px;}
.key{display:inline-flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-1);}
.key .key-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.foot{font-size:0.75rem;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
.foot sup{color:var(--brand-coral);font-weight:800;}

/* ═══ LIQUID-GLASS REFINEMENTS (header left untouched) ═══ */
.cell{box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 2px 9px rgba(20,40,80,0.06);}
.doc .ini,.leg .ini{box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 3px 9px rgba(20,40,90,0.28);}
body:not(.dark) .doc{background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.62);box-shadow:inset 0 1px 0 rgba(255,255,255,0.85),0 2px 8px rgba(20,40,80,0.05);}
body:not(.dark) .key{background:rgba(255,255,255,0.42);border-color:rgba(255,255,255,0.66);box-shadow:inset 0 1px 0 rgba(255,255,255,0.85),0 2px 8px rgba(20,40,80,0.05);}
body.dark .doc{background:rgba(255,255,255,0.05);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);}
body.dark .key{background:rgba(255,255,255,0.05);}
body:not(.dark) .block-card,body:not(.dark) .card{border-color:rgba(255,255,255,0.8);}

/* ═══ EDIT MODE ═══ */
[data-editable]{border-radius:6px;transition:background .2s,box-shadow .2s;}
body.edit-mode [data-editable]{cursor:text;background:rgba(77,200,224,0.07);box-shadow:0 0 0 1.5px rgba(77,200,224,0.25);outline:none;padding:1px 4px;margin:-1px -4px;}
body.edit-mode [data-editable]:hover{background:rgba(77,200,224,0.12);}
body.edit-mode [data-editable]:focus{background:rgba(77,200,224,0.12);box-shadow:0 0 0 2px rgba(77,200,224,0.45);}
body.edit-mode .cell[data-editable]{margin:0;}
.eo{display:none!important;}
body.edit-mode .eo{display:inline-flex!important;}
body.edit-mode .eo-block{display:block!important;}
.eo-block{display:none;}
input[type=color].swatch{-webkit-appearance:none;appearance:none;width:20px;height:20px;border:1px solid var(--border-strong);border-radius:6px;padding:0;cursor:pointer;background:none;flex-shrink:0;}
input[type=color].swatch::-webkit-color-swatch-wrapper{padding:0;}
input[type=color].swatch::-webkit-color-swatch{border:none;border-radius:5px;}
.mini-x{background:transparent;border:none;color:var(--brand-coral);cursor:pointer;font-size:0.75rem;line-height:1;padding:0 2px;flex-shrink:0;}
.add-btn{background:rgba(77,200,224,0.10);border:1px dashed var(--brand-cyan);color:var(--brand-cyan);border-radius:10px;padding:9px 14px;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:inherit;}
.add-btn:hover{background:rgba(77,200,224,0.18);}
.add-week{width:100%;margin:8px 0 6px;}

/* edit banner */
.edit-banner{display:none;background:var(--brand-coral);color:#fff;text-align:center;padding:9px;font-size:0.75rem;font-weight:700;letter-spacing:.5px;position:sticky;top:76px;z-index:200;}
.edit-banner.show{display:block;}
.edit-banner span{cursor:pointer;text-decoration:underline;}

/* frost orb + gate (same as Profile) */
.edit-orb{position:fixed;right:22px;bottom:22px;z-index:75;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);cursor:pointer;padding:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.6),rgba(255,255,255,0.12) 60%,rgba(255,255,255,0.04));backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(20,40,80,0.18),inset 0 1px 2px rgba(255,255,255,0.7);opacity:0.5;transition:opacity .2s,transform .2s,box-shadow .2s;}
.edit-orb:hover{opacity:1;transform:scale(1.08);box-shadow:0 6px 18px rgba(20,40,80,0.26),inset 0 1px 2px rgba(255,255,255,0.9),0 0 0 4px rgba(77,200,224,0.12);}
body.dark .edit-orb{border-color:rgba(255,255,255,0.25);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.3),rgba(120,150,200,0.08) 60%,rgba(255,255,255,0.02));}
body.edit-mode .edit-orb{opacity:1;box-shadow:0 0 0 3px rgba(232,100,74,0.32),0 4px 14px rgba(20,40,80,0.2),inset 0 1px 2px rgba(255,255,255,0.8);}
.editgate-overlay{position:fixed;inset:0;z-index:96000;display:none;align-items:center;justify-content:center;padding:20px;}
.editgate-dim{position:absolute;inset:0;background:rgba(5,10,20,0.35);backdrop-filter:blur(10px);}
.editgate-card{position:relative;z-index:2;width:min(92vw,360px);text-align:center;padding:34px 30px 24px;border-radius:26px;color:#fff;background:linear-gradient(160deg,rgba(34,40,58,0.82),rgba(15,19,30,0.86));border:1px solid rgba(255,255,255,0.12);box-shadow:0 30px 80px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.2);backdrop-filter:blur(30px);}
.editgate-title{font-size:1.0625rem;font-weight:800;margin-bottom:4px;}
.editgate-sub{font-size:0.75rem;color:rgba(255,255,255,0.6);margin-bottom:20px;}
.editgate-card input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:12px 18px;color:#fff;font-size:0.875rem;outline:none;font-family:inherit;text-align:center;letter-spacing:3px;}
.editgate-btn{width:100%;margin-top:14px;background:#fff;color:#15151c;border:none;border-radius:24px;padding:12px;font-size:0.875rem;font-weight:800;cursor:pointer;font-family:inherit;}
.editgate-err{color:#ff8a8a;font-size:0.75rem;min-height:14px;margin-top:10px;font-weight:600;}
.editgate-cancel{background:none;border:none;color:rgba(255,255,255,0.5);font-size:0.75rem;cursor:pointer;margin-top:8px;font-family:inherit;text-decoration:underline;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--brand-green);color:#fff;padding:12px 22px;border-radius:12px;font-size:0.8125rem;font-weight:600;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:900px){.nav-center{display:none;}.grid2{grid-template-columns:1fr;}.page-head{flex-direction:column;align-items:flex-start;}.block-card{text-align:left;width:100%;}.topnav img.logo{height:56px;}}
.mini-x .pvx-ico{width:12px;height:12px;margin:0;vertical-align:middle}
</style>
<style id="pvx-logout-css">
/* Flow's Logout button, verbatim */
.logout-button{--mx:50%;--my:50%;--surface-top:rgba(255,255,255,0.96);--surface-bottom:rgba(247,249,252,0.90);--border:rgba(20,28,40,0.08);--border-hover:rgba(20,28,40,0.13);--text:#1d1d1f;--icon:#59616d;--icon-bg-top:rgba(65,72,82,0.055);--icon-bg-bottom:rgba(65,72,82,0.025);--icon-bg-hover-top:rgba(65,72,82,0.075);--icon-bg-hover-bottom:rgba(65,72,82,0.035);--icon-border:rgba(65,72,82,0.10);--icon-border-hover:rgba(65,72,82,0.14);--chevron:rgba(95,104,116,0.46);--chevron-hover:rgba(72,78,88,0.72);--shadow-main:rgba(29,29,31,0.10);--shadow-secondary:rgba(29,29,31,0.06);--shadow-hover-main:rgba(29,29,31,0.115);--shadow-hover-secondary:rgba(29,29,31,0.065);--highlight:rgba(255,255,255,0.72);position:relative;width:auto;height:40px;padding:0 12px 0 8px;border:1px solid var(--border);border-radius:13px;display:grid;grid-template-columns:28px auto 16px;align-items:center;gap:8px;cursor:pointer;color:var(--text);font-family:var(--font);background:linear-gradient(180deg,var(--surface-top),var(--surface-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);overflow:hidden;isolation:isolate;transform:translateY(0) scale(1);transition:transform 180ms cubic-bezier(.2,.8,.2,1),border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;}
body.dark .logout-button{--surface-top:rgba(25,37,64,0.92);--surface-bottom:rgba(17,27,48,0.94);--border:rgba(77,200,224,0.16);--border-hover:rgba(77,200,224,0.30);--text:#D8E8F4;--icon:#A7C2D8;--icon-bg-top:rgba(77,200,224,0.10);--icon-bg-bottom:rgba(77,200,224,0.04);--icon-bg-hover-top:rgba(77,200,224,0.16);--icon-bg-hover-bottom:rgba(77,200,224,0.06);--icon-border:rgba(77,200,224,0.18);--icon-border-hover:rgba(77,200,224,0.30);--chevron:rgba(167,194,216,0.50);--chevron-hover:rgba(216,232,244,0.80);--shadow-main:rgba(0,0,0,0.40);--shadow-secondary:rgba(0,0,0,0.24);--shadow-hover-main:rgba(0,0,0,0.46);--shadow-hover-secondary:rgba(0,0,0,0.26);--highlight:rgba(77,200,224,0.12);}
.logout-button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(170px 100px at var(--mx) var(--my),var(--highlight),transparent 68%);opacity:0;transition:opacity 160ms ease;pointer-events:none;z-index:0;}
.logout-button:hover{border-color:var(--border-hover);box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);}
.logout-button:hover::before{opacity:1;}
.logout-button:active{transform:scale(0.985);box-shadow:inset 0 2px 5px rgba(0,0,0,0.08);}
.logout-icon{position:relative;z-index:1;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--icon);background:linear-gradient(180deg,var(--icon-bg-top),var(--icon-bg-bottom));border:1px solid var(--icon-border);transition:transform 190ms cubic-bezier(.2,.8,.2,1),background 180ms ease,border-color 180ms ease;}
.logout-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;}
.door-glyph,.exit-arrow{transform-box:fill-box;transform-origin:center;transition:transform 260ms cubic-bezier(.22,1,.36,1),opacity 180ms ease;}
.logout-button:hover .logout-icon{transform:translateX(-0.5px);background:linear-gradient(180deg,var(--icon-bg-hover-top),var(--icon-bg-hover-bottom));border-color:var(--icon-border-hover);}
.logout-button:hover .door-glyph{transform:translateX(-0.45px);}
.logout-button:hover .exit-arrow{transform:translateX(2.2px);}
.logout-button:active .logout-icon{transform:scale(0.96);}
.logout-button:active .door-glyph{transform:translateX(-0.2px) scale(.98);}
.logout-button:active .exit-arrow{transform:translateX(3px) scale(.96);}
.logout-label{position:relative;z-index:1;text-align:left;font-size:14px;font-weight:600;line-height:1;letter-spacing:-0.015em;color:var(--text);transition:transform 180ms cubic-bezier(.2,.8,.2,1),opacity 180ms ease;}

.nav-right{display:flex;align-items:center;gap:10px}
@media(max-width:1100px){.logout-button{width:40px;padding:0 5px;grid-template-columns:28px;gap:0}.logout-label,.logout-chevron{display:none}}
</style>
<style id="pvx-header-css">
/* ═══ Pravix portal header — Flow's top bar and sub-nav on the portal pages (Oct 2026; source: VCA/nav/portal-header.css) ═══
   Flow's rules verbatim (values from Flow's stylesheet), scoped to #pvxTopnav / #pvxSubnav so a page's older nav CSS can't override them.
   Goes with portal-nav.css (smaller screens) and the Logout CSS (flow_logout.css). */
#pvxTopnav,#pvxSubnav{--nav-bg:#0A1222;--r-sm:8px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --brand-cyan:#4DC8E0;--ink-400:#8E8E93;--glass-hairline:rgba(0,0,0,0.06);--ease:cubic-bezier(.2,.8,.2,1);--brand-green:#1a9e6e;font-family:var(--font)}
body.dark #pvxTopnav,body.dark #pvxSubnav{--brand-cyan:#38BDD2;--ink-400:#5E7C9C;--glass-hairline:rgba(77,200,224,0.10);--brand-green:#48B888}

/* top bar (the light-mode lines are !important: some intern pages carry an older !important light header) */
#pvxTopnav.topnav{z-index:300;background:var(--nav-bg);height:76px;min-height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-content:normal;
  padding:0 32px;margin:0;box-shadow:0 2px 24px rgba(0,0,0,0.25);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;transition:background .4s;}
#pvxTopnav.topnav::before,#pvxTopnav.topnav::after{content:none;display:none}
body.dark #pvxTopnav.topnav{background:#0D1730;border-bottom:1px solid rgba(255,255,255,0.04);}
body:not(.dark) #pvxTopnav.topnav{background:rgba(255,255,255,.96)!important;border-bottom:1px solid rgba(29,29,31,.08)!important;box-shadow:0 1px 0 rgba(29,29,31,.03)!important;}
#pvxTopnav img.logo{height:58.14px;width:auto;max-height:none;}
#pvxTopnav img.logo-dark{display:none;}
#pvxTopnav img.logo-light{display:block;}
body.dark #pvxTopnav img.logo-dark{display:block;}
body.dark #pvxTopnav img.logo-light{display:none;}
#pvxTopnav .brandwrap{display:flex;align-items:center;gap:20px;justify-self:start;min-width:0;}
#pvxTopnav .cobrand-div{width:1px;height:34px;background:#8098ae;opacity:.28;border-radius:1px;flex:0 0 auto;}
#pvxTopnav .pvx-lockup{display:flex;align-items:center;gap:8px;}
#pvxTopnav img.pvx-icon{height:34px;width:auto;}
#pvxTopnav .pvx-word{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;}
#pvxTopnav .pvx-powered{font-size:7px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-400);line-height:1;white-space:nowrap;}
#pvxTopnav img.pvx-mark{height:22px;width:auto;}
#pvxTopnav img.plogo-dark{display:none;}
#pvxTopnav img.plogo-light{display:block;}
body.dark #pvxTopnav img.plogo-dark{display:block;}
body.dark #pvxTopnav img.plogo-light{display:none;}
#pvxTopnav .nav-center{justify-self:center;display:flex;gap:3px;align-items:center;position:static;transform:none;margin:0;}
#pvxTopnav .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 13px;border-radius:var(--r-sm);
  cursor:pointer;transition:all .2s;color:rgba(255,255,255,0.55);font-size:10px;font-weight:600;letter-spacing:.3px;
  border:1px solid transparent;text-decoration:none;background:transparent;font-family:var(--font);white-space:nowrap;box-shadow:none;}
#pvxTopnav .nav-item:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9);}
#pvxTopnav .nav-item.active{background:rgba(77,200,224,0.15);color:var(--brand-cyan);border-color:rgba(77,200,224,0.25);}
#pvxTopnav .nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
body:not(.dark) #pvxTopnav .nav-item{color:#333333!important;}
body:not(.dark) #pvxTopnav .nav-item:hover{background:#EBEBEB!important;color:#636365!important;}
body:not(.dark) #pvxTopnav .nav-item.active{background:#EBEBEB!important;color:#636365!important;border-color:transparent!important;}
#pvxTopnav .nav-right{justify-self:end;display:flex;gap:10px;align-items:center;}
#pvxTopnav .theme-toggle{cursor:pointer;background:none;border:none;border-radius:50px;overflow:hidden;width:72px;height:34px;padding:0;
  flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,0.15);position:relative;transition:box-shadow .2s;}
#pvxTopnav .theme-toggle:hover{box-shadow:0 0 0 2px rgba(77,200,224,0.5);}
#pvxTopnav .theme-toggle img{width:72px;height:34px;object-fit:cover;display:block;border-radius:50px;pointer-events:none;transition:opacity .3s;position:absolute;top:0;left:0;}
#pvxTopnav .theme-toggle .img-light{opacity:1;} #pvxTopnav .theme-toggle .img-dark{opacity:0;}
body.dark #pvxTopnav .theme-toggle .img-light{opacity:0;} body.dark #pvxTopnav .theme-toggle .img-dark{opacity:1;}
body:not(.dark) #pvxTopnav .theme-toggle{box-shadow:0 0 0 1.5px rgba(29,29,31,.12)!important;}
body:not(.dark) #pvxTopnav .theme-toggle:hover{box-shadow:0 0 0 2px rgba(44,184,210,.5)!important;}

/* smaller screens — portal-nav.css's steps, again at this scope */
@media(max-width:1280px){#pvxTopnav .nav-item{padding:8px 10px}}
@media(max-width:1100px) and (min-width:761px){#pvxTopnav .nav-item{font-size:0;gap:0;padding:10px 11px;letter-spacing:0}#pvxTopnav .nav-item svg{width:19px;height:19px}}
@media(max-width:1024px){#pvxTopnav.topnav{column-gap:10px}}
@media(max-width:760px){#pvxTopnav.topnav{height:auto;min-height:0;padding:8px 16px 6px}#pvxTopnav .nav-item{flex:0 0 auto;padding:6px 10px}#pvxTopnav img.logo{height:44px}}

/* sub-nav — Flow's: the program's own pages on the left, this page's actions on the right */
#pvxSubnav.subnav{display:flex;align-items:center;gap:16px;padding:11px 32px;margin:0;position:relative;z-index:200;
  background:var(--nav-bg);opacity:.97;border-bottom:1px solid var(--glass-hairline);box-shadow:0 6px 20px rgba(0,0,0,0.12);}
body.dark #pvxSubnav.subnav{background:#101a32;}
body:not(.dark) #pvxSubnav.subnav{background:#FFFFFF;border-bottom:1px solid rgba(29,29,31,.08);box-shadow:0 1px 0 rgba(29,29,31,.03);}
#pvxSubnav .subnav-title{font-size:0.6875rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(77,200,224,0.65);white-space:nowrap;}
body:not(.dark) #pvxSubnav .subnav-title{color:#86868B;}
#pvxSubnav .switcher{display:flex;gap:3px;align-items:center;padding:0;background:transparent;border:none;min-width:0;overflow-x:auto;scrollbar-width:none;}
#pvxSubnav .switcher::-webkit-scrollbar{display:none}
#pvxSubnav .seg{display:flex;flex-direction:row;align-items:center;gap:7px;border:1px solid transparent;background:transparent;cursor:pointer;min-height:40px;
  font-family:var(--font);font-size:0.8125rem;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.01em;text-decoration:none;white-space:nowrap;
  padding:8px 14px;border-radius:var(--r-sm);transition:all .2s var(--ease);box-shadow:none;}
#pvxSubnav .seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
#pvxSubnav .seg:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);}
#pvxSubnav .seg.active{background:rgba(77,200,224,.15);color:var(--brand-cyan);border-color:rgba(77,200,224,.25);}

/* ═══ The printed assessment record — paper, not the screen ═══════════════════════════════════════
   Same paper system as the narrative records (_source/reviews/print.css): white stock, near-black ink,
   hairline rules, the four-colour bar, one cyan tick; Arial-pinned so it prints alike on every machine.
   Outside @media print on purpose: the paginator measures real block heights before printing. */
#printRoot,#printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
.pr-page{position:relative;width:7.5in;background:#fff;color:#14171C;
  font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:9pt;line-height:1.4;
  display:flex;flex-direction:column;}
.pr-flow{flex:1 1 auto;min-height:0;}

/* ── masthead (cover page) ── */
.pr-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:9px;}
.pr-mast img.pr-logo{width:147px;height:auto;display:block;}
.pr-mast .pr-pvx{display:flex;align-items:center;gap:6px;}
.pr-mast .pr-pvx img{height:15px;width:auto;display:block;}
.pr-mast .pr-pvx span{font-size:6pt;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#8A9099;}
.pr-rule{display:flex;height:3px;margin-bottom:16px;}
.pr-rule i{display:block;height:3px;}
.pr-rule i:nth-child(1){background:#38BDD2;flex:3;}
.pr-rule i:nth-child(2){background:#8B4DB5;flex:2;}
.pr-rule i:nth-child(3){background:#E8644A;flex:2;}
.pr-rule i:nth-child(4){background:#0C2952;flex:5;}

.pr-title{font-size:19pt;font-weight:800;letter-spacing:-.02em;margin:0 0 3px;color:#0C2952;}
.pr-subtitle{font-size:9.5pt;color:#5C6672;margin:0 0 18px;}

/* ── identity grid ── */
.pr-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #D8DDE3;margin-bottom:18px;}
.pr-meta div{padding:8px 11px;border-bottom:1px solid #E7EAEE;}
.pr-meta div:nth-child(odd){border-right:1px solid #E7EAEE;}
.pr-meta div:nth-last-child(-n+2){border-bottom:0;}
.pr-meta dt{font-size:6.5pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A9099;margin:0 0 2px;}
.pr-meta dd{margin:0;font-size:9.5pt;font-weight:600;color:#14171C;}

/* ── section label ── */
.pr-sec{display:flex;align-items:center;gap:7px;margin:0 0 8px;}
.pr-sec i{width:3px;height:11px;background:#38BDD2;flex:none;}
.pr-sec h2{margin:0;font-size:7.5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0C2952;}

/* ── domain scorecard (cover) ── */
.pr-score{width:100%;border-collapse:collapse;margin-bottom:16px;}
.pr-score th{text-align:left;font-size:6.5pt;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:#8A9099;padding:0 6px 5px;border-bottom:1px solid #D8DDE3;}
.pr-score th.n,.pr-score td.n{text-align:right;}
.pr-score th.n{white-space:nowrap;}
.pr-score td{padding:5px 6px;border-bottom:1px solid #EDEFF2;font-size:9pt;vertical-align:middle;}
.pr-score tr:last-child td{border-bottom:0;}
.pr-score td.d{font-weight:600;}
.pr-score td.num{width:22px;color:#8A9099;font-weight:700;font-variant-numeric:tabular-nums;}
.pr-score td.n{font-variant-numeric:tabular-nums;font-weight:700;width:46px;}
.pr-score td.rated{font-variant-numeric:tabular-nums;color:#5C6672;width:62px;text-align:right;}
.pr-bar{display:inline-block;width:78px;height:5px;background:#EDEFF2;position:relative;vertical-align:middle;}
.pr-bar i{position:absolute;left:0;top:0;bottom:0;background:#0C2952;}
.pr-bar{background-image:linear-gradient(#C9CED6,#C9CED6),linear-gradient(#C9CED6,#C9CED6),linear-gradient(#C9CED6,#C9CED6);background-size:1px 100%;background-position:0 0,50% 0,100% 0;background-repeat:no-repeat;}
.pr-bar.none{background:transparent;}
.pr-score th.sc{width:90px;}
.pr-ticks{display:flex;justify-content:space-between;width:78px;font-variant-numeric:tabular-nums;letter-spacing:0;}
.pr-ticks b{font-weight:800;}
.pr-mnote{margin:-10px 0 14px;font-size:7.5pt;line-height:1.45;color:#5C6672;}

/* ── anchor legend (cover) ── */
.pr-legend{border:1px solid #D8DDE3;padding:9px 11px;}
.pr-legend .l{display:flex;gap:8px;padding:3px 0;font-size:8pt;line-height:1.35;}
.pr-legend .l b{flex:0 0 15px;height:15px;border:1px solid #C6CCD3;display:flex;align-items:center;justify-content:center;
  font-size:7pt;font-weight:800;color:#5C6672;}
.pr-legend .l span{color:#14171C;}
.pr-legend .l span em{font-style:normal;font-weight:700;}
.pr-legend .l span i{font-style:normal;color:#5C6672;}

/* ── domain block ── */
.pr-domain{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  border-top:1.5px solid #0C2952;padding-top:7px;margin-bottom:9px;}
.pr-domain .t{display:flex;align-items:baseline;gap:8px;min-width:0;}
.pr-domain .t b{font-size:7.5pt;font-weight:800;color:#38BDD2;letter-spacing:.06em;font-variant-numeric:tabular-nums;}
.pr-domain .t h3{margin:0;font-size:12pt;font-weight:750;letter-spacing:-.02em;color:#0C2952;}
.pr-domain .m{font-size:7.5pt;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A9099;
  white-space:nowrap;font-variant-numeric:tabular-nums;}

/* ── competency item ── */
.pr-item{padding:7px 0;border-bottom:1px solid #EDEFF2;}
.pr-item .q{display:flex;gap:9px;}
.pr-item .q .ref{flex:0 0 34px;font-size:7.5pt;font-weight:800;color:#8A9099;padding-top:1px;
  font-variant-numeric:tabular-nums;}
.pr-item .q p{margin:0;font-size:9pt;line-height:1.4;color:#14171C;flex:1 1 auto;}
.pr-rate{display:flex;align-items:center;gap:8px;margin:5px 0 0 43px;}
.pr-boxes{display:flex;gap:3px;flex:none;}
.pr-boxes b{width:15px;height:15px;border:1px solid #C6CCD3;display:flex;align-items:center;justify-content:center;
  font-size:7pt;font-weight:700;color:#B0B6BD;font-variant-numeric:tabular-nums;}
.pr-boxes b.on{background:#0C2952;border-color:#0C2952;color:#fff;}
.pr-rate .lab{font-size:8.5pt;font-weight:700;color:#14171C;}
.pr-rate .lab.none{font-weight:500;color:#9AA1A9;font-style:italic;}
.pr-note{margin:5px 0 0 43px;padding-left:9px;border-left:2px solid #D8DDE3;
  font-size:8pt;line-height:1.45;color:#3D454E;}
.pr-note b{display:block;font-size:6.5pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:#8A9099;margin-bottom:2px;}

/* ── domain observations ── */
.pr-obs{margin-top:9px;border:1px solid #D8DDE3;background:#F8F9FA;padding:9px 11px;}
.pr-obs b{display:block;font-size:6.5pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:#0C2952;margin-bottom:3px;}
.pr-obs p{margin:0;font-size:8.5pt;line-height:1.5;color:#14171C;white-space:pre-wrap;}
.pr-obs p.none{color:#9AA1A9;font-style:italic;}

/* ── narrative (overall assessment) ── */
.pr-narr{margin-bottom:11px;}
.pr-narr b{display:block;font-size:7pt;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:#0C2952;margin-bottom:3px;}
.pr-narr p{margin:0;padding:8px 10px;border:1px solid #D8DDE3;min-height:34px;
  font-size:8.5pt;line-height:1.5;color:#14171C;white-space:pre-wrap;}
.pr-narr p.none{color:#9AA1A9;font-style:italic;}

/* ── attestation + signatures ── */
.pr-attest{border:1px solid #D8DDE3;padding:11px 13px;margin-bottom:14px;font-size:8.5pt;line-height:1.5;color:#3D454E;}
.pr-attest strong{color:#14171C;}
.pr-sign{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:12px;}
.pr-sign .row{position:relative;padding-top:26px;border-bottom:1px solid #14171C;}
.pr-sign .cap{display:flex;justify-content:space-between;gap:10px;padding-top:4px;
  font-size:7pt;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8A9099;}
.pr-sign .nm{font-size:8.5pt;font-weight:600;color:#14171C;padding-top:3px;}
.pr-date{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.pr-retain{margin-top:14px;font-size:7.5pt;line-height:1.5;color:#8A9099;}

/* ── running footer ── */
.pr-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-top:1px solid #D8DDE3;padding-top:5px;margin-top:12px;
  font-size:6.5pt;letter-spacing:.03em;color:#8A9099;}
.pr-foot span{white-space:nowrap}
.pr-foot .r{font-variant-numeric:tabular-nums;}

/* ── draft watermark ── */
.pr-draft{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-27deg);
  font-size:40pt;font-weight:800;letter-spacing:.06em;color:#000;opacity:.06;
  white-space:nowrap;pointer-events:none;z-index:0;}
.pr-page>*:not(.pr-draft){position:relative;z-index:1;}

.pr-legend .l span em{font-style:normal;font-weight:700;}
@media print{
  @page{size:letter;margin:.5in;}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;}
  body{margin:0!important;}
  .pr-page{width:auto;min-height:9.55in;break-after:page;page-break-after:always;}
  .pr-page:last-child{break-after:auto;page-break-after:auto;}
  .pr-item,.pr-obs,.pr-narr,.pr-sign,.pr-attest{break-inside:avoid;page-break-inside:avoid;}
}

<script>

/* Admin is a role record in Firestore (sgvp_roles/<email>), not a list baked into
   this file — granting someone access is a console edit, not a redeploy of five pages.
   BREAK_GLASS stays hardcoded on purpose: if the role document is missing, unreadable,
   or someone fat-fingers a rule, one account can still get in and repair it. */
window.__pvxIsAdmin = false;
window.__pvxUserEmail = '';
window.__pvxResolveAdmin = async function(user){
  if(!user || !user.email) return false;
  var email = user.email.toLowerCase();
  if(['daniel.giordano@pravix.app'].indexOf(email) !== -1) return true;
  try{
    if(window.firebase && firebase.firestore){
      var snap = await firebase.firestore().collection('sgvp_roles').doc(email).get();
      return !!(snap.exists && snap.data().admin === true);
    }
    /* This page has no Firestore SDK loaded. One REST read costs a few hundred bytes
       instead of pulling ~300 KB of SDK in just to check a boolean. */
    var tok = await user.getIdToken();
    var url = 'https://firestore.googleapis.com/v1/projects/shoreline-flow/databases/(default)'
            + '/documents/sgvp_roles/' + encodeURIComponent(email);
    var res = await fetch(url, {headers:{Authorization:'Bearer ' + tok}});
    if(!res.ok) return false;                       /* 404 = no role record = not admin */
    var j = await res.json();
    return !!(j.fields && j.fields.admin && j.fields.admin.booleanValue === true);
  }catch(e){ console.warn('role lookup', e); return false; }
};
(function(){
  var CFG={apiKey:"AIzaSyCf8iXW_wWRLvHi1G4YnYRH-iLpaDufZQE",authDomain:"shoreline-flow.firebaseapp.com",
    projectId:"shoreline-flow",storageBucket:"shoreline-flow.firebasestorage.app",
    messagingSenderId:"237404385636",appId:"1:237404385636:web:1ee3ba27f22c946f748a71"};
  try{
    if(!window.firebase||!firebase.auth) return;
    if(!firebase.apps.length) firebase.initializeApp(CFG);
    firebase.auth().onAuthStateChanged(async function(u){
      window.__pvxUserEmail=(u&&u.email||'').toLowerCase();
      window.__pvxIsAdmin=await window.__pvxResolveAdmin(u);
      if(!window.__pvxIsAdmin && typeof editMode!=='undefined' && editMode
         && typeof exitEdit==='function') exitEdit();
    });
  }catch(e){ console.warn('auth',e); }
})();
</script>
<script id="pvx-logout-js">
/* Logout — the same button in every Pravix app. A page with its own logout() keeps it; otherwise sign out of the shared account and open Flow's sign-in. */
(function(){
  window.pvxLogout=function(){ var b=document.getElementById('logoutBtn'); if(b){ b.disabled=true; b.style.opacity='.6'; }
    var go=function(){ location.replace('https://shoreline.pravix.app/#logout'); };
    try{ if(window.firebase&&firebase.apps&&firebase.apps.length&&typeof firebase.auth==='function'){ firebase.auth().signOut().catch(function(){}).then(go); return; } }catch(e){}
    go(); };
  window.pvxLogoutClick=function(){ if(typeof window.logout==='function'&&window.logout!==window.pvxLogout) return window.logout(); return window.pvxLogout(); };
  var lb=document.getElementById('logoutBtn'); if(!lb) return;
  lb.addEventListener('pointermove',function(e){ var r=lb.getBoundingClientRect(); lb.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); lb.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });
  lb.addEventListener('pointerleave',function(){ lb.style.setProperty('--mx','50%'); lb.style.setProperty('--my','50%'); });
})();
</script>

<!-- PVX-N138 shell: shared top bar (n132) + its type/contrast rules (n135), copied from Curriculum -->
<!-- PVX-TOPBAR n132: brand and controls keep their width; app links overflow into a More menu; Grid and Forms in every app (account-gated) -->
<style>
/* PVX-TOPBAR n132 — the brand and the right-hand controls keep their width; the apps get what is left, overflowing into More */
html body nav.topnav{grid-template-columns:max-content minmax(0,1fr) max-content!important;column-gap:12px}
html body nav.topnav .brandwrap{flex:0 0 auto;min-width:0}
html body nav.topnav .nav-center{min-width:0;max-width:100%;justify-self:center!important;overflow:visible!important;flex-wrap:nowrap;position:relative}
html body nav.topnav .nav-right{flex:0 0 auto}
@media(max-width:760px){ html body nav.topnav{grid-template-columns:max-content minmax(0,1fr)!important} html body nav.topnav .nav-center{margin:0!important;padding:0!important;justify-content:flex-start} }
.pvx-more{position:relative;display:flex;flex:0 0 auto}
.pvx-more[hidden]{display:none!important}
.pvx-more-btn{font-family:inherit;cursor:pointer}
.pvx-more-btn[aria-expanded=true]{background:rgba(255,255,255,0.10);color:rgba(255,255,255,.95)}
body:not(.dark) .pvx-more-btn[aria-expanded=true]{background:#EBEBEB;color:#333}
.pvx-more-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:400;min-width:200px;padding:6px;border-radius:14px;display:flex;flex-direction:column;gap:2px;
  background:#101A32;border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 44px rgba(0,0,0,.4)}
body:not(.dark) .pvx-more-menu{background:#fff;border-color:rgba(29,29,31,.1);box-shadow:0 18px 44px rgba(20,28,40,.18)}

<script>
/* ═══ Pravix shared top bar · n132 (audit RX-01, FL-07, DTA-S01, CL-X02, US-04) ═══
   The same nav.topnav lives in every app. This block makes it fit any width without collisions:
   · the brand and the Logout/theme group keep their real width (grid: max-content · 1fr · max-content) — nothing can slide under them;
   · the app links get the middle; the ones that do not fit move into a "More" menu (a real button with a menu of the same links),
     instead of being clipped inside a scroller with its scrollbar hidden. The active app always stays visible;
   · the More menu is keyboard-operable (Enter/Space, arrows, Escape, focus return) and closed state is display:none;
   · aria-current="page" follows the active link (apps that switch in place call pvxTopbar.setActive(id)). */
(function(){
  if(window.pvxTopbar) return;
  var nav=document.querySelector('nav.topnav'); if(!nav) return;
  var center=nav.querySelector('.nav-center'); if(!center) return;
  var more=document.createElement('div'); more.className='pvx-more'; more.hidden=true;
  more.innerHTML='<button type="button" class="nav-item pvx-more-btn" aria-haspopup="true" aria-expanded="false" aria-label="More apps" title="More apps">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>'
    +'<div class="pvx-more-menu" role="menu" aria-label="More apps" hidden></div>';
  center.appendChild(more); var btn=more.querySelector('button'), menu=more.querySelector('.pvx-more-menu');
  function items(){ return [].slice.call(center.querySelectorAll('.nav-item')).filter(function(a){ return a!==btn&&!a.classList.contains('pvx-more-btn'); }); }
  function shown(a){ return a.style.display!=='none'&&!a.hidden; }   /* account-gated links (Grid, Forms) are display:none until allowed */
  var gap=0, busy=false;
  function layout(){ if(busy) return; busy=true;
    try{ var all=items(); all.forEach(function(a){ center.insertBefore(a,more); a.removeAttribute('role'); });
      var vis=all.filter(shown); var PIN=['navGrid'];   /* PVX-N150: Grid always in More (unless it is the current app) */
      var pin=vis.filter(function(a){ return PIN.indexOf(a.id)>-1&&!(a.classList.contains('active')||a.getAttribute('aria-current')); }); vis=vis.filter(function(a){ return pin.indexOf(a)<0; });
      if(!vis.length&&!pin.length){ more.hidden=true; return; }
      gap=parseFloat(getComputedStyle(center).columnGap||getComputedStyle(center).gap)||0;
      more.hidden=true; var avail=center.clientWidth, w=vis.map(function(a){ return a.getBoundingClientRect().width; }), total=w.reduce(function(s,x){ return s+x; },0)+gap*(vis.length-1);
      if(!pin.length&&total<=avail+0.5){ menu.innerHTML=''; return; }
      more.hidden=false; var mw=more.getBoundingClientRect().width+gap, keep=0, used=0;
      for(var i=0;i<vis.length;i++){ if(used+w[i]+(i?gap:0)+mw<=avail){ used+=w[i]+(i?gap:0); keep++; } else break; }
      var active=vis.findIndex(function(a){ return a.classList.contains('active')||a.getAttribute('aria-current'); });
      if(active>=keep&&keep>0){ var a=vis.splice(active,1)[0]; vis.splice(keep-1,0,a); center.insertBefore(a,vis[keep]||more); }
      var hidden=vis.slice(keep).concat(pin); hidden.sort(function(x,y){ return all.indexOf(x)-all.indexOf(y); }); hidden.forEach(function(a){ menu.appendChild(a); a.setAttribute('role','menuitem'); });
      if(!hidden.length) more.hidden=true; }
    finally{ busy=false; } }
  function open(o){ var isOpen=!menu.hidden; if(o===undefined) o=!isOpen; if(o===isOpen) return; menu.hidden=!o; btn.setAttribute('aria-expanded',o?'true':'false');
    if(o){ var f=menu.querySelector('.nav-item'); if(f) f.focus(); } }
  btn.addEventListener('click',function(){ open(); });
  menu.addEventListener('keydown',function(e){ var f=[].slice.call(menu.querySelectorAll('.nav-item')), i=f.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); (f[i+1]||f[0]).focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); (f[i-1]||f[f.length-1]).focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); open(false); btn.focus(); } else if(e.key==='Tab'){ open(false); } });
  btn.addEventListener('keydown',function(e){ if(e.key==='ArrowDown'){ e.preventDefault(); open(true); } else if(e.key==='Escape'&&!menu.hidden){ e.preventDefault(); open(false); } });
  document.addEventListener('click',function(e){ if(!menu.hidden&&!more.contains(e.target)) open(false); },true);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!menu.hidden&&!more.contains(document.activeElement)) open(false); });
  function setActive(id){ items().forEach(function(a){ var on=a.id===id; a.classList.toggle('active',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); layout(); }
  /* keep aria-current in step with the visual active class, for apps that switch in place */
  items().forEach(function(a){ if(a.classList.contains('active')) a.setAttribute('aria-current','page'); else if(a.getAttribute('aria-current')==='page'&&!a.classList.contains('active')) a.removeAttribute('aria-current'); });
  var t; function soon(){ clearTimeout(t); t=setTimeout(layout,60); }
  if(window.ResizeObserver){ new ResizeObserver(soon).observe(nav); } window.addEventListener('resize',soon);
  new MutationObserver(function(ms){ if(ms.some(function(m){ return !more.contains(m.target); })) soon(); }).observe(center,{attributes:true,subtree:true,attributeFilter:['style','class','hidden']});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(soon); window.addEventListener('load',soon); layout();
  window.pvxTopbar={layout:layout,setActive:setActive,version:'n132'};
})();
</script>

<script>
/* PVX-N224 (HIG Icons) + N227 (HIG SF Symbols): a small line icon matches the weight of the text beside it.
   Icons drawn on a 24-unit grid get thinner as they get smaller (1.7 units is 0.85 pt at 12 pt). SF pairs a Regular label
   with a Regular symbol and a Semibold label with a Semibold one, so a stroked icon (up to 32 pt) is brought up to its label's
   weight (Anesia's table: Regular 1.6 · Medium 1.8 · Semibold 2.0 · Bold 2.25 on the 24-unit grid), and never under 1 pt.
   It only raises a line that's too thin; icons over 32 pt, filled shapes, charts and the shared top bar are left alone. */
(function () {
  'use strict';
  var T = { 100: 1.2, 200: 1.3, 300: 1.45, 400: 1.6, 500: 1.8, 600: 2.0, 700: 2.25, 800: 2.5, 900: 2.7 };
  var FLOOR = 1.0, MAXW = 32, SHAPES = 'path,circle,rect,line,polyline,polygon,ellipse';
  function labelWeight(svg) {
    var host = svg.closest('button,a,[role=button],label,li,.chip,.seg') || svg.parentElement;
    var list = host ? [host].concat([].slice.call(host.querySelectorAll('*'))) : [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if ([].some.call(e.childNodes, function (c) { return c.nodeType === 3 && c.textContent.trim().length > 1; }))

  const v = Number(raw) || 0;
  return `<div class="pr-rate"><div class="pr-boxes">${SCALE.map(s => `<b class="${v === Number(s[0]) ? 'on' : ''}">${s[0]}</b>`).join('')}</div>`
       + `<span class="lab${v ? '' : ' none'}">${prEsc(v ? SCALE[v - 1][2] : 'Not rated')}</span></div>`;

function prDate(ts) {

  /* ── sign-in (same card as the SGVP Overview) ── */

  }

  function showGate() {

  /* ── small UI helpers ── */
  let noteT = 0;
  function say(text, kind) {
    const stay = kind === 'error' || kind === 'warn';
    let n = $('.a-note');
    if (!n || n.dataset.text !== text) {
      if (n) n.remove();
      n = document.createElement('div'); n.className = 'a-note' + (stay ? ' stay' : ''); n.setAttribute('role', stay ? 'alert' : 'status'); n.dataset.text = text;
      n.innerHTML = (stay ? ICON.warn : '') + '<span></span>' + (stay ? `<button type="button" class="a-note-x" aria-label="Close">${ICON.x}</button>` : '');
      n.querySelector('span').textContent = text; document.body.appendChild(n);
      if (stay) n.querySelector('.a-note-x').addEventListener('click', () => { clearTimeout(noteT); n.remove(); });
      else { const hold = () => clearTimeout(noteT), arm = () => noteArm(n); n.addEventListener('mouseenter', hold); n.addEventListener('mouseleave', arm); n.addEventListener('focusin', hold); n.addEventListener('focusout', arm); }
    }
    clearTimeout(noteT); if (!stay) noteArm(n);
  }
  function noteArm(n) { clearTimeout(noteT); noteT = setTimeout(() => n.remove(), Math.max(4000, 70 * n.dataset.text.length)); }
  function sheet(html, onOpen) {
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div'); wrap.className = 'a-sheet-wrap';
    wrap.innerHTML = `<div class="a-sheet" role="dialog" aria-modal="true" aria-labelledby="aSheetT">${html}</div>`;
    const behind = [...document.body.children].filter(el => !el.inert && el.tagName !== 'SCRIPT' && el.id !== 'pvwPanel');
    behind.forEach(el => { el.inert = true; });
    document.body.appendChild(wrap);
    const box = wrap.firstElementChild;
    const close = () => { wrap.remove(); behind.forEach(el => { el.inert = false; }); document.removeEventListener('keydown', key, true); try { prevFocus && prevFocus.focus(); } catch (e) {} };
    function key(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      const f = [...box.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    document.addEventListener('keydown', key, true);
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
    box.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    if (onOpen) onOpen(box, close);
    setTimeout(() => { const f = box.querySelector('[autofocus],input,select,button.primary,button'); if (f) f.focus(); }, 30);
    return close;
  }
  function pill(st) {
    const m = { ns: ['ns', 'Not started'], draft: ['dr', 'Draft'], submitted: ['sb', 'Submitted'], open: ['sb', 'Open'], closed: ['cl', 'Closed'] }[st] || ['ns', st];
    return `<span class="a-pill ${m[0]}"><i></i>${m[1]}</span>`;
  }
  function progressOf(rev) {
    if (!rev) return { rated: 0, total: TOTAL };
    if (rev.progress && typeof rev.progress.rated === 'number') return rev.progress;
    return computeProgress(rev);
  }
  function computeProgress(rev) {
    let rated = 0; const A = rev.answers || {};
    DOMAINS.forEach(d => { const a = A[d.key] || {}; rated += d.overall ? (a[0] ? 1 : 0) : Object.keys(a).filter(k => a[k]).length; });
    return { rated, total: TOTAL };
  }
  function domainDone(rev, d) {
    const a = (rev.answers || {})[d.key] || {};
    if (d.overall) { const n = (rev.notes || {})[d.key] || {}; return !!a[0] && [1, 2, 3, 4].every(i => String(n[i] || '').trim()); }
    return d.questions.every((q, i) => a[i]);
  }
  const rated = (rev, d) => { const a = (rev.answers || {})[d.key] || {}; return d.overall ? (a[0] ? 1 : 0) : Object.keys(a).filter(k => a[k]).length; };

  /* ── data ── */
  async function loadMine() {
    const [as, rs] = await Promise.all([
      db.collection(C.assign).where('email', '==', S.email).get(),
      db.collection(C.reviews).where('email', '==', S.email).get()]);
    S.mine.assigns = as.docs.map(d => Object.assign({ id: d.id }, d.data()));
    S.mine.reviews = {}; rs.docs.forEach(d => { S.mine.reviews[d.id] = d.data(); });
    const ids = [...new Set(S.mine.assigns.map(a => a.round))];
    const got = await Promise.all(ids.map(id => db.collection(C.rounds).doc(id).get()));
    S.mine.rounds = {}; got.forEach(g => { if (g.exists) S.mine.rounds[g.id] = Object.assign({ id: g.id }, g.data()); });
  }
  async function loadRounds() {
    const r = await db.collection(C.rounds).get();
    S.all.rounds = r.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a, b) => (toDate(b.created_at) || 0) - (toDate(a.created_at) || 0));
    if (!S.all.rounds.some(x => x.id === S.all.roundId)) S.all.roundId = (S.all.rounds.find(x => x.status === 'open') || S.all.rounds[0] || {}).id || '';

  /* ── routing ── */

  async function route() {

      closeEditor();
      if (h.startsWith('all') && S.reader) {
        S.view = 'all'; const rid = h.split('/')[1]; if (rid) S.all.roundId = rid;
        await loadRounds(); await loadRound(S.all.roundId); renderAll(); return;
      }

  }

    root.innerHTML = `<div class="a-card a-empty"><h2>Reviews didn’t load</h2><p>${/permission/.test((e && e.code) || '') ? 'This account can’t open intern reviews.' : 'Check your connection, then reload the page.'}</p></div>`;
  }

    sheet(`<h2 id="aSheetT">New review round</h2><p>Name the round and pick the interns. You’ll assign evaluators to each intern next.</p>

          `<button type="button" role="option" data-email="${esc(d.email)}" aria-selected="${pick && pick.email === d.email}"${taken.has(d.email) ? ' disabled' : ''}>`
