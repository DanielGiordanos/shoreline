          /* next record number for this intern, across every round */
          const prev = await db.collection(C.assign).where('intern', '==', slug).get();
          const seq = prev.docs.reduce((n, d) => Math.max(n, Number((String(d.data().record_id).match(/-ASM-(\d+)$/) || [])[1]) || 0), 0) + 1;
          const record_id = `SGVP-${YEAR.code}-${i.num}-ASM-${String(seq).padStart(2, '0')}`;
          const aid = `${r.id}__${slug}__${email}`;
          await db.collection(C.assign).doc(aid).set({ round: r.id, intern: slug, email, evaluator_name: pn.value.trim(), record_id, created_at: ts(), created_by: S.email });
          close(); await loadRound(r.id); renderAll(); say(`${dr(pn.value.trim())} will see ${i.name} in My reviews.`);
        } catch (e) { err.textContent = 'The assignment wasn’t saved. ' + (denied(e) ? 'This doctor may already be assigned to this intern, or the round is closed.' : retry); err.hidden = false; valid(); }
      });
    });
  }

  async function unassign(aid) {
    const a = S.all.assigns.find(x => x.id === aid); if (!a) return;
    sheet(`<h2 id="aSheetT">Remove this evaluator?</h2><p>${esc(a.evaluator_name)} hasn’t started reviewing ${esc(intern(a.intern).name)}. Removing the assignment takes the intern off ${esc(dr(a.evaluator_name))}’s list. Record ${esc(a.record_id)} won’t be reused.</p>
      <div class="btns"><button type="button" class="a-btn" data-close>Keep</button><button type="button" class="a-btn primary" data-ok>Remove</button></div>`,
    (box, close) => box.querySelector('[data-ok]').addEventListener('click', async () => {
      try { await db.collection(C.assign).doc(aid).delete(); close(); await loadRound(S.all.roundId); renderAll(); }
      catch (e) { close(); say('The evaluator has already started, so the assignment stays.', 'warn'); await loadRound(S.all.roundId); renderAll(); }
    }));
  }

  async function toggleRound() {
    const r = S.all.rounds.find(x => x.id === S.all.roundId); if (!r) return;
    const closing = r.status === 'open';
    sheet(`<h2 id="aSheetT">${closing ? 'Close' : 'Reopen'} ${esc(r.name)}?</h2><p>${closing
      ? 'Evaluators can still read their reviews, but drafts can no longer be changed or submitted. You can reopen the round later.'
      : 'Evaluators can finish their drafts again.'}</p>
      <div class="btns"><button type="button" class="a-btn" data-close>Cancel</button><button type="button" class="a-btn primary" data-ok>${closing ? 'Close round' : 'Reopen round'}</button></div>`,
    (box, close) => box.querySelector('[data-ok]').addEventListener('click', async () => {
      try { await db.collection(C.rounds).doc(r.id).update({ status: closing ? 'closed' : 'open', updated_at: ts() }); close(); await loadRounds(); renderAll(); }
      catch (e) { close(); say('The round wasn’t changed. ' + (denied(e) ? `Only ${READERS_AND} can close or reopen rounds.` : retry), 'error'); }
    }));
  }

  /* ── one review ── */
  async function openReview(aid) {
    const aSnap = await db.collection(C.assign).doc(aid).get();
    if (!aSnap.exists) { say('That review isn’t assigned to you.', 'warn'); go('#mine'); return; }
    const a = Object.assign({ id: aid }, aSnap.data());
    const [rSnap, vSnap] = await Promise.all([db.collection(C.rounds).doc(a.round).get(), db.collection(C.reviews).doc(aid).get()]);
    const round = Object.assign({ id: a.round }, rSnap.exists ? rSnap.data() : { name: '', status: 'closed' });
    const mine = a.email === S.email;
    const rev = vSnap.exists ? vSnap.data() : { round: a.round, intern: a.intern, email: a.email, uid: S.uid, evaluator_name: a.evaluator_name,
      record_id: a.record_id, answers: {}, notes: {}, observations: {}, progress: { rated: 0, total: TOTAL }, status: 'draft' };
    closeEditor();
    S.open = { aid, a, round, rev, exists: vSnap.exists, mine, cur: S.open && S.open.aid === aid ? S.open.cur : 0,
      chain: Promise.resolve(), pending: {}, timer: 0, since: 0, openNotes: {} };
    S.open.unsub = db.collection(C.reviews).doc(aid).onSnapshot(s => {
      const o = S.open; if (!o || o.aid !== aid || !s.exists) return;
      const d = s.data(); if (d.status !== o.rev.status || (d.submitted_at && !o.rev.submitted_at)) { Object.assign(o.rev, { status: d.status, submitted_at: d.submitted_at, reopened_at: d.reopened_at }); o.exists = true; renderReview(false); }
    }, () => {});
    renderReview(true);
  }
  function closeEditor() { const o = S.open; if (!o) return; flush(); if (o.unsub) o.unsub(); S.open = null; }
  const editable = () => { const o = S.open; return o && o.mine && o.rev.status === 'draft' && o.round.status === 'open'; };

  function renderReview(top) {
    const o = S.open, r = o.rev, i = intern(o.a.intern), ed = editable(), d = DOMAINS[o.cur];
    const p = computeProgress(r), pct = Math.round(100 * p.rated / p.total);
    const doneN = DOMAINS.filter(x => domainDone(r, x)).length;
    const noN = DOMAINS.reduce((n, x) => n + Object.values((r.answers || {})[x.key] || {}).filter(v => v === NOT_OBSERVED).length, 0);
    let lock = '';
    if (r.status === 'submitted') lock = `<div class="a-lock">${ICON.lock}<span>Submitted ${esc(fmtDate(r.submitted_at))}. This review is locked.${S.reader ? '' : ` If something needs to change, ask ${READERS_OR} to reopen it.`}</span>`
      + (S.reader ? `<span style="flex:1"></span><button type="button" class="a-btn small" data-act="reopen">Reopen for ${esc(o.a.evaluator_name.split(',')[0])}</button>` : '') + `</div>`;
    else if (!o.mine) lock = `<div class="a-lock warn">${ICON.info}<span>${o.exists ? `You’re reading ${esc(o.a.evaluator_name)}’s draft. Only ${esc(dr(o.a.evaluator_name))} can change it.` : `${esc(dr(o.a.evaluator_name))} hasn’t started this review. Only ${esc(dr(o.a.evaluator_name))} can write it.`}</span></div>`;
    else if (o.round.status !== 'open') lock = `<div class="a-lock warn">${ICON.lock}<span>This round is closed, so the draft can’t be changed. Ask ${READERS_OR} to reopen the round.</span></div>`;
    else if (r.reopened_at) lock = `<div class="a-lock warn">${ICON.info}<span>${esc(READER_NAMES[r.reopened_by] || 'The program')} reopened this review on ${esc(fmtDate(r.reopened_at))}. Make your changes, then submit it again.</span></div>`;

    const back = S.reader && !o.mine ? '#all/' + encodeURIComponent(o.a.round) : '#mine';
    root.innerHTML = `<button type="button" class="a-crumb" data-go="${back}">${ICON.back}${S.reader && !o.mine ? 'All reviews' : 'My reviews'}</button>`
      + head(o.round.name, fullName(i), `${o.mine ? 'Your review' : 'Review by ' + esc(o.a.evaluator_name)} · ${esc(o.a.record_id)}${o.round.period ? ' · ' + esc(o.round.period) : ''}`,
        `<button type="button" class="a-btn" data-act="print">${ICON.print}Print${r.status === 'submitted' ? '' : ' draft'}</button>`
        + (ed ? `<button type="button" class="a-btn primary" data-act="submit">Review and submit</button>` : ''))
      + lock
      + `<div class="a-kpis">
          <div class="a-kpi"><div class="l">Completion</div><div class="v">${pct}<small>%</small></div><div class="a-bar"><i style="width:${pct}%"></i></div><div class="s">${p.rated} of ${p.total} items</div></div>
          <div class="a-kpi"><div class="l">Domains complete</div><div class="v">${doneN}<small> of 10</small></div><div class="s">${doneN === 10 ? (r.status === 'submitted' ? 'Every domain complete' : 'Ready to submit') : r.status === 'submitted' ? 'Blank items print as Not rated' : 'Rate every item to complete a domain'}</div></div>
          <div class="a-kpi"><div class="l">Not observed</div><div class="v">${noN}</div><div class="s">${o.mine ? 'Items you didn’t see' : `Items ${esc(dr(o.a.evaluator_name))} didn’t see`}</div></div>
          <div class="a-kpi"><div class="l">Status</div><div class="v" style="font-size:1rem;margin-top:10px">${pill(o.exists ? r.status : 'ns')}</div><div class="s">${r.status === 'submitted' ? 'Locked' : ed ? 'Saves as you go' : 'Read only'}</div></div>
        </div>`
      + `<div class="a-work"><nav class="a-rail" aria-label="Domains">${DOMAINS.map((x, k) => {
          const n = rated(r, x), t = x.overall ? 1 : x.questions.length, ok = domainDone(r, x);
          return `<button type="button" class="a-step${ok ? ' done' : ''}" data-step="${k}"${k === o.cur ? ' aria-current="step"' : ''}>`
            + `<span class="n">${ok ? ICON.check + '<span class="sr-only">Complete: </span>' : x.num}</span><span class="t">${esc(x.short)}</span><span class="c">${n}/${t}</span></button>`;
        }).join('')}</nav>
        <section class="a-panel" aria-labelledby="aDomT">${domainHTML(d, ed)}</section>
        <aside class="a-guide" aria-label="Rating guide"><h3>Rating guide</h3><p>Use the same anchors on every service. Rate only what you saw.</p>
          ${SCALE.map(s => `<div class="a-lvl"><b class="n">${s[0]}</b><div><b>${esc(s[2])}</b><p>${esc(s[3])}</p></div></div>`).join('')}
          <div class="a-lvl"><b class="n">${ICON.eyeSlash}</b><div><b>Not observed</b><p>You didn’t see this during the review period. It isn’t a low rating.</p></div></div>
          <div class="save">${ed ? `Your draft saves as you go. Submit locks it and sends it to ${READERS_AND}.` : 'Submitted reviews are part of the intern’s training record.'}</div></aside></div>`;
    if (top) requestAnimationFrame(() => { try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) {} });
  }

  function scale(key, qi, val, ed, label) {
    const vals = SCALE.map(s => s[0]).concat(NOT_OBSERVED), stop = vals.includes(val) ? val : vals[0];
    const ti = v => ` tabindex="${v === stop ? 0 : -1}"`;
    return `<div class="a-scale" role="radiogroup" aria-label="${esc(label)}">` + SCALE.map(s =>
      `<button type="button" role="radio" class="a-score" aria-checked="${val === s[0]}"${ti(s[0])} data-score="${s[0]}" data-key="${key}" data-q="${qi}"${ed ? '' : ' disabled'}><b>${s[0]}</b><span class="lv">${esc(s[1])}</span>`
      + (s[1].toLowerCase() === s[2].toLowerCase() ? '' : `<span class="sr-only">, ${esc(s[2])}</span>`) + `</button>`).join('')
      + `<button type="button" role="radio" class="a-score no" aria-checked="${val === NOT_OBSERVED}"${ti(NOT_OBSERVED)} data-score="${NOT_OBSERVED}" data-key="${key}" data-q="${qi}"${ed ? '' : ' disabled'}>${ICON.eyeSlash}<span>Not observed</span></button></div>`;
  }
  function domainHTML(d, ed) {
    const o = S.open, r = o.rev, A = (r.answers || {})[d.key] || {}, N = (r.notes || {})[d.key] || {};
    const k = DOMAINS.indexOf(d), prev = DOMAINS[k - 1], next = DOMAINS[k + 1], ok = domainDone(r, d);
    let body;
    if (d.overall) {
      body = `<div class="a-intro"><div class="eb">${d.num} · ${esc(d.title)}</div><h2 id="aDomT">${esc(d.subtitle)}</h2>
          <p>Summarize progression, entrustment, strengths, and priorities for continued development.</p></div>
        <div class="a-q"><div class="tag${A[0] ? ' ok' : ''}">Entrustment</div><h3>${esc(ENTRUSTMENT_Q)}</h3>${scale(d.key, 0, A[0], ed, 'Entrustment')}</div>`
        + OVERALL_PROMPTS.map((p, n) => `<div class="a-q"><div class="tag${String(N[n + 1] || '').trim() ? ' ok' : ''}">${esc(p[0])}</div><h3><label for="aN${n}">${esc(p[1])}</label></h3>`
          + `<textarea id="aN${n}" class="a-ta" data-note="${d.key}" data-q="${n + 1}" style="min-height:${n === 3 ? 140 : 96}px" ${ed ? 'placeholder="Specific, actionable feedback"' : 'readonly'}>${esc(N[n + 1] || '')}</textarea></div>`).join('');
    } else {
      body = `<div class="a-intro"><div class="eb">${d.num} · ${esc(d.title)}</div><h2 id="aDomT">${esc(d.subtitle)}</h2>
          <p>Rate only performance you directly observed. Choose Not observed for anything you didn’t see. Add a note only when it adds context.</p></div>`
        + d.questions.map((q, qi) => {
          const v = A[qi], note = String(N[qi] || ''), show = note || o.openNotes[d.key + qi];
          return `<div class="a-q" id="aQ${qi}"><div class="tag${v ? ' ok' : ''}">Competency ${Number(d.num)}.${qi + 1}</div><h3>${esc(q)}</h3>`
            + scale(d.key, qi, v, ed, `Competency ${Number(d.num)}.${qi + 1}`)
            + (show ? `<label class="sr-only" for="aI${qi}">Note for competency ${Number(d.num)}.${qi + 1}</label><textarea id="aI${qi}" class="a-ta" data-note="${d.key}" data-q="${qi}" ${ed ? 'placeholder="Context for this rating"' : 'readonly'}>${esc(note)}</textarea>`
                    : ed ? `<button type="button" class="a-btn quiet small a-notebtn" data-act="add-note" data-q="${qi}">${ICON.plus}Add note</button>` : '')
            + `</div>`;
        }).join('')
        + `<div class="a-obs"><h3><label for="aObs">Clinical observations</label></h3><p>Examples, patterns, strengths, or concerns from this domain.</p>`
        + `<textarea id="aObs" class="a-ta" data-obs="${d.key}" ${ed ? `placeholder="Observations for ${esc(d.short)}"` : 'readonly'}>${esc((r.observations || {})[d.key] || '')}</textarea></div>`;
    }
    return body + `<div class="a-foot">${prev ? `<button type="button" class="a-btn" data-step="${k - 1}">${ICON.back}${esc(prev.short)}</button>` : '<span></span>'}`
      + `<span class="st${ok ? ' ok' : ''}">${ok ? esc(d.short) + ' complete' : `Domain ${d.num} of 10`}</span>`
      + (next ? `<button type="button" class="a-btn primary" data-step="${k + 1}">${esc(next.short)}</button>`
              : ed ? `<button type="button" class="a-btn primary" data-act="submit">Review and submit</button>` : '<span></span>') + `</div>`;
  }

  /* ── saving: silent, field by field, one write at a time ── */
  function setField(path, value) {
    const o = S.open; if (!o || !editable()) return;
    const parts = path.split('.'); let t = o.rev;
    for (let k = 0; k < parts.length - 1; k++) { t[parts[k]] = t[parts[k]] || {}; t = t[parts[k]]; }
    if (value === null) delete t[parts[parts.length - 1]]; else t[parts[parts.length - 1]] = value;
    o.pending[path] = value;
    if (!o.since) o.since = Date.now();
    clearTimeout(o.timer); o.timer = setTimeout(flush, 700);
  }
  function flush() {
    const o = S.open; if (!o) return o;
    clearTimeout(o.timer);
    const changes = o.pending; if (!Object.keys(changes).length) return o.chain;
    o.pending = {};
    const ref = db.collection(C.reviews).doc(o.aid);
    o.rev.progress = computeProgress(o.rev);
    const write = () => {
      if (!o.exists) {
        const r = o.rev;
        return ref.set({ round: r.round, intern: r.intern, email: S.email, uid: S.uid, evaluator_name: r.evaluator_name, record_id: r.record_id,
          answers: r.answers || {}, notes: r.notes || {}, observations: r.observations || {}, progress: r.progress, status: 'draft',
          created_at: ts(), updated_at: ts() }).then(() => { o.exists = true; });
      }
      const u = { progress: o.rev.progress, updated_at: ts() };
      Object.keys(changes).forEach(p => { u[p] = changes[p] === null ? del() : changes[p]; });
      return ref.update(u);
    };
    o.chain = o.chain.then(write).then(() => { if (!Object.keys(o.pending).length) o.since = 0; }, e => {
      console.warn('save', e);
      if (/permission/.test((e && e.code) || '')) say('That change didn’t save: this review is locked or its round is closed. Reload to see the latest.', 'error');
      else say('That change didn’t save. Check your connection; your next change will try again.', 'error');
      Object.assign(o.pending, changes);   // keep it for the next try
    });
    return o.chain;
  }
  setInterval(() => { const o = S.open; if (o && o.since && Date.now() - o.since > WARN_AFTER) { say('Some changes haven’t reached the database yet. Keep this page open until you’re back online.', 'warn'); o.since = Date.now(); } }, 30000);
  addEventListener('beforeunload', e => { const o = S.open; if (o && Object.keys(o.pending).length) { flush(); e.preventDefault(); e.returnValue = ''; } });
  addEventListener('pagehide', () => flush());

  function refreshChrome() {
    /* repaint progress, rail and tags without re-rendering text areas the evaluator is typing in */
    const o = S.open, r = o.rev, p = computeProgress(r), pct = Math.round(100 * p.rated / p.total);
    const k = root.querySelectorAll('.a-kpi');
    if (k[0]) { k[0].querySelector('.v').innerHTML = `${pct}<small>%</small>`; k[0].querySelector('.a-bar i').style.width = pct + '%'; k[0].querySelector('.s').textContent = `${p.rated} of ${p.total} items`; }
    const doneN = DOMAINS.filter(x => domainDone(r, x)).length;
    if (k[1]) { k[1].querySelector('.v').innerHTML = `${doneN}<small> of 10</small>`; k[1].querySelector('.s').textContent = doneN === 10 ? 'Ready to submit' : 'Rate every item to complete a domain'; }
    const noN = DOMAINS.reduce((n, x) => n + Object.values((r.answers || {})[x.key] || {}).filter(v => v === NOT_OBSERVED).length, 0);
    if (k[2]) k[2].querySelector('.v').textContent = noN;
    if (k[3] && !o.exists) k[3].querySelector('.v').innerHTML = pill('draft');
    root.querySelectorAll('.a-step').forEach((b, n) => {
      const x = DOMAINS[n], ok = domainDone(r, x);
      b.classList.toggle('done', ok); b.querySelector('.n').innerHTML = ok ? ICON.check + '<span class="sr-only">Complete: </span>' : x.num;
      b.querySelector('.c').textContent = `${rated(r, x)}/${x.overall ? 1 : x.questions.length}`;
    });
    const d = DOMAINS[o.cur], st = root.querySelector('.a-foot .st'), ok = domainDone(r, d);
    if (st) { st.classList.toggle('ok', ok); st.textContent = ok ? d.short + ' complete' : `Domain ${d.num} of 10`; }
  }

  function submitSheet() {
    flush();
    const o = S.open, r = o.rev, p = computeProgress(r);
    const rows = DOMAINS.map(d => { const n = rated(r, d), t = d.overall ? 1 : d.questions.length, ok = domainDone(r, d);
      return `<li>${esc(d.num + ' · ' + d.short)}<span>${ok ? '<b class="a-ok">Complete</b>' : d.overall ? (n ? 'Narratives incomplete' : 'Not rated') : `${n} of ${t} rated`}</span></li>`; }).join('');
    const missing = p.total - p.rated;
    sheet(`<h2 id="aSheetT">Submit your review of ${esc(intern(o.a.intern).name)}?</h2>
      <p>${missing ? `${missing} item${missing === 1 ? ' is' : 's are'} still blank and will print as Not rated. Mark anything you didn’t see as Not observed instead. ` : 'Every item has a rating. '}After you submit, the review is locked and goes to ${READERS_AND}. You can still read and print it.</p>
      <ul class="a-list">${rows}</ul>
      <p style="margin-top:12px;font-size:.8125rem;color:var(--a-ink-3)">By submitting, you confirm that the ratings and observations are your own and reflect performance you directly observed.</p>
      <div class="btns"><button type="button" class="a-btn" data-close>Keep editing</button><button type="button" class="a-btn primary" data-ok>Submit review</button></div>`,
    (box, close) => box.querySelector('[data-ok]').addEventListener('click', async () => {
      const b = box.querySelector('[data-ok]'); b.disabled = true; b.textContent = 'Submitting…';
      try {
        if (!o.exists) { o.pending['status'] = 'draft'; flush(); }   // a review with no changes yet still needs its document
        await o.chain;
        await db.collection(C.reviews).doc(o.aid).update({ status: 'submitted', submitted_at: ts(), updated_at: ts(), progress: computeProgress(r) });
        const fresh = await db.collection(C.reviews).doc(o.aid).get();
        Object.assign(r, fresh.data()); close(); renderReview(true); say(`Submitted. ${READERS_AND} have your review.`);
      } catch (e) { b.disabled = false; b.textContent = 'Submit review'; say('The review wasn’t submitted. ' + (/permission/.test((e && e.code) || '') ? 'Its round may be closed.' : 'Check your connection, then try again.'), 'error'); }
    }));
  }

  function reopenSheet() {
    const o = S.open;
    sheet(`<h2 id="aSheetT">Reopen this review?</h2><p>${esc(dr(o.a.evaluator_name))} can change the ratings and must submit again. The ratings and text stay as they are until then.</p>
      <div class="btns"><button type="button" class="a-btn" data-close>Cancel</button><button type="button" class="a-btn primary" data-ok>Reopen</button></div>`,
    (box, close) => box.querySelector('[data-ok]').addEventListener('click', async () => {
      try {
        await db.collection(C.reviews).doc(o.aid).update({ status: 'draft', reopened_at: ts(), reopened_by: S.email });
        const fresh = await db.collection(C.reviews).doc(o.aid).get(); Object.assign(o.rev, fresh.data()); close(); renderReview(false);
      } catch (e) { close(); say('The review wasn’t reopened. ' + (denied(e) ? 'It may already be open.' : retry), 'error'); }
    }));
  }

  function printReview() {
    const o = S.open;
    flush();
    buildPrintRecord({ rev: Object.assign({}, o.rev, { evaluator_name: o.a.evaluator_name, record_id: o.a.record_id }),
      round: o.round, internName: fullName(intern(o.a.intern)) });
    requestAnimationFrame(() => window.print());
  }

  /* ── events ── */
  function wire() {
    root.addEventListener('click', e => {
      const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
      const st = e.target.closest('[data-step]');
      if (st && S.open) { flush(); S.open.cur = Number(st.dataset.step); renderReview(false); const h = $('#aDomT'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); const y = h.closest('.a-panel').getBoundingClientRect().top; const nav = $('#pvxSubnav') || $('#pvxTopnav'); const off = Math.max(0, nav ? nav.getBoundingClientRect().bottom : 0) + 16; if (y < off || y > innerHeight * 0.6) window.scrollTo({ top: Math.max(0, scrollY + y - off), behavior: 'auto' }); } return; }
      const sc = e.target.closest('.a-score');
      if (sc && !sc.disabled && S.open) {
        const key = sc.dataset.key, qi = sc.dataset.q, v = sc.dataset.score, cur = ((S.open.rev.answers || {})[key] || {})[qi];
        const nv = cur === v ? null : v;   // choosing the selected rating again clears it
        setField(`answers.${key}.${qi}`, nv);
        sc.parentElement.querySelectorAll('.a-score').forEach(b => { b.setAttribute('aria-checked', String(b.dataset.score === nv)); b.tabIndex = b === sc ? 0 : -1; });
        const tag = sc.closest('.a-q') && sc.closest('.a-q').querySelector('.tag');
        if (tag) tag.classList.toggle('ok', !!nv);
        refreshChrome(); return;
      }
      const act = e.target.closest('[data-act]'); if (!act) return;
      const a = act.dataset.act;
      if (a === 'add-note' && S.open) {
        const d = DOMAINS[S.open.cur], qi = act.dataset.q; S.open.openNotes[d.key + qi] = true; renderReview(false);
        const t = $('#aI' + qi); if (t) t.focus(); return;
      }
      if (a === 'submit') return submitSheet();
      if (a === 'print') return printReview();
      if (a === 'reopen') return reopenSheet();
      if (a === 'new-round') return newRound();
      if (a === 'assign') return assign(act.dataset.intern);
      if (a === 'unassign') return unassign(act.dataset.aid);
      if (a === 'toggle-round') return toggleRound();
    });
    root.addEventListener('keydown', e => {
      const sc = e.target.closest && e.target.closest('.a-score'); if (!sc || sc.disabled) return;
      const all = [...sc.parentElement.querySelectorAll('.a-score')], i = all.indexOf(sc);
      const to = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: all.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      const t = all[(to + all.length) % all.length];
      all.forEach(b => { b.tabIndex = b === t ? 0 : -1; }); t.focus();
      if (t.getAttribute('aria-checked') !== 'true') t.click();
    });
    root.addEventListener('change', e => {
      if (e.target.matches('[data-act=pick-round]')) go('#all/' + encodeURIComponent(e.target.value));
    });
    root.addEventListener('input', e => {
      const t = e.target; if (!S.open) return;
      if (t.dataset.note) { setField(`notes.${t.dataset.note}.${t.dataset.q}`, t.value); refreshChrome(); }
      else if (t.dataset.obs) setField(`observations.${t.dataset.obs}`, t.value);
    });
    root.addEventListener('focusout', e => { if (e.target.matches('.a-ta')) flush(); });
    addEventListener('hashchange', route);
  }

  /* ── boot ── */
  function boot() {
    root = document.getElementById('asm');
    if (!firebaseApp()) { root.innerHTML = '<div class="a-card a-empty"><h2>Can’t reach Pravix</h2><p>Check your connection, then reload the page.</p></div>'; return; }
    wire();
    firebase.auth().onAuthStateChanged(u => {
      closeEditor();
      if (!u) { S.email = ''; showGate(); return; }
      hideGate();
      S.email = String(u.email || '').toLowerCase(); S.uid = u.uid;
      const d = DOCTORS.find(x => x.email === S.email);
      S.name = u.displayName || (d && d.name) || S.email;
      S.reader = REVIEW_READERS.includes(S.email);
      if (INTERNS.some(i => i.email === S.email)) {
        root.innerHTML = head('Intern reviews', 'Your reviews', '') + `<div class="a-card a-empty"><h2>Reviews are written by your evaluators</h2>
          <p>Each review is gone over with you at your one-on-one, and you get a signed copy then.</p></div>`;
        return;
      }
      if (!location.hash && S.reader) history.replaceState(null, '', '#all');   // Daniel and Heather start on All reviews
      route();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
