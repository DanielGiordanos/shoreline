<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Forms · Pravix</title>
<script>(function(){try{var m=document.cookie.match(/(?:^|;\s*)pvx_theme=(light|dark)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);}catch(e){}})();</script>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --bg:#080E1A;--nav:#0A1222;--s0:#0E1628;--s1:#131E34;--s2:#192540;--ink:#D8E8F4;--ink2:#A7C2D8;--ink3:#7A98B8;--line:rgba(77,200,224,.10);--line2:rgba(150,185,220,.32);
  --accent:#187A91;--accent-ink:#4DC8E0;--good:#48B888;--good-ink:#7FD6AE;--warn:#EBC95D;--warn-bg:rgba(235,201,93,.12);--bad:#E8928A;--paper-bg:#060B15;--fill:rgba(150,185,220,.10);--sel:rgba(56,189,210,.14);
  --b-visit:rgba(56,189,210,.22);--b-visit-line:#1F8FA8;--b-family:rgba(56,189,210,.14);--b-ending:rgba(168,136,224,.22);--b-ending-line:#8064C8;--b-sign:rgba(235,201,93,.28);--b-sign-line:#C49628;--b-none:rgba(150,170,200,.18);--b-none-line:#8A97AB;--b-todo:rgba(232,100,74,.20);--b-todo-line:#E8644A}
:root[data-theme="light"]{--bg:#F2F4F8;--nav:#FFFFFF;--s0:#FFFFFF;--s1:#F7F8FB;--s2:#EDF0F5;--ink:#14181F;--ink2:#4B5563;--ink3:#6B7280;--line:rgba(30,45,90,.08);--line2:rgba(30,45,90,.18);--accent:#1F7F96;--accent-ink:#1F7F96;--good-ink:#2E8A5E;--warn:#9A6E0E;--warn-bg:rgba(235,201,93,.18);--bad:#C2412D;--paper-bg:#E4E8EF;--fill:rgba(30,45,90,.06);--sel:rgba(31,143,168,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 24px;background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:170px;text-decoration:none;color:inherit}
.brand i{width:30px;height:30px;border-radius:9px;background:#2F55BE;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff}
.brand b{font-size:17px}.brand span{font-weight:500;color:var(--ink2)}
.apps{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center}
.apps a{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.apps a:hover{background:var(--fill)}.apps a[aria-current]{color:var(--ink);background:var(--sel);box-shadow:inset 0 0 0 1px rgba(56,189,210,.35)}
.who{display:flex;align-items:center;gap:10px;min-width:170px;justify-content:flex-end;font-size:12.5px;color:var(--ink2)}
.btn{min-height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line2);background:transparent;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--fill)}.btn.primary{background:var(--accent);border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent}.btn.danger{color:var(--bad)}.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--fill);color:var(--ink)}.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(56,189,210,.35)!important}
.ok-ic{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:var(--good-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* library */
.lib{max-width:1160px;margin:0 auto;padding:44px 28px 64px;display:flex;flex-direction:column;gap:30px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.lib-head h1{margin:0;font-size:34px;font-weight:750;letter-spacing:-.02em}.lib-head p{margin:6px 0 0;color:var(--ink2);line-height:1.5;font-size:15px}
.lib-head .btn.primary{min-height:44px;padding:0 18px;font-size:14.5px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--fill)}
.seg button{min-height:36px;padding:0 14px;white-space:nowrap;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--s2);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 28px}
.tile{display:flex;flex-direction:column;gap:12px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer;width:100%;border-radius:14px}
.tthumb{aspect-ratio:3/4;border-radius:12px;background:var(--paper-bg);padding:18px;display:flex;align-items:center;justify-content:center;transition:transform .18s ease,box-shadow .18s ease}
.tile:hover .tthumb{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(77,200,224,.28)}
.tthumb .pg{width:100%;max-height:100%;background:#fff;border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:60%}
.tthumb .pg img{display:block;width:100%;height:auto}
.tmeta{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.tmeta b{font-size:15px;font-weight:650;line-height:1.3}.tmeta span{font-size:13px;color:var(--ink2)}.tmeta small{font-size:12.5px;color:var(--ink3)}
.chip{align-self:flex-start;margin-top:5px;font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--ink2)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:44px;border-radius:18px;border:1px dashed var(--line2);text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-size:17px}
.steps{display:flex;flex-wrap:wrap;border-radius:18px;background:var(--s0);border:1px solid var(--line);overflow:hidden}
.steps div{flex:1 1 230px;padding:16px 20px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line);font-size:14px;line-height:1.45}
.steps div:last-child{border-right:0}.steps span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.howlink{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;border:0;background:transparent;color:var(--accent-ink);font-size:13.5px;font-weight:600;cursor:pointer}
.howlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
/* mapper */
.map{display:flex;flex-wrap:wrap;min-height:calc(100vh - 65px)}
.map-bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--nav);position:sticky;top:65px;z-index:15;width:100%}
.map-bar .name{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:4px}
.map-bar input.title{border:0;background:transparent;font-size:16px;font-weight:650;padding:5px 6px;border-radius:8px;outline:0;min-width:60px;width:auto;max-width:100%;field-sizing:content}
.map-bar input.title:hover,.map-bar input.title:focus{background:var(--fill)}
.map-bar .sub{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.map-bar .right{flex:1 1 240px;display:flex;align-items:center;justify-content:flex-end;gap:14px}
.saved{font-size:12.5px;color:var(--ink3);display:inline-flex;align-items:center;gap:5px;min-width:60px;justify-content:flex-end}
.saved svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.side{flex:1 1 250px;max-width:290px;padding:16px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:130px}
.rev{display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;border-radius:12px;background:var(--s0)}
.rev-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:650}.rev-t em{font-style:normal;font-size:12.5px;color:var(--warn)}
.rev-t em.good{color:var(--good-ink)}.rev p{margin:0;font-size:12px;line-height:1.45;color:var(--ink2)}
.rev .btn{min-height:34px;font-size:12.5px;align-self:flex-start;padding:0 12px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.bar i{display:block;height:6px;background:var(--warn)}.bar i.good{background:var(--good)}
.bgroup{display:flex;flex-direction:column;gap:1px}
.bgroup h4{margin:0;display:flex;align-items:center;gap:8px;padding:0 10px 5px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.bitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;padding:4px 10px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer}
.bitem:hover{background:var(--fill)}.bitem.on{background:var(--sel);box-shadow:inset 0 0 0 1px rgba(56,189,210,.45)}
.bitem b{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bitem small{font-size:11px;color:var(--ink3);margin-left:4px}
.bst{font-size:12px;font-weight:650;flex:0 0 auto}.bst.rv{color:var(--warn)}.bst.mp{color:var(--bad)}
.addbox{min-height:40px;border-radius:10px;border:1px dashed var(--line2);background:transparent;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.addbox svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.paper{flex:999 1 560px;min-width:0;background:var(--paper-bg);padding:14px 24px 26px;display:flex;flex-direction:column;align-items:center;gap:22px;overflow-x:auto}
.pnote{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;min-height:28px}
.pnote.rosie{color:var(--warn)}.pnote .btn{min-height:30px;font-size:12.5px;padding:0 10px}
.tip{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--s1);font-size:13px;color:var(--ink2);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.page{position:relative;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.45);border-radius:3px;user-select:none;-webkit-user-select:none;touch-action:none;flex:0 0 auto}
.page canvas{display:block;width:100%;height:auto;border-radius:3px}
.page .pno{position:absolute;left:-2px;top:-21px;font-size:12px;color:var(--ink3)}
.rosie .page{touch-action:auto}
.box{position:absolute;border-radius:3px;cursor:move;display:flex;align-items:center;overflow:visible}
.box .lab{display:block;padding:0 5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;pointer-events:none;font-family:var(--font);letter-spacing:0}
.box em{position:absolute;left:0;top:-17px;font-style:normal;font-size:10px;font-weight:700;color:#fff;padding:1px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;font-family:var(--font)}
.box.small:hover em,.box.small.on em{opacity:1}
.box.on{outline:2px solid #1F8FA8;outline-offset:1px;box-shadow:0 0 0 5px rgba(56,189,210,.22)!important;z-index:3}
.box .h{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid #1F8FA8;cursor:nwse-resize;display:none}
.box.on .h{display:block}
.drawing{position:absolute;border:1.5px dashed #1F8FA8;background:rgba(56,189,210,.12);pointer-events:none}
.zoom{position:sticky;bottom:18px;z-index:5;display:flex;align-items:center;gap:2px;padding:4px;border-radius:13px;background:var(--s1);box-shadow:0 10px 28px rgba(0,0,0,.4);border:1px solid var(--line)}
.zoom button{min-width:36px;height:36px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;padding:0 10px}
.zoom button:hover{background:var(--fill)}.zoom button[disabled]{opacity:.35;cursor:default}
.zoom .z{min-width:52px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.zoom .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.zoom svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.insp{flex:1 1 300px;max-width:340px;padding:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:130px}
.insp h3{margin:0;font-size:18px;font-weight:650}.insp .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.insp .pdfname{font-size:12px;color:var(--ink3);margin-top:3px}
.sugg{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--warn-bg);box-shadow:inset 0 0 0 1px rgba(235,201,93,.3)}
.sugg .k{color:var(--warn)}.sugg b{font-size:15px;font-weight:600}.sugg span{font-size:12.5px;line-height:1.45;color:var(--ink2)}
.sugg .btn.primary{min-height:40px;font-size:14px}
.fld{display:flex;flex-direction:column;gap:7px}.fld>span,.fld>label{font-size:13px;font-weight:600}.fld small{font-size:12px;color:var(--ink2);line-height:1.45}
.fld select,.fld input[type=text]{min-height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:var(--s0);font-size:14px;width:100%}
.search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--s0);box-shadow:inset 0 0 0 1px var(--line2)}
.search svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round}
.fld .search input[type=text]{flex:1;min-width:0;width:auto;border:0;border-radius:0;background:transparent;font-size:14px;outline:0;min-height:38px;padding:0}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px rgba(56,189,210,.35)}
.fld .search input:focus-visible{box-shadow:none!important}
.srcs{display:flex;flex-direction:column;border-radius:12px;background:var(--s0);padding:6px;max-height:300px;overflow:auto;border:1px solid var(--line)}
.srcs h5{margin:0;padding:8px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.srcs button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-size:13.5px;text-align:left;cursor:pointer}
.srcs button:hover{background:var(--fill)}.srcs button[aria-pressed="true"]{background:var(--sel);font-weight:600}
.srcs .none{padding:10px 8px;font-size:13px;color:var(--ink3)}
.grp{border-radius:12px;background:var(--s0);overflow:hidden;border:1px solid var(--line)}
.grp label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 14px;font-size:14px}
.grp label+label{border-top:1px solid var(--line)}.grp input[type=checkbox]{width:20px;height:20px;accent-color:#1F8FA8}
.insp .seg{display:flex}.insp .seg button{flex:1;padding:0 6px}
input[type=radio]:focus-visible{border-radius:50%}
.facts{display:flex;flex-direction:column;border-radius:12px;background:var(--s0);border:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;font-size:13.5px}.facts div+div{border-top:1px solid var(--line)}.facts span{color:var(--ink2)}
.note{padding:12px 14px;border-radius:12px;background:var(--fill);font-size:13px;line-height:1.5;color:var(--ink2)}
.note.warn{background:var(--warn-bg);color:var(--ink)}
.spacer{flex:1}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(3,7,15,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
.sheet{width:min(860px,100%);background:var(--s1);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.sheet header b{flex:1;font-size:16px}
.sheet.pub{width:min(560px,100%);background:var(--s0)}
.sheet.pub header{display:grid;grid-template-columns:1fr auto 1fr;padding:6px 10px}.sheet.pub header b{text-align:center;font-weight:650}
.sheet.pub header .btn{justify-self:start;color:var(--accent-ink);font-size:15px;font-weight:500}
.pub-body{padding:20px 22px;display:flex;flex-direction:column;gap:22px}
.pub-form{display:flex;align-items:center;gap:14px}.pub-form .mini{width:46px;height:60px;border-radius:3px;background:#fff;overflow:hidden;flex:0 0 46px;box-shadow:0 4px 12px rgba(0,0,0,.3)}.pub-form .mini img{width:100%;display:block}
.pub-form b{font-size:17px;font-weight:650;display:block}.pub-form span{font-size:13px;color:var(--ink2)}
.pub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.choices{display:flex;flex-direction:column;border-radius:14px;background:var(--s1);overflow:hidden;border:1px solid var(--line)}
.choices label{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;cursor:pointer}.choices label+label{border-top:1px solid var(--line)}
.choices input{width:20px;height:20px;accent-color:#1F8FA8;flex:0 0 20px}.choices b{display:block;font-size:15px;font-weight:600}.choices span span{font-size:12.5px;color:var(--ink2)}
.checks{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.checks div{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}.checks div span{flex:1}.checks .opt{color:var(--ink2)}
.checks .todo-ic{width:16px;height:16px;flex:0 0 16px;border-radius:8px;border:2px solid var(--warn)}.checks .opt-ic{width:16px;height:16px;flex:0 0 16px;border-radius:8px;border:2px solid var(--line2)}
.checks .btn{min-height:32px;font-size:12.5px;padding:0 12px}
.pub-note{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.pub-foot{padding:6px 22px 22px;display:flex;flex-direction:column;gap:8px}.pub-foot .btn.primary{min-height:50px;font-size:16px;border-radius:14px}
.how{padding:20px 22px 24px;display:flex;flex-direction:column;gap:12px}.how div{display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.45}.how span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#050A14;color:#E6EEF6;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:min(440px,calc(100vw - 32px))}
.pstatus{min-height:40px;display:flex;align-items:center;justify-content:center;align-self:stretch}
.mtoast{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:12px;background:#050A14;color:#E6EEF6;font-size:13.5px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
:root[data-theme="light"] .mtoast{background:#14181F}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form,.gate .box2{width:min(380px,100%);background:var(--s0);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-size:22px}.gate p{margin:0;color:var(--ink2);font-size:14px}
.gate input{min-height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;font-size:15px}

<body>
<div id="app"><div class="gate"><div class="box2"><h1>Forms</h1><p>Loading…</p></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="lib/pvx-pdf.js?v=20261013b"></script>
<script src="lib/pvx-forms.js?v=20261013b"></script>
<script>
(function(){
'use strict';
/* Pravix Forms (Oct 13 2026; n123 design pass). The hospital's own PDFs, mapped once; Flow fills them and the family signs them
   on the iPad. Only the accounts below can open it for now (like Grid and Kura). Nothing about a template leaves this browser
   except what is saved to the hospital's own database (form_templates). */
var ALLOWED=['daniel.giordano@pravix.app'];
var TENANT='shoreline', HOSPITAL='VCA Shoreline Veterinary Referral & Emergency Center';
firebase.initializeApp({apiKey:'AIzaSyCf8iXW_wWRLvHi1G4YnYRH-iLpaDufZQE',authDomain:'shoreline-flow.firebaseapp.com',projectId:'shoreline-flow',
  storageBucket:'shoreline-flow.firebasestorage.app',messagingSenderId:'237404385636',appId:'1:237404385636:web:1ee3ba27f22c946f748a71'});
var AUTH=firebase.auth(), DB=firebase.firestore(), F=window.PvxForms, P=window.PvxPdf;
var $=function(s,r){ return (r||document).querySelector(s); }, $$=function(s,r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var ICON={up:'<path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/>',back:'<path d="M15 6l-6 6 6 6"/>',fwd:'<path d="M9 6l6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',dl:'<path d="M12 4v12"/><path d="M6 10l6 6 6-6"/><path d="M4 20h16"/>',ok:'<path d="M5 12l4 4 10-10"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
function ic(n,c){ return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(c?' class="'+c+'"':'')+'>'+ICON[n]+'</svg>'; }
var state={user:null,view:'lib',filter:'all',list:[],tpl:null,bytes:null,sel:null,saving:0,savedAt:null,dirty:false,mode:'edit',zoom:null,q:'',previewed:false,sheet:null,pageNo:0};
function who(){ var u=state.user; return u&&(u.displayName||u.email)||''; }
function toast(t){ if(state.view==='map'&&$('#pstatus')&&!$('.scrim')){ state.note={t:t,until:Date.now()+2800}; paintStatus(); setTimeout(paintStatus,2900); return; } var e=document.createElement('div'); e.className='toast'; e.setAttribute('role','status'); e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); },2600); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

/* ---------- sign-in ---------- */
function gate(text,fields){
  $('#app').innerHTML='<div class="gate">'+(fields?'<form id="gf"><h1>Forms</h1><p>'+esc(text)+'</p><input id="ge" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required><input id="gp" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><div class="err" id="gerr" role="alert"></div><button class="btn primary" type="submit">Sign in</button></form>'
    :'<div class="box2"><h1>Forms</h1><p>'+esc(text)+'</p><button class="btn" type="button" id="gout">Use another account</button></div>')+'</div>';
  if(fields){ $('#gf').addEventListener('submit',function(e){ e.preventDefault(); $('#gerr').textContent='';
    AUTH.signInWithEmailAndPassword($('#ge').value.trim(),$('#gp').value).catch(function(){ $('#gerr').textContent='That email and password didn’t match.'; }); }); setTimeout(function(){ var g=$('#ge'); if(g) g.focus(); },50); }
  else $('#gout').addEventListener('click',function(){ AUTH.signOut(); });
}
AUTH.onAuthStateChanged(function(u){ state.user=u||null;
  if(!u) return gate('Sign in with your Pravix account.',true);
  if(ALLOWED.indexOf(String(u.email||'').toLowerCase())<0) return gate('This account can’t open Forms yet.',false);
  loadList().then(function(){ var id=(location.hash.match(/tpl=([\w-]+)/)||[])[1]; if(id){ var t=state.list.filter(function(x){ return x.id===id; })[0]; if(t) return openTpl(t); } render(); });
});

/* ---------- data ---------- */
function loadList(){ return DB.collection('form_templates').where('tenant_id','==',TENANT).get().then(function(s){
  state.list=s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }).filter(function(t){ return t.status!=='archived'; })
    .sort(function(a,b){ return String(b.updated_at||'').localeCompare(String(a.updated_at||'')); }); })
  .catch(function(e){ console.warn('[forms] list',e); state.list=[]; toast('Couldn’t load the forms. Check the connection.'); }); }
function statusOf(t){ var pr=F.progress(t); if(t.status==='ready') return {k:'ready',t:'Ready'}; if(pr.total&&(pr.missing||pr.review)) return {k:'todo',t:'Needs review'}; return {k:'draft',t:'Draft'}; }
function whereText(t){ return t.purpose==='ending'?('Flow › Other ending › Send form'+(t.kind==='died'?' (died)':' (euthanasia)')):'Flow › patient drawer › Send a form'; }
function whereShort(t){ return t.purpose==='ending'?(t.kind==='died'?'Died ending':'Euthanasia ending'):'Patient drawer'; }
function firstName(s){ s=String(s||''); if(s.indexOf('@')>-1){ s=s.split('@')[0].split(/[._-]/)[0]; } else s=s.split(' ')[0]; return s?s.charAt(0).toUpperCase()+s.slice(1):''; }
function when(d){ if(!d) return ''; var x=new Date(d), n=new Date(); if(isNaN(x)) return ''; var day=function(a){ return new Date(a.getFullYear(),a.getMonth(),a.getDate()).getTime(); }, diff=Math.round((day(n)-day(x))/864e5);
  return diff===0?'today':diff===1?'yesterday':'on '+F.fmtDate(d,'en').replace(/, \d{4}$/,x.getFullYear()===n.getFullYear()?'':', '+x.getFullYear()); }
var saveT=null;
function queueSave(){ state.dirty=true; state.savedAt=null; paintSaved(); clearTimeout(saveT); saveT=setTimeout(saveNow,700); }
function saveNow(){ var t=state.tpl; if(!t) return Promise.resolve(); clearTimeout(saveT); state.dirty=false;
  var doc={name:t.name||'Untitled form',purpose:t.purpose||'visit',kind:t.purpose==='ending'?(t.kind||'euthanasia'):null,status:t.status==='ready'&&F.progress(t).ready?'ready':(t.status==='ready'?'draft':t.status||'draft'),
    boxes:t.boxes||[],updated_at:new Date().toISOString(),updated_by:who()};
  t.status=doc.status; state.saving++; paintSaved();
  return DB.collection('form_templates').doc(t.id).set(doc,{merge:true}).then(function(){ state.saving--; state.savedAt=new Date(); paintSaved(); })
    .catch(function(e){ state.saving--; state.dirty=true; paintSaved(); console.warn('[forms] save',e); toast('Not saved — only an admin can change forms.'); }); }
function paintSaved(){ var e=$('#saved'); if(!e) return; e.innerHTML=state.saving?'Saving…':state.dirty?'Edited':state.savedAt?ic('ok')+'Saved':''; }
window.addEventListener('beforeunload',function(e){ if(state.dirty||state.saving){ e.preventDefault(); e.returnValue=''; } });

/* ---------- upload ---------- */
function pickFile(){ var i=document.createElement('input'); i.type='file'; i.accept='application/pdf,.pdf'; i.onchange=function(){ if(i.files&&i.files[0]) upload(i.files[0]); }; i.click(); }
function upload(file){
  if(file.size>15*1024*1024){ toast('That PDF is over 15 MB. Save a smaller copy and try again.'); return; }
  toast('Reading '+file.name+'…');
  file.arrayBuffer().then(function(buf){ var bytes=new Uint8Array(buf);
    return P.inspect(bytes).then(function(info){
      if(info.encrypted) throw new Error('This PDF is password-protected. Save an unlocked copy first.');
      if(info.pages.some(function(p){ return p.rotate; })) toast('Some pages are rotated; boxes are placed on the page as stored.');
      return P.sha256(bytes).then(function(h){
        var id=F.newId('ft_'), boxes=F.boxesFromFields(info.fields), now=new Date().toISOString();
        var tpl={tenant_id:TENANT,name:F.humanize(file.name.replace(/\.pdf$/i,'')),purpose:'visit',kind:null,status:'draft',
          file:{name:file.name,size:bytes.length,sha256:h,pages:info.pages.map(function(p){ return {w:p.w,h:p.h}; })},boxes:boxes,created_at:now,created_by:who(),updated_at:now,updated_by:who()};
        return F.putParts(DB,'form_templates',id,bytes).then(function(n){ tpl.file.parts=n; return DB.collection('form_templates').doc(id).set(tpl); })
          .then(function(){ tpl.id=id; state.list.unshift(tpl); var g=boxes.filter(function(b){ return b.guess; }).length;
            openTpl(tpl,bytes); toast(boxes.length?('Found '+boxes.length+' fields in the PDF'+(g?' · '+g+' suggestions to review':'')):'No fields in this PDF — draw a box where each answer goes.'); });
      });
    });
  }).catch(function(e){ console.warn('[forms] upload',e); toast(e&&e.message?e.message:'Couldn’t read that PDF.'); });
}

/* ---------- views ---------- */
function shell(inner){ var u=state.user;
  return '<header class="top"><a class="brand" href="./" data-go="lib"><i>P</i><b>Pravix <span>Forms</span></b></a>'
    +'<nav class="apps" aria-label="Pravix apps"><a href="/directory/">Directory</a><a href="/sgvp/assets/">Assets</a><a href="/sgvp/">Curriculum</a><a href="/scheduling/">Schedule</a><a href="/">Flow</a><a href="/#app=ultrasound">Ultrasound</a><a href="/treatment/">Treatment</a><a href="/#app=rounds">Rounds</a><a href="/or/">OR</a><a href="/grid/">Grid</a><a href="./" aria-current="page">Forms</a></nav>'
    +'<div class="who"><span>VCA Shoreline</span><span>'+esc(u&&(u.displayName||u.email)||'')+'</span></div></header>'+inner; }
function render(){ if(state.view==='map'&&state.tpl) return renderMap(); renderLib(); }
var STEPS='<div><span>1 · Map</span>Point each blank on the PDF at a Pravix field. Once.</div><div><span>2 · Send</span>From the patient drawer: Send a form. Reception sees it.</div><div><span>3 · Sign</span>Staff take the iPad into the room. The family signs; staff witness.</div><div><span>4 · File</span>The hospital’s PDF, filled and locked, saved on the visit with its fingerprint.</div>';
function renderLib(){ state.view='lib'; state.sheet=null; document.body.classList.remove('mapping'); if(location.hash) history.replaceState(null,'',location.pathname);
  var L=state.list, counts={all:L.length,ready:0,todo:0,draft:0}; L.forEach(function(t){ counts[statusOf(t).k]++; });
  var showSeg=L.length>8, f=showSeg?state.filter:'all', show=L.filter(function(t){ return f==='all'||statusOf(t).k===f; }), anyReady=counts.ready>0;
  var h='<main class="lib"><div class="lib-head"><div><h1>Forms</h1><p>Your hospital’s own paperwork — filled by Flow, signed on the iPad.</p></div>'
    +(L.length?'<button class="btn primary" type="button" data-act="upload">'+ic('up')+'Upload a PDF</button>':'')+'</div>';
  if(showSeg) h+='<div class="seg" role="radiogroup" aria-label="Show">'+[['all','All'],['ready','Ready'],['todo','Needs review'],['draft','Drafts']].filter(function(x){ return x[0]==='all'||counts[x[0]]; }).map(function(x){ return '<button type="button" role="radio" aria-checked="'+(f===x[0])+'" data-filter="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>';
  if(!L.length) h+='<div class="empty"><b>No forms yet</b><span>Upload a PDF your hospital already uses — a fillable one or a scan. You’ll point each blank at a Pravix field.</span><button class="btn primary" type="button" data-act="upload">'+ic('up')+'Upload a PDF</button></div>';
  else h+='<div class="tiles">'+show.map(function(t){ var pr=F.progress(t), ready=t.status==='ready', line;
    if(ready) line='<small>Edited '+esc(when(t.updated_at))+(t.updated_by?' by '+esc(firstName(t.updated_by)):'')+'</small>';
    else if(pr.missing) line='<span class="chip warn">'+pr.missing+' box'+(pr.missing===1?'':'es')+' to map</span>';
    else if(pr.review) line='<span class="chip warn">Review '+pr.review+' suggestion'+(pr.review===1?'':'s')+'</span>';
    else line='<span class="chip">Ready to publish</span>';
    return '<button type="button" class="tile" data-open="'+esc(t.id)+'" aria-label="'+esc((t.name||'Untitled form')+', '+(ready?whereShort(t):'not in Flow yet'))+'"><span class="tthumb"><span class="pg" data-thumb="'+esc(t.id)+'"></span></span>'
      +'<span class="tmeta"><b>'+esc(t.name||'Untitled form')+'</b><span>'+esc(ready?whereShort(t):'Not in Flow yet')+'</span>'+line+'</span></button>'; }).join('')+'</div>';
  if(!anyReady) h+='<section class="steps" aria-label="How it works">'+STEPS+'</section>';
  else h+='<button type="button" class="howlink" data-act="how">'+ic('info')+'How Forms works</button>';
  h+='</main>';
  $('#app').innerHTML=shell(h);
  show.forEach(function(t){ thumb(t); });
}
var thumbs={};
function thumb(t,sel){ sel=sel||'[data-thumb="'+t.id+'"]'; var el=$(sel); if(!el) return;
  var put=function(u){ var e=$(sel); if(!e) return; e.innerHTML=''; var img=new Image(); img.src=u; img.alt=''; e.appendChild(img); };
  var key=t.id+':'+(t.file&&t.file.sha256); if(thumbs[key]){ put(thumbs[key]); return; }
  F.templateBytes(DB,t).then(function(b){ return P.renderPage(b,0,0.6); }).then(function(c){ thumbs[key]=c.toDataURL('image/png'); put(thumbs[key]); }).catch(function(){}); }

function openTpl(t,bytes){ state.tpl=JSON.parse(JSON.stringify(t)); state.tpl.boxes=state.tpl.boxes||[]; state.sel=null; state.view='map'; state.bytes=bytes||null; state.savedAt=new Date();
  $$('.toast').forEach(function(e){ e.remove(); });
  state.mode='edit'; state.zoom=null; state.q=''; state.previewed=false; state.sheet=null; state.note=null; rosie=null;
  history.replaceState(null,'','#tpl='+t.id);
  (bytes?Promise.resolve(bytes):F.templateBytes(DB,t)).then(function(b){ state.bytes=b; renderMap(); }).catch(function(e){ toast(e.message||'Couldn’t open the PDF'); state.view='lib'; renderLib(); }); renderMap(); }

var COLORS={visit:['var(--b-visit)','var(--b-visit-line)','#1F8FA8','#235E6C'],family:['var(--b-family)','var(--b-visit-line)','#38BDD2','#235E6C'],ending:['var(--b-ending)','var(--b-ending-line)','#A888E0','#54448A'],sign:['var(--b-sign)','var(--b-sign-line)','#EBC95D','#6E5208'],staff:['var(--b-none)','var(--b-none-line)','#8A97AB','#3F4856'],none:['var(--b-none)','var(--b-none-line)','#8A97AB','#3F4856'],todo:['var(--b-todo)','var(--b-todo-line)','#E8644A','#93321F']};
var GROUPS=[['todo','Not mapped yet'],['visit','From the visit'],['family','Family answers'],['ending','Aftercare'],['sign','Signatures'],['staff','Staff types it'],['none','Left blank']];
function groupName(k){ return (GROUPS.filter(function(g){ return g[0]===k; })[0]||['',''])[1]; }
function whoOf(b){ if(!F.isMapped(b)) return 'todo'; var s=F.source(b.src); return s?s.who:'none'; }
function colorOf(b){ return COLORS[whoOf(b)]||COLORS.none; }
function boxName(b){ var s=F.source(b.src); if(!s) return b.field?F.humanize(b.field):'New box';
  if(s.custom) return (b.label&&b.label.en)||s.t; if(b.src==='aftercare.care'){ var o=(s.opts||[]).filter(function(x){ return x[0]===b.opt; })[0]; return 'Care · '+(o?o[1]:'pick which'); } return s.t.replace(/ · ticks when chosen$/,'').replace(/ \(staff in the room\)$/,''); }
function boxSub(b){ var s=F.source(b.src); if(!s) return 'Not mapped yet'; return ({visit:'Flow fills it',family:'The family checks it',ending:'From the aftercare choices',sign:'Signed on the iPad',staff:'Staff type it',none:'Left blank'})[s.who]||''; }
function srcHelp(s){ if(!s) return ''; return ({visit:'Flow fills it from the visit.',family:'The family types it on the iPad. Pre-filled when Flow already knows it.',ending:'From the family’s aftercare choices.',sign:'Signed on the iPad.',staff:'Staff type it when they send the form.',none:'This box stays empty.'})[s.who]||''; }

var SCALE=1.25, ZOOMS=[0.5,0.75,1,1.25,1.5,2], rosie=null;
function baseW(i){ return state.tpl.file.pages[i].w*SCALE; }
function zoomNow(){ if(state.zoom!=null) return state.zoom; var pa=$('.paper'), avail=pa?pa.clientWidth-48:900; var z=Math.min(1,avail/baseW(0)); return Math.max(0.4,Math.round(z*100)/100); }
function renderMap(){
  var t=state.tpl, pr=F.progress(t), pages=(t.file&&t.file.pages)||[], sel=t.boxes.filter(function(b){ return b.id===state.sel; })[0]||null, R=state.mode==='rosie';
  document.body.classList.add('mapping');
  var h='<div class="map-bar"><button class="btn quiet" type="button" data-act="back">'+ic('back')+'Forms</button>'
    +'<div class="name"><input class="title" id="tname" value="'+esc(t.name||'')+'" aria-label="Form name" size="'+Math.max(8,Math.min(40,(t.name||'').length+1))+'"><button type="button" class="icon-btn" data-act="rename" aria-label="Rename">'+ic('pen')+'</button><span class="sub">'+pages.length+' page'+(pages.length===1?'':'s')+'</span></div>'
    +'<div class="seg" role="radiogroup" aria-label="View"><button type="button" role="radio" aria-checked="'+!R+'" data-mode="edit">Edit</button><button type="button" role="radio" aria-checked="'+R+'" data-mode="rosie"'+(state.bytes?'':' disabled')+'>Show with Rosie</button></div>'
    +'<div class="right"><span class="saved" id="saved" aria-live="polite"></span>'
    +(t.status==='ready'?'<button class="btn" type="button" data-act="publish">'+ic('ok')+'In Flow</button>':'<button class="btn primary" type="button" data-act="publish">Publish…</button>')+'</div></div>';
  /* left: review progress + boxes grouped by where they come from */
  var rev;
  if(!pr.total) rev='<div class="rev"><div class="rev-t"><span>No boxes yet</span></div><p>Drag on the page where each answer goes.</p></div>';
  else if(pr.missing) rev='<div class="rev"><div class="rev-t"><span>Map the boxes</span><em>'+pr.missing+' to map</em></div><div class="bar"><i style="width:'+Math.round(pr.confirmed/pr.total*100)+'%"></i></div><p>'+pr.confirmed+' of '+pr.total+' boxes confirmed.'+(pr.review?' Dashed boxes are Pravix’s guesses.':'')+'</p><button class="btn" type="button" data-act="next">Next box</button></div>';
  else if(pr.review) rev='<div class="rev"><div class="rev-t"><span>Review suggestions</span><em>'+pr.review+' left</em></div><div class="bar"><i style="width:'+Math.round(pr.confirmed/pr.total*100)+'%"></i></div><p>'+pr.confirmed+' of '+pr.total+' boxes confirmed. Dashed boxes are Pravix’s guesses.</p><button class="btn" type="button" data-act="next">Review next</button></div>';
  else rev='<div class="rev"><div class="rev-t"><span>'+(pr.total===1?'1 box confirmed':'All '+pr.total+' boxes confirmed')+'</span><em class="good">'+(t.status==='ready'?'In Flow':'Ready')+'</em></div><div class="bar"><i class="good" style="width:100%"></i></div></div>';
  var multi=pages.length>1, sorted=t.boxes.slice().sort(order);
  h+='<div class="map'+(R?' rosie':'')+'"><aside class="side" aria-label="Boxes">'+rev
    +(pr.hasOwnerSig?'':'<div class="note warn">Draw a box where the owner signs, and set it to <b>Owner signature</b>.</div>')
    +'<div role="listbox" aria-label="Boxes on the form" style="display:flex;flex-direction:column;gap:16px">'+GROUPS.map(function(g){ var rows=sorted.filter(function(b){ return whoOf(b)===g[0]; }); if(!rows.length) return '';
      return '<section class="bgroup"><h4><i class="dot" style="background:'+COLORS[g[0]][2]+'"></i>'+g[1]+'</h4>'+rows.map(function(b){ var st=!F.isMapped(b)?'<span class="bst mp">Map</span>':b.guess?'<span class="bst rv">Review</span>':ic('ok','ok-ic');
        return '<button type="button" role="option" aria-selected="'+(b.id===state.sel)+'" class="bitem'+(b.id===state.sel?' on':'')+'" data-sel="'+b.id+'"><b>'+esc(boxName(b))+(multi?'<small>p'+(b.page+1)+'</small>':'')+'</b>'+st+'</button>'; }).join('')+'</section>'; }).join('')+'</div>'
    +'<button class="addbox" type="button" data-act="addhelp">'+ic('plus')+'Draw a box</button></aside>';
  /* the page */
  var z=zoomNow(); state.zoomShown=z;
  h+='<section class="paper" aria-label="The PDF">';
  h+='<div class="pstatus" id="pstatus" role="status" aria-live="polite">'+statusHtml()+'</div>';
  pages.forEach(function(pg,i){ h+='<div class="page" data-page="'+i+'" style="width:'+Math.round(baseW(i)*z)+'px">'+(multi?'<span class="pno">Page '+(i+1)+' of '+pages.length+'</span>':'')+'<div class="canvas-slot" style="aspect-ratio:'+pg.w+' / '+pg.h+'"></div></div>'; });
  h+='<div class="zoom" role="toolbar" aria-label="Zoom"><button type="button" data-zoom="-1" aria-label="Zoom out"'+(z<=ZOOMS[0]?' disabled':'')+'>−</button><span class="z" aria-live="polite">'+Math.round(z*100)+'%</span><button type="button" data-zoom="1" aria-label="Zoom in"'+(z>=ZOOMS[ZOOMS.length-1]?' disabled':'')+'>+</button><span class="sep"></span><button type="button" data-zoom="fit">Fit</button>'
    +(multi?'<span class="sep"></span><button type="button" data-pg="-1" aria-label="Previous page">'+ic('back')+'</button><span class="z" id="pgno">'+(state.pageNo+1)+' of '+pages.length+'</span><button type="button" data-pg="1" aria-label="Next page">'+ic('fwd')+'</button>':'')+'</div></section>';
  h+='<aside class="insp" aria-label="Selected box">'+(sel?inspector(sel):formFacts(t))+'</aside></div>';
  var keepFocus=document.activeElement&&document.activeElement.id;
  $('#app').innerHTML=shell(h); paintSaved();
  if(keepFocus){ var kf=document.getElementById(keepFocus); if(kf){ kf.focus(); if(kf.id==='bq'&&kf.setSelectionRange){ var n=kf.value.length; kf.setSelectionRange(n,n); } } }
  stick();
  if(state.bytes) pages.forEach(function(pg,i){ drawPage(i); });
  if(R) showRosie(); else paintBoxes();

}
