<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --bg:#080E1A;--nav:#0A1222;--s0:#0E1628;--s1:#131E34;--s2:#192540;--ink:#D8E8F4;--ink2:#A7C2D8;--ink3:#7A98B8;--line:rgba(77,200,224,.10);--line2:rgba(150,185,220,.32);
  --accent:#1F8FA8;--accent-ink:#4DC8E0;--good:#48B888;--good-ink:#7FD6AE;--warn:#EBC95D;--bad:#E8928A;--paper-bg:#060B15;--fill:rgba(150,185,220,.10);--sel:rgba(56,189,210,.14);
  --b-visit:rgba(56,189,210,.22);--b-visit-line:#1F8FA8;--b-family:rgba(56,189,210,.14);--b-ending:rgba(168,136,224,.22);--b-ending-line:#8064C8;--b-sign:rgba(235,201,93,.28);--b-sign-line:#C49628;--b-none:rgba(150,170,200,.18);--b-none-line:#8A97AB;--b-todo:rgba(232,100,74,.20);--b-todo-line:#E8644A}
:root[data-theme="light"]{--bg:#F2F4F8;--nav:#FFFFFF;--s0:#FFFFFF;--s1:#F7F8FB;--s2:#EDF0F5;--ink:#14181F;--ink2:#4B5563;--ink3:#6B7280;--line:rgba(30,45,90,.08);--line2:rgba(30,45,90,.18);--accent:#1F7F96;--accent-ink:#1F7F96;--good-ink:#2E8A5E;--paper-bg:#E4E8EF;--fill:rgba(30,45,90,.06);--sel:rgba(31,143,168,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 24px;background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:170px;text-decoration:none;color:inherit}
.brand i{width:30px;height:30px;border-radius:9px;background:#2F55BE;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff}
.brand b{font-size:17px}.brand span{font-weight:500;color:var(--ink2)}
.apps{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center}
.apps a{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.apps a:hover{background:var(--fill)}.apps a[aria-current]{color:var(--ink);background:var(--sel);box-shadow:inset 0 0 0 1px rgba(56,189,210,.35)}
.who{display:flex;align-items:center;gap:10px;min-width:170px;justify-content:flex-end;font-size:12.5px;color:var(--ink2)}
.btn{min-height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line2);background:transparent;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--fill)}.btn.primary{background:var(--accent);border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:transparent}.btn.danger{color:var(--bad)}.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(56,189,210,.35)!important}
/* library */
.lib{max-width:1200px;margin:0 auto;padding:36px 28px 60px;display:flex;flex-direction:column;gap:24px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.lib-head h1{margin:0;font-size:32px;font-weight:750;letter-spacing:-.02em}.lib-head p{margin:8px 0 0;max-width:640px;color:var(--ink2);line-height:1.5;font-size:15px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--fill)}
.seg button{min-height:36px;padding:0 12px;white-space:nowrap;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-size:13px;font-weight:550;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--s2);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{display:flex;gap:16px;padding:16px;border-radius:18px;background:var(--s0);border:1px solid var(--line);text-align:left;cursor:pointer;width:100%}
.card:hover{border-color:rgba(77,200,224,.28)}
.thumb{flex:0 0 92px;height:119px;border-radius:6px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.thumb canvas{width:100%;height:auto;display:block}
.card-b{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.pill{align-self:flex-start;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.ready{background:rgba(72,184,136,.16);color:var(--good-ink)}.pill.draft{background:var(--fill);color:var(--ink2)}.pill.todo{background:rgba(235,201,93,.16);color:#C9A23A}
:root:not([data-theme="light"]) .pill.todo{color:var(--warn)}
.card h2{margin:0;font-size:16px;font-weight:650;line-height:1.3}.card p{margin:0;font-size:13px;line-height:1.45;color:var(--ink2)}.card small{font-size:12px;color:var(--ink3)}
.empty{padding:40px;border-radius:18px;border:1px dashed var(--line2);text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.steps{display:flex;flex-wrap:wrap;border-radius:18px;background:var(--s0);border:1px solid var(--line);overflow:hidden}
.steps div{flex:1 1 230px;padding:16px 20px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line);font-size:14px;line-height:1.45}
.steps div:last-child{border-right:0}.steps span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
/* mapper */
.map{display:flex;flex-wrap:wrap;min-height:calc(100vh - 65px)}
.map-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--nav);position:sticky;top:65px;z-index:15;width:100%}
.map-bar .name{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.map-bar input.title{border:0;background:transparent;font-size:16px;font-weight:650;padding:4px 6px;border-radius:8px;outline:0;min-width:0;width:100%}
.map-bar input.title:hover,.map-bar input.title:focus{background:var(--fill)}
.map-bar .sub{font-size:12px;color:var(--ink2);padding-left:6px}
.saved{font-size:12px;color:var(--ink3);min-width:70px;text-align:right}
.side{flex:1 1 250px;max-width:290px;padding:16px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:130px}
.prog{display:flex;flex-direction:column;gap:6px;padding:0 6px}.prog-t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.bar i{display:block;height:6px;background:var(--good)}
.blist{display:flex;flex-direction:column;gap:2px}
.bitem{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.bitem:hover{background:var(--fill)}.bitem.on{background:var(--sel);box-shadow:inset 0 0 0 1px rgba(56,189,210,.45)}
.dot{width:9px;height:9px;border-radius:5px;flex:0 0 9px}
.bitem span{display:flex;flex-direction:column;gap:1px;min-width:0}.bitem b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bitem small{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper{flex:999 1 560px;min-width:0;background:var(--paper-bg);padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.hint{font-size:12.5px;color:var(--ink2);text-align:center}
.page{position:relative;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.45);border-radius:3px;user-select:none;-webkit-user-select:none;touch-action:none}
.page canvas{display:block;width:100%;height:auto;border-radius:3px}
.page .pno{position:absolute;left:-2px;top:-22px;font-size:12px;color:var(--ink2)}
.box{position:absolute;border-radius:3px;cursor:move;display:flex;align-items:flex-start}
.box em{position:absolute;left:0;top:-17px;font-style:normal;font-size:10px;font-weight:700;color:#fff;padding:1px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;font-family:var(--font)}
.box:hover em,.box.on em{opacity:1}
.box.on{outline:2px solid #1F8FA8;outline-offset:1px;z-index:3}
.box .h{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid #1F8FA8;cursor:nwse-resize;display:none}
.box.on .h{display:block}
.drawing{position:absolute;border:1.5px dashed #1F8FA8;background:rgba(56,189,210,.12);pointer-events:none}
.insp{flex:1 1 300px;max-width:340px;padding:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:130px}
.insp h3{margin:0;font-size:17px;font-weight:650}.insp .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fld{display:flex;flex-direction:column;gap:6px}.fld>span{font-size:13px;font-weight:600}.fld small{font-size:12px;color:var(--ink2);line-height:1.45}
.fld select,.fld input[type=text]{min-height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:var(--s0);font-size:14px;width:100%}
.grp{border-radius:14px;background:var(--s0);overflow:hidden;border:1px solid var(--line)}
.grp label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 14px;font-size:14px}
.grp label+label{border-top:1px solid var(--line)}.grp input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);justify-content:center}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px}
.note{padding:12px 14px;border-radius:12px;background:var(--fill);font-size:13px;line-height:1.5;color:var(--ink2)}
.note.warn{background:rgba(235,201,93,.12);color:var(--ink)}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(3,7,15,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.sheet{width:min(860px,100%);background:var(--s1);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.sheet header b{flex:1;font-size:16px}
.sheet .body{padding:18px;background:var(--paper-bg);display:flex;flex-direction:column;align-items:center;gap:16px;max-height:72vh;overflow:auto}
.sheet .body canvas{width:min(640px,100%);height:auto;box-shadow:0 14px 34px rgba(0,0,0,.4);border-radius:3px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#050A14;color:#E6EEF6;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4)}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form,.gate .box2{width:min(380px,100%);background:var(--s0);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-size:22px}.gate p{margin:0;color:var(--ink2);font-size:14px}
.gate input{min-height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;font-size:15px}
.gate .err{color:var(--bad);font-size:13px}
[hidden]{display:none!important}
@media (max-width:900px){.side,.insp{max-width:none;position:static;max-height:none;border:0}.map-bar{top:0}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script>
(function(){
'use strict';
/* Pravix Forms (Oct 13 2026). The hospital's own PDFs, mapped once; Flow fills them and the family signs them on the iPad.
   Only the accounts below can open it for now (like Grid and Kura). Nothing about a template leaves this browser except
   what is saved to the hospital's own database (form_templates). */
var ALLOWED=['daniel.giordano@pravix.app'];
var TENANT='shoreline', HOSPITAL='VCA Shoreline Veterinary Referral & Emergency Center';
firebase.initializeApp({apiKey:'AIzaSyCf8iXW_wWRLvHi1G4YnYRH-iLpaDufZQE',authDomain:'shoreline-flow.firebaseapp.com',projectId:'shoreline-flow',
  storageBucket:'shoreline-flow.firebasestorage.app',messagingSenderId:'237404385636',appId:'1:237404385636:web:1ee3ba27f22c946f748a71'});
var AUTH=firebase.auth(), DB=firebase.firestore(), F=window.PvxForms, P=window.PvxPdf;
var $=function(s,r){ return (r||document).querySelector(s); }, $$=function(s,r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var ICON={up:'<path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/>',back:'<path d="M15 6l-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',dl:'<path d="M12 4v12"/><path d="M6 10l6 6 6-6"/><path d="M4 20h16"/>'};
function ic(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>'; }
var state={user:null,view:'lib',filter:'all',list:[],tpl:null,bytes:null,sel:null,saving:0,savedAt:null,dirty:false};
function who(){ var u=state.user; return u&&(u.displayName||u.email)||''; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.setAttribute('role','status'); e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); },2600); }

/* ---------- sign-in ---------- */
function gate(text,fields){
  $('#app').innerHTML='<div class="gate">'+(fields?'<form id="gf"><h1>Forms</h1><p>'+esc(text)+'</p><input id="ge" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required><input id="gp" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><div class="err" id="gerr" role="alert"></div><button class="btn primary" type="submit">Sign in</button></form>'
    :'<div class="box2"><h1>Forms</h1><p>'+esc(text)+'</p><button class="btn" type="button" id="gout">Use another account</button></div>')+'</div>';
  if(fields){ $('#gf').addEventListener('submit',function(e){ e.preventDefault(); $('#gerr').textContent='';
    AUTH.signInWithEmailAndPassword($('#ge').value.trim(),$('#gp').value).catch(function(){ $('#gerr').textContent='That email and password didn’t match.'; }); }); setTimeout(function(){ var g=$('#ge'); if(g) g.focus(); },50); }
  else $('#gout').addEventListener('click',function(){ AUTH.signOut(); });
}
AUTH.onAuthStateChanged(function(u){ state.user=u||null;
  if(!u) return gate('Sign in with your Pravix account.',true);
  if(ALLOWED.indexOf(String(u.email||'').toLowerCase())<0) return gate('This account can’t open Forms yet.',false);
  loadList().then(function(){ var id=(location.hash.match(/tpl=([\w-]+)/)||[])[1]; if(id){ var t=state.list.filter(function(x){ return x.id===id; })[0]; if(t) return openTpl(t); } render(); });
});

/* ---------- data ---------- */
function loadList(){ return DB.collection('form_templates').where('tenant_id','==',TENANT).get().then(function(s){
  state.list=s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }).filter(function(t){ return t.status!=='archived'; })
    .sort(function(a,b){ return String(b.updated_at||'').localeCompare(String(a.updated_at||'')); }); })
  .catch(function(e){ console.warn('[forms] list',e); state.list=[]; toast('Couldn’t load the forms. Check the connection.'); }); }
function statusOf(t){ var pr=F.progress(t); if(t.status==='ready') return {k:'ready',t:'Ready'}; if(pr.total&&pr.missing) return {k:'todo',t:'Needs mapping · '+pr.missing}; return {k:'draft',t:'Draft'}; }
function whereText(t){ return t.purpose==='ending'?('Flow › Other ending › Send form'+(t.kind==='died'?' (died)':' (euthanasia)')):'Flow › patient drawer › Send a form'; }
var saveT=null;
function queueSave(){ state.dirty=true; state.savedAt=null; paintSaved(); clearTimeout(saveT); saveT=setTimeout(saveNow,700); }
function saveNow(){ var t=state.tpl; if(!t) return Promise.resolve(); clearTimeout(saveT); state.dirty=false;
  var doc={name:t.name||'Untitled form',purpose:t.purpose||'visit',kind:t.purpose==='ending'?(t.kind||'euthanasia'):null,status:t.status==='ready'&&F.progress(t).ready?'ready':(t.status==='ready'?'draft':t.status||'draft'),
    boxes:t.boxes||[],updated_at:new Date().toISOString(),updated_by:who()};
  t.status=doc.status; state.saving++; paintSaved();
  return DB.collection('form_templates').doc(t.id).set(doc,{merge:true}).then(function(){ state.saving--; state.savedAt=new Date(); paintSaved(); })
    .catch(function(e){ state.saving--; state.dirty=true; paintSaved(); console.warn('[forms] save',e); toast('Not saved — only an admin can change forms.'); }); }
function paintSaved(){ var e=$('#saved'); if(!e) return; e.textContent=state.saving?'Saving…':state.dirty?'Edited':state.savedAt?'Saved':''; }
window.addEventListener('beforeunload',function(e){ if(state.dirty||state.saving){ e.preventDefault(); e.returnValue=''; } });

/* ---------- upload ---------- */
function pickFile(){ var i=document.createElement('input'); i.type='file'; i.accept='application/pdf,.pdf'; i.onchange=function(){ if(i.files&&i.files[0]) upload(i.files[0]); }; i.click(); }
function upload(file){
  if(file.size>15*1024*1024){ toast('That PDF is over 15 MB. Save a smaller copy and try again.'); return; }
  toast('Reading '+file.name+'…');
  file.arrayBuffer().then(function(buf){ var bytes=new Uint8Array(buf);
    return P.inspect(bytes).then(function(info){
      if(info.encrypted) throw new Error('This PDF is password-protected. Save an unlocked copy first.');
      if(info.pages.some(function(p){ return p.rotate; })) toast('Some pages are rotated; boxes are placed on the page as stored.');
      return P.sha256(bytes).then(function(h){
        var id=F.newId('ft_'), boxes=F.boxesFromFields(info.fields), now=new Date().toISOString();
        var tpl={tenant_id:TENANT,name:F.humanize(file.name.replace(/\.pdf$/i,'')),purpose:'visit',kind:null,status:'draft',
          file:{name:file.name,size:bytes.length,sha256:h,pages:info.pages.map(function(p){ return {w:p.w,h:p.h}; })},boxes:boxes,created_at:now,created_by:who(),updated_at:now,updated_by:who()};
        return F.putParts(DB,'form_templates',id,bytes).then(function(n){ tpl.file.parts=n; return DB.collection('form_templates').doc(id).set(tpl); })
          .then(function(){ tpl.id=id; state.list.unshift(tpl); toast(boxes.length?('Found '+boxes.length+' fields in the PDF — check each one.'):'No fields in this PDF — draw a box where each answer goes.'); openTpl(tpl,bytes); });
      });
    });
  }).catch(function(e){ console.warn('[forms] upload',e); toast(e&&e.message?e.message:'Couldn’t read that PDF.'); });
}

/* ---------- views ---------- */
function shell(inner){ var u=state.user;
  return '<header class="top"><a class="brand" href="./" data-go="lib"><i>P</i><b>Pravix <span>Forms</span></b></a>'
    +'<nav class="apps" aria-label="Pravix apps"><a href="/directory/">Directory</a><a href="/sgvp/assets/">Assets</a><a href="/sgvp/">Curriculum</a><a href="/scheduling/">Schedule</a><a href="/">Flow</a><a href="/#app=ultrasound">Ultrasound</a><a href="/treatment/">Treatment</a><a href="/#app=rounds">Rounds</a><a href="/or/">OR</a><a href="/grid/">Grid</a><a href="./" aria-current="page">Forms</a></nav>'
    +'<div class="who"><span>VCA Shoreline</span><span>'+esc(u&&u.email||'')+'</span></div></header>'+inner; }
function render(){ if(state.view==='map'&&state.tpl) return renderMap(); renderLib(); }
function renderLib(){ state.view='lib'; if(location.hash) history.replaceState(null,'',location.pathname);

    clampBox(b); state.tpl.boxes.push(b); state.sel=b.id; queueSave(); renderMap(); var s=document.getElementById('bsrc'); if(s) s.focus(); return; }
  if(d.moved){ d.b.rect=d.b.rect.map(function(v){ return Math.round(v*10)/10; }); queueSave(); } });
window.addEventListener('resize',function(){ if(state.view==='map') paintBoxes(); });

/* ---------- test and publish ---------- */
function sampleSig(name){ var c=document.createElement('canvas'); c.width=480; c.height=120; var x=c.getContext('2d'); x.strokeStyle='#14181F'; x.lineWidth=3.2; x.lineCap='round'; x.beginPath();
  var seed=name.length; x.moveTo(20,80); for(var i=0;i<9;i++){ x.bezierCurveTo(40+i*48,10+((i*37+seed)%60),60+i*48,110-((i*23+seed)%50),70+i*48,60+((i*13)%30)); } x.stroke(); return c.toDataURL('image/png'); }
var lastTest=null;
function sampleCtx(){ var now=new Date().toISOString();
  return {p:{id:'test',name:'Rosie',last:'Testa',owner:'Mary Ann Smith',ownerPhone:'(203) 555-0142',species:'Canine',breed:'Beagle',sex:'Female spayed',weight:'12',ageDisplay:'11 years',hid:'SH-1042',doctor:'Annie Downes',arrival:new Date()},
    answers:{'owner.name':'Mary Ann Smith','owner.phone':'(203) 555-0142','family.address':'12 Test Lane','family.city':'Shelton','family.state':'CT','family.zip':'06484','family.email':'test@example.com'},
    aftercare:{care:'private',urn:'Trail to Heaven',clay:true,total:712.82},sign:{owner:{name:'Mary Ann Smith',at:now,png:sampleSig('Mary Ann Smith')},witness:{name:who(),at:now,png:sampleSig(who())}},hospital:HOSPITAL}; }
function testFill(){ var t=state.tpl; if(!state.bytes) return; var ctx=sampleCtx();
  (t.boxes||[]).forEach(function(b){ if(b.src==='family.text'||b.src==='staff.text') ctx.answers[b.id]='Test answer'; if(b.src==='family.check') ctx.answers[b.id]=true; if(b.src==='family.choice'&&ctx.answers['g:'+b.group]==null) ctx.answers['g:'+String(b.group||'Choose one')]=b.id; });
  P.fill(state.bytes,t.boxes,F.resolve(t,ctx),{at:new Date().toISOString(),title:(t.name||'Form')+' · test'}).then(function(out){ lastTest=out; return P.check(out).then(function(c){
    var s=document.createElement('div'); s.className='scrim'; s.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Test copy"><header><b>Test copy · Rosie Testa (test data)</b><button class="btn" type="button" data-act="dl-test">'+ic('dl')+'Download</button><button class="btn quiet" type="button" data-act="close-sheet">Close</button></header><div class="body" id="testBody"></div></div>';
    document.body.appendChild(s); s.addEventListener('click',function(ev){ if(ev.target===s) s.remove(); });
    var chain=Promise.resolve(); for(var i=0;i<c.pages;i++)(function(i){ chain=chain.then(function(){ return P.renderPage(out,i,1.6); }).then(function(cv){ var b=$('#testBody'); if(b) b.appendChild(cv); }); })(i);
  }); }).catch(function(e){ console.warn('[forms] test',e); toast('Couldn’t make the test copy: '+(e.message||e)); }); }
function downloadTest(){ if(!lastTest) return; var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lastTest],{type:'application/pdf'})); a.download=(state.tpl.name||'form')+' - test.pdf'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000); }
function publish(){ var t=state.tpl, pr=F.progress(t);
  if(t.status==='ready'){ toast('Already in Flow. Changes save as you make them.'); return; }
  if(!pr.ready){ var first=t.boxes.filter(function(b){ return !F.isMapped(b); }).sort(order)[0];
    if(!pr.hasOwnerSig) toast('Add the owner’s signature box first.'); else toast(pr.missing+' box'+(pr.missing===1?'':'es')+' still need'+(pr.missing===1?'s':'')+' a field.');
    if(first) select(first.id,true); return; }
  t.status='ready'; saveNow().then(function(){ toast('Published · '+whereText(t)); renderMap(); }); }
window.__forms={state:state,render:render,openTpl:openTpl,upload:upload,select:select,saveNow:saveNow,testFill:testFill};
})();
