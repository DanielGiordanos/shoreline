/* PVX-N225 - Dynamic Type: on iPhone and iPad the page's text follows the system text size (-apple-system-body is 17 pt
   at the default size), re-read when the app comes back. Elsewhere the browser's own text size applies. The shared top bar
   keeps its size in points, like an iOS tab bar. */
(function(){
  var de=document.documentElement;
  function ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1); }
  function probe(){
    try{
      if(!ios()||!(window.CSS&&CSS.supports&&CSS.supports('font','-apple-system-body'))) return;
      var d=document.createElement('div'); d.style.cssText='position:absolute;visibility:hidden;pointer-events:none;font:-apple-system-body';
      de.appendChild(d); var f=parseFloat(getComputedStyle(d).fontSize); d.remove();
      if(!f) return; var pct=Math.max(82,Math.min(235,f/17*100));
      de.style.fontSize=Math.abs(pct-100)<1?'':pct.toFixed(1)+'%';
    }catch(e){}
  }
  function mark(){ var sc=parseFloat(getComputedStyle(de).fontSize)/16; de.classList.toggle('pvx-text-l',sc>=1.25); }
  probe(); mark();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ probe(); mark(); } });
  window.addEventListener('resize',mark);
  try{ new MutationObserver(mark).observe(de,{attributes:true,attributeFilter:['style']}); }catch(e){}
  window.pvxTextScale=function(){ return parseFloat(getComputedStyle(de).fontSize)/16; };
})();

<style id="pvx-header-css" data-from="shared portal header">
/* ═══ Pravix portal header — Flow's top bar and sub-nav on the portal pages (Oct 2026; source: VCA/nav/portal-header.css) ═══

#pvxTopnav,#pvxSubnav{--nav-bg:#0A1222;--r-sm:8px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;

/* top bar (the light-mode lines are !important: some intern pages carry an older !important light header) */
#pvxTopnav.topnav{z-index:300;background:var(--nav-bg);height:76px;min-height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-content:normal;

#pvxTopnav img.logo-light{display:block;}

/* the page's own buttons (Edit, Save, Print…): Flow's header button — the Logout button's surface */

function upload(file){

  if(state.busy) return; state.busy=file.name; var prog=toast('Adding '+file.name+'…',{stay:true}); if(state.view==='lib') renderLib();
  var done=function(){ state.busy=null; if(prog) prog.remove(); };
  file.arrayBuffer().then(function(buf){ var bytes=new Uint8Array(buf);
    return P.inspect(bytes).then(function(info){
      if(info.encrypted){ var pe=new Error('This PDF is password-protected. Save an unlocked copy, then add it again.'); pe.plain=true; throw pe; }
      if(info.pages.some(function(p){ return p.rotate; })) toast('Some pages are rotated; boxes are placed on the page as stored.');
      return P.sha256(bytes).then(function(h){
        var id=F.newId('ft_'), boxes=F.boxesFromFields(info.fields), now=new Date().toISOString();
        var it=state.intent||{}; state.intent=null;
        var tpl={tenant_id:TENANT,name:F.humanize(file.name.replace(/\.pdf$/i,'')),purpose:it.k||'visit',kind:it.kind||null,status:'draft',

        return F.putParts(DB,'form_templates',id,bytes).then(function(n){ tpl.file.parts=n; return DB.collection('form_templates').doc(id).set(tpl); })
          .then(function(){ tpl.id=id; state.list.unshift(tpl); var g=boxes.filter(function(b){ return b.guess; }).length;
            done(); openTpl(tpl,bytes); if(boxes.length) toast('Found '+boxes.length+' fields in the PDF'+(g?' · '+g+' suggestions to review':'')); });
      });
    });
  }).catch(function(e){ console.warn('[forms] upload',e); done(); if(state.view==='lib') renderLib(); err(e&&e.plain?e.message:'Couldn’t add that PDF. Make sure it opens on your computer, then try again.'); });
}

  var seed=name.length; x.moveTo(20,80); for(var i=0;i<9;i++){ x.bezierCurveTo(40+i*48,10+((i*37+seed)%60),60+i*48,110-((i*23+seed)%50),70+i*48,60+((i*13)%30)); } x.stroke(); return c.toDataURL('image/png'); }

<script id="pvx-n227-a11y">
/* PVX-N227 - an icon beside its label is decorative: VoiceOver reads the label, not "image". Icons that stand alone keep
   whatever name they have (their button's name). Runs on icons drawn later too. The shared top bar is left as it is. */
(function(){
  function fix(){
    var top=document.getElementById('pvxTopnav')||document.querySelector('nav.topnav');
    var l=document.querySelectorAll('svg:not([aria-hidden]):not([role]):not([aria-label]):not([aria-labelledby])');
    for(var i=0;i<l.length;i++){
      var s=l[i]; if(top&&top.contains(s)) continue; if(s.querySelector('title')) continue;
      var host=s.closest('button,a,[role=button],[role=tab],[role=menuitem],[role=option],label,li,td,th,summary,.chip,.seg')||s.parentElement;
      if(!host) continue;
      var name=(host.getAttribute('aria-label')||host.getAttribute('title')||host.textContent||'').trim();
      if(name||s.getBoundingClientRect().width<=32) s.setAttribute('aria-hidden','true');
    }
  }
  var q=0; function soon(){ if(q) return; q=setTimeout(function(){ q=0; fix(); },150); }
  function boot(){ fix(); new MutationObserver(soon).observe(document.body,{childList:true,subtree:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
