@keyframes animStar{from{transform:translateY(0)}to{transform:translateY(-2000px)}}
/* Client Display / lobby-TV night mode reuses the SAME global star-field (#starfield),
   with a slightly higher opacity so the identical field reads across a large, distant screen.
   Same size/density/pattern/glow/animation — dark mode only, still very subtle. */
body.dark.client-mode .stars-small,body.dark.tv-mode .stars-small{opacity:.62;}
body.dark.client-mode .stars-medium,body.dark.tv-mode .stars-medium{opacity:.52;}
body.dark.client-mode .stars-large,body.dark.tv-mode .stars-large{opacity:.46;}
@media (prefers-reduced-motion: reduce){.stars-small,.stars-medium,.stars-large{animation:none;}}
/* star-field + bloom only in dark (night) mode — flat light canvas in light mode, exactly like Flow */
html:not(.dark) .bg-bloom, html:not(.dark) #starfield{display:none;}
.mono{font-variant-numeric:tabular-nums;}
#root{position:relative;z-index:1;}  /* content above the fixed mesh/star-field (like Flow .app) */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:content-box;}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:14px clamp(16px,3vw,32px);
  background:var(--nav-bg);
  border-bottom:1px solid rgba(77,200,224,0.10);
}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-width:0;}
.hdr-logo{height:72px;width:auto;display:block;flex:0 0 auto;}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;}
.logo .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(150deg,#1a3352,#0d1b30);border:1px solid var(--hair2);}
.logo .mark svg{width:15px;height:15px;color:var(--cyan);}
.logo .vca{font-size:15px;color:#dfe8f5;}
.logo .sub{font-size:9px;letter-spacing:.34em;color:var(--ink3);font-weight:700;margin-top:1px;}
.tb-div{width:1px;height:22px;background:var(--hair2);}
.tb-visit{font-size:14.5px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-tagline{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% - 2px));
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;
  font-size:clamp(26px,3vw,46px);line-height:1.06;letter-spacing:-.02em;
  color:rgba(240,238,232,0.95);white-space:nowrap;pointer-events:none;}
@media(max-width:680px){.tb-tagline{display:none;}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:9px;}
.tb-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--hair2);
  background:rgba(255,255,255,.03);color:var(--ink2);transition:.18s;}
.tb-btn:hover{background:rgba(255,255,255,.07);color:var(--ink);}
.tb-btn svg{width:15px;height:15px;}
.tb-btn.end{color:#ffd7d0;border-color:rgba(255,120,100,.22);background:rgba(255,90,70,.07);}
.tb-btn.end:hover{background:rgba(255,90,70,.13);}
@media(max-width:680px){ .tb-btn span{display:none;} .tb-btn{padding:8px 10px;} }

/* ============ LAYOUT ============ */
.wrap{
  max-width:1400px; margin:0 auto; padding:clamp(16px,2.4vw,26px);
  display:grid; grid-template-columns:296px minmax(0,1fr);
  gap:clamp(14px,1.6vw,20px); align-items:start;
}
.sidebar{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;gap:14px;align-self:start;}
.hero{grid-column:2;grid-row:1;}
.journey{grid-column:2;grid-row:2;}
.convo{grid-column:2;grid-row:3;}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;}
  .sidebar,.hero,.journey,.convo{grid-column:1;grid-row:auto;}
}

.card{background:var(--glass-strong);
  backdrop-filter:blur(30px) saturate(1.6); -webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--glass-hairline); border-radius:var(--r-lg);
  box-shadow:var(--panel-shadow);}
.side-title{font-size:11px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px;}

/* ============ PATIENT HERO ============ */
.hero{padding:22px 24px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(520px 200px at 88% -30%,rgba(56,201,224,.10),transparent 60%);pointer-events:none;}
.hero-top{display:flex;gap:18px;align-items:center;}
.avatar{width:78px;height:78px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:27px;font-weight:700;color:#eaf5ff;
  background:linear-gradient(155deg,#20456b,#122a45);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.7);}
.hero-id{min-width:0;}
.hero-name{font-size:27px;font-weight:730;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:9px;}
.hero-name svg{width:19px;height:19px;color:var(--ink3);}
.hero-meta{color:var(--ink2);font-size:14px;margin-top:3px;}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:6px 13px;border-radius:999px;
  font-size:12.5px;font-weight:650;color:var(--s-exam);background:var(--s-exam-bg);border:1px solid rgba(56,189,210,.28);}
.badge .d{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan);}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
.fact{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:12px;background:var(--fill-soft);border:1px solid var(--ctl-border);}
.fact .fi{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:rgba(56,201,224,.10);color:var(--cyan);}
.fact .fi svg{width:16px;height:16px;}
.fact .fl{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.02em;}
.fact .fv{font-size:14.5px;font-weight:640;color:var(--ink);margin-top:2px;}
@media(max-width:560px){ .hero-facts{grid-template-columns:1fr;} .avatar{width:64px;height:64px;font-size:22px;} .hero-name{font-size:23px;} }

/* ============ CARE JOURNEY ============ */
.journey{padding:24px clamp(16px,2vw,26px);}
.jscroll{overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.jrow{display:flex;align-items:flex-start;min-width:520px;}
.jstage{flex:1 1 0;min-width:78px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;}
.jstage::before{content:'';position:absolute;top:15px;left:calc(-50% + 15px);width:calc(100% - 30px);height:2px;background:var(--hair2);border-radius:2px;}
.jstage:first-child::before{display:none;}
.jstage.done::before,.jstage.current::before{background:linear-gradient(90deg,var(--teal),var(--teal));}
.jnode{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;background:var(--bg2);}
.jstage.done .jnode{background:linear-gradient(160deg,#54c79b,#2f9e78);box-shadow:0 6px 16px -6px rgba(72,184,136,.55);}
.jstage.done .jnode svg{width:15px;height:15px;color:#04231b;stroke-width:3;}
.jstage.current .jnode{background:radial-gradient(circle at 50% 42%,rgba(56,189,210,.28),transparent 70%);border:2px solid var(--accent);
  box-shadow:0 0 0 5px rgba(56,189,210,.12),0 0 20px rgba(56,189,210,.5);}
.jstage.current .jnode i{width:9px;height:9px;border-radius:50%;background:var(--cyan2);box-shadow:0 0 10px var(--cyan2);}
.jstage.future .jnode{border:1.6px solid rgba(255,255,255,.16);}
.jstage.future .jnode i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);}
.jlabel{font-size:11.5px;margin-top:9px;color:var(--ink3);font-weight:600;line-height:1.25;max-width:92px;}
.jstage.done .jlabel{color:var(--ink2);}
.jstage.current .jlabel{color:var(--ink);font-weight:730;}
.jtime{font-size:10.5px;margin-top:3px;color:var(--ink3);}
.jstage.current .jtime{color:var(--cyan2);font-weight:750;letter-spacing:.08em;}
.status-msg{display:none;
  gap:13px;align-items:center;margin-top:22px;padding:15px 17px;border-radius:15px;
  background:linear-gradient(180deg,rgba(56,201,224,.07),rgba(56,201,224,.03));border:1px solid rgba(56,201,224,.16);}
.status-msg .si{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;background:var(--cyan-soft);color:var(--cyan);border:1px solid rgba(56,201,224,.2);}
.status-msg .si svg{width:20px;height:20px;}
.status-msg .st{font-size:14.5px;font-weight:650;color:var(--ink);}
.status-msg .ss{font-size:13px;color:var(--ink2);margin-top:2px;}

/* ============ SIDEBAR CARDS ============ */
.scard{padding:18px 18px;}
.team-row{display:flex;gap:12px;align-items:center;padding:9px 0;}
.team-row + .team-row{border-top:1px solid var(--hair);}
.team-av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:14px;color:#eaf5ff;background:linear-gradient(155deg,#20456b,#12263f);border:1px solid var(--hair2);}
.team-av.lia{background:linear-gradient(155deg,#274a3f,#153027);}
.team-name{font-size:14px;font-weight:640;color:var(--ink);}
.team-role{font-size:12px;color:var(--ink3);margin-top:1px;}
.access{display:flex;gap:14px;align-items:center;}
.qrbox{width:88px;height:88px;flex:0 0 auto;background:#fff;border-radius:12px;padding:7px;line-height:0;box-shadow:0 8px 20px -12px rgba(0,0,0,.7);}
.qrbox svg{width:100%;height:100%;display:block;}
.access .al{font-size:11px;color:var(--ink3);font-weight:600;}
.access .code{font-size:20px;font-weight:800;letter-spacing:.18em;color:var(--ink);margin-top:2px;}
.copy-link{margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:640;color:var(--cyan);
  background:rgba(56,201,224,.08);border:1px solid rgba(56,201,224,.2);border-radius:10px;padding:7px 11px;cursor:pointer;transition:.16s;}
.copy-link:hover{background:rgba(56,201,224,.16);}

.about-txt{display:flex;gap:11px;align-items:flex-start;color:var(--ink2);font-size:13px;line-height:1.5;}
.about-txt .ai{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:rgba(47,211,172,.10);color:var(--teal);}
.about-txt .ai svg{width:15px;height:15px;}
.s-urgent .scard{background:rgba(255,255,255,.018);}
.urgent-txt{color:var(--ink3);font-size:12.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.urgent-txt svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--ink3);}

/* ============ CONVERSATION ============ */
.convo{display:flex;flex-direction:column;overflow:hidden;min-height:440px;
  background:rgba(12,22,42,0.30);   /* very translucent — navy + star field show through */
  backdrop-filter:blur(8px) saturate(1.3); -webkit-backdrop-filter:blur(8px) saturate(1.3);}
html:not(.dark) .convo{background:rgba(255,255,255,0.34);}  /* translucent frosted-white in light mode */
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--hair);}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:640;color:var(--ink3);
  background:none;border:0;cursor:pointer;transition:.16s;position:relative;}
.tab:hover{color:var(--ink2);}
.tab.on{color:var(--ink);background:rgba(255,255,255,.05);}
.feed{flex:1;overflow-y:auto;padding:16px clamp(14px,1.8vw,22px);display:flex;flex-direction:column;justify-content:flex-start;gap:0;max-height:52vh;min-height:200px;}
.feed-empty{margin:auto;text-align:center;color:var(--ink3);font-size:13.5px;max-width:280px;line-height:1.55;padding:24px;}

/* care update card */
.cu{border:1px solid rgba(56,201,224,.2);background:linear-gradient(180deg,rgba(56,201,224,.05),rgba(56,201,224,.02));border-radius:15px;padding:14px 16px;}
.cu-head{display:flex;align-items:center;gap:10px;}
.cu-ic{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);border:1px solid rgba(47,211,172,.22);}
.cu-ic svg{width:15px;height:15px;stroke-width:2.6;}
.cu-kick{font-size:10.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}
.cu-title{font-size:14.5px;font-weight:680;color:var(--ink);margin-top:1px;}
.cu-body{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.5;padding-left:36px;}

.divider{display:flex;align-items:center;gap:12px;margin:6px 2px;color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.04em;}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:var(--hair);}

/* message rows */
.mrow{display:flex;gap:10px;max-width:100%;margin-top:7px;}
.feed .mrow:first-child{margin-top:0;}
.mrow.grp{margin-top:20px;}
.mrow.staff.cont .m-av{visibility:hidden;margin-top:0;}
.mrow.staff{justify-content:flex-start;}
.mrow.client{justify-content:flex-end;}
.m-av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#eaf5ff;background:linear-gradient(155deg,#20456b,#12263f);border:1px solid var(--hair2);margin-top:16px;}
.m-col{max-width:74%;min-width:0;}
.m-head{font-size:11px;color:var(--ink3);margin:0 0 4px 3px;}
.m-head b{color:var(--ink2);font-weight:650;}
.m-b{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;}
.mrow.staff .m-b{background:var(--surface-2);color:var(--ink);border-bottom-left-radius:5px;}  /* more solid navy/slate for readability over the translucent card */
.mrow.client .m-b{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:5px;}
.mrow.client .m-head{text-align:right;margin-right:3px;}
.m-tick{font-size:10px;color:var(--ink3);text-align:right;margin-top:3px;margin-right:3px;}

/* composer */
.composer{flex:0 0 auto;padding:12px clamp(12px,1.6vw,18px) 10px;border-top:1px solid var(--glass-hairline);background:transparent;}
.comp-row{display:flex;gap:10px;align-items:flex-end;}
.comp-in{flex:1;display:flex;align-items:center;gap:8px;background:var(--fill-soft);border:1px solid var(--ctl-border);border-radius:22px;padding:6px 6px 6px 16px;transition:border-color .2s,box-shadow .2s,background .2s;}
.comp-in:focus-within{border-color:rgba(56,189,210,.55);background:var(--surface-0);box-shadow:0 0 0 3px rgba(56,189,210,.15);}
.comp-in textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font-family:inherit;font-size:14.5px;line-height:1.4;padding:6px 0;max-height:120px;outline:none;}
.comp-in textarea::placeholder{color:var(--ink3);}
.send{width:38px;height:38px;border-radius:50%;border:0;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(160deg,var(--cyan),#1aa7c4);color:#04222b;transition:.14s;}
.send:disabled{background:var(--fill-track);color:var(--ink-400);cursor:default;}
.send:not(:disabled):active{transform:scale(.9);}
.send svg{width:18px;height:18px;stroke-width:2.4;}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:8px;}
.secure svg{width:12px;height:12px;}

/* ===== FOOTER — reused from main Shoreline Flow ===== */
.footer-bar{display:flex;height:4px;margin-top:14px;}
.fb1{background:#38c9e0;flex:3;}.fb2{background:#a888e0;flex:2;}.fb3{background:#e07060;flex:2;}.fb4{background:#0A1222;flex:5;}
.site-footer{background:#0A1222;padding:22px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.footer-text{font-size:11px;color:rgba(255,255,255,.4);line-height:1.7;}
.footer-text strong{color:rgba(255,255,255,.65);}
.version-bar{background:#080E1A;border-top:1px solid rgba(77,200,224,.08);padding:8px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.vb-left{display:flex;align-items:center;gap:10px;}
.vb-logo{font-size:12px;font-weight:800;color:#cfe0f0;letter-spacing:.02em;}.vb-logo span{color:#8aa0bd;}
.vb-prog{font-size:10px;color:rgba(77,200,224,.5);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.vb-right{display:flex;align-items:center;gap:14px;font-size:10px;color:rgba(255,255,255,.2);}
.vb-div{width:1px;height:12px;background:rgba(255,255,255,.08);}
.vb-v{color:rgba(77,200,224,.4);font-weight:600;letter-spacing:1px;}

.convo-head{padding:13px clamp(14px,1.8vw,20px);border-bottom:1px solid var(--hair);}
.convo-title{font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}

.resus-choices{display:flex;flex-direction:column;gap:10px;}
.resus-opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:14px;cursor:pointer;border:1px solid var(--hair2);background:rgba(255,255,255,.02);transition:.16s;text-align:left;width:100%;font-family:inherit;}
.resus-opt .ro-radio{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid var(--ink3);margin-top:1px;transition:.16s;}
.resus-opt .ro-t{font-size:14px;font-weight:750;color:var(--ink);letter-spacing:.03em;display:block;}
.resus-opt .ro-d{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45;display:block;}

.resus-opt.cpr:hover .ro-radio{border-color:var(--teal);}
.resus-opt.dnr:hover{border-color:rgba(225,120,110,.45);background:rgba(225,120,110,.05);}
.resus-opt.dnr:hover .ro-radio{border-color:#d98b82;}
.resus-confirm .rc-t{font-size:14.5px;font-weight:730;color:var(--ink);}
.resus-confirm .rc-d{font-size:12.5px;color:var(--ink2);margin:8px 0 14px;line-height:1.5;}
.rc-btns{display:flex;gap:8px;}
.rc-cancel{flex:1;padding:10px;border-radius:11px;border:1px solid var(--hair2);background:rgba(255,255,255,.03);color:var(--ink2);font-size:13px;font-weight:640;cursor:pointer;font-family:inherit;}
.rc-cancel:hover{background:rgba(255,255,255,.07);}
.rc-go{flex:1;padding:10px;border-radius:11px;border:0;font-size:13px;font-weight:730;cursor:pointer;font-family:inherit;}
.rc-go.cpr{background:linear-gradient(160deg,var(--teal),#1fb99a);color:#04231b;}
.rc-go.dnr{background:linear-gradient(160deg,#e79289,#cf7168);color:#2a0d0a;}
.resus-sum{margin:2px 0 9px;}
.resus-cap{position:relative;display:flex;align-items:center;justify-content:center;width:fit-content;min-width:160px;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:750;letter-spacing:.1em;white-space:nowrap;}
.resus-cap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.85;}
/* calm, clinical — very low-opacity tint, thin border, no glow */
.resus-cap.cpr{color:#5cc4d6;background:rgba(56,189,210,0.08);border:1px solid rgba(56,189,210,0.24);}
.resus-cap.dnr{color:#d19a8f;background:rgba(224,112,96,0.08);border:1px solid rgba(224,112,96,0.24);}
html:not(.dark) .resus-cap.cpr{color:#1f8fa8;background:rgba(30,143,168,0.07);border-color:rgba(30,143,168,0.20);}
html:not(.dark) .resus-cap.dnr{color:#b0574a;background:rgba(176,87,74,0.07);border-color:rgba(176,87,74,0.20);}
.resus-when{display:block;font-size:11.5px;color:var(--ink3);}
.resus-change{margin-top:10px;display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;font-family:inherit;letter-spacing:.02em;opacity:.9;transition:opacity .15s;}
.resus-change:hover{opacity:1;}

/* ============ ENTRY / STATES ============ */
.entry{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px;}
.entry-card{width:100%;max-width:400px;padding:32px 28px;text-align:center;}
.entry-logo{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(150deg,#1a3352,#0d1b30);border:1px solid var(--hair2);}
.entry-logo svg{width:26px;height:26px;color:var(--cyan);}
.entry h1{font-size:21px;font-weight:720;margin:0 0 6px;}
.entry p{color:var(--ink2);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
.entry input{width:100%;text-align:center;font-size:22px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink);background:var(--fill-soft);border:1px solid var(--ctl-border);border-radius:14px;padding:15px;outline:none;}
.entry input:focus{border-color:rgba(56,189,210,.55);background:var(--surface-0);box-shadow:0 0 0 3px rgba(56,189,210,.15);}
.entry .go{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:0;cursor:pointer;font-size:15px;font-weight:680;color:#04222b;
  background:linear-gradient(160deg,var(--cyan),#1aa7c4);transition:.14s;}
.entry .go:active{transform:scale(.99);}
.entry .err{color:#ff9a8c;font-size:12.5px;margin-top:12px;min-height:16px;}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(18,26,42,.96);border:1px solid var(--hair2);color:var(--ink);padding:12px 18px;border-radius:13px;
  font-size:13.5px;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);z-index:80;transition:.24s;max-width:82vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Header + footer stay dark navy in BOTH themes (matches Flow). Content flips via html.dark tokens. */
.topbar .tb-visit{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(77,200,224,0.65);white-space:nowrap;}  /* exact Flow .subnav-title treatment ("Patient Flow") */
.topbar .logo .sub{color:rgba(120,175,205,.72);}
.topbar .logo .mark{background:linear-gradient(150deg,#1a3352,#0d1b30);border-color:rgba(77,200,224,0.25);}
.topbar .logo .mark svg{color:var(--brand-cyan);}
.topbar .tb-div{background:rgba(255,255,255,.14);}
.topbar .tb-btn{color:rgba(226,236,247,.82);border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05);}
.topbar .tb-btn:hover{background:rgba(255,255,255,.10);color:#fff;}
.topbar .tb-btn.end{color:#ffd7d0;border-color:rgba(255,120,100,.28);background:rgba(255,90,70,.08);}

const STAGES=['Check-In','Triage','Doctor Exam','Diagnostics','Treatment','Recovery','Ready to Go Home'];
const STATUS_IDX={Waiting:1,Exam:2,Diagnostics:3,Ultrasound:3,Procedure:4,Admitted:5,Hospitalized:5,Discharged:6,Euthanized:6};
const STAGE_LABEL_FRIENDLY={Waiting:'Triage',Exam:'Doctor Exam',Diagnostics:'Diagnostics',Ultrasound:'Diagnostics',
  Procedure:'Treatment',Admitted:'Recovery',Hospitalized:'Recovery',Discharged:'Ready to Go Home',Euthanized:'Ready to Go Home'};
const STAGE_EVENTS={0:['checked in'],2:['exam started'],3:['diagnostics started','ultrasound started'],
  4:['procedure started','treatment started','admitted to treatment'],5:['admitted started','recovery started'],
  6:['discharged','ready to go home']};

function petName(ov){ return (ov.patient_name||'your pet').split(' ')[0]; }
function currentIdx(ov){ if(ov.is_active===false||ov.discharged_at) return 6; return STATUS_IDX[ov.status]!=null?STATUS_IDX[ov.status]:1; }
function stageTime(ov,idx){
  const tl=ov.timeline||[]; const wants=STAGE_EVENTS[idx];
  if(idx===0) return ov.arrival_time;
  if(idx===6 && ov.discharged_at) return ov.discharged_at;
  if(!wants) return null;
  for(const e of tl){ const lab=(e.label||'').toLowerCase(); if(wants.some(w=>lab.indexOf(w)===0||lab===w)) return e.at; }
  return null;
}
const CU_MAP=[
  {m:'checked in',   t:'Checked in',          b:'{pet} arrived and was triaged by our team.'},
  {m:'exam started', t:'Doctor exam started', b:'{pet} is being examined by the doctor.'},
  {m:'diagnostics started', t:'Diagnostics started', b:'{pet} is currently with our diagnostics team.'},
  {m:'ultrasound started',  t:'Ultrasound started',  b:'{pet} is having an ultrasound.'},
  {m:'procedure started',   t:'Treatment started',   b:'{pet} has begun treatment.'},
  {m:'treatment started',   t:'Treatment started',   b:'{pet} has begun treatment.'},
  {m:'admitted to treatment',t:'Recovery started',   b:'{pet} is being cared for and recovering.'},
  {m:'admitted started',    t:'Recovery started',    b:'{pet} is resting and recovering.'},
  {m:'recovery started',    t:'Recovery started',    b:'{pet} is resting and recovering.'},
  {m:'discharged',          t:'Ready to go home',    b:'{pet} is ready to be discharged. Please see the front desk.'},
  {m:'ready to go home',    t:'Ready to go home',    b:'{pet} is ready to be discharged. Please see the front desk.'}
];
function careUpdates(ov){
  const pet=petName(ov); const out=[];
  (ov.timeline||[]).forEach(e=>{ const lab=(e.label||'').toLowerCase();
    const hit=CU_MAP.find(x=>lab.indexOf(x.m)===0||lab===x.m);
    if(hit) out.push({at:e.at, title:hit.t, body:hit.b.replace(/\{pet\}/g,pet)}); });
  return out;
}
function senderInfo(ov,m){
  const n=(m.staff_name||'').trim();
  if(n && ov.doctor && n.toLowerCase()===ov.doctor.toLowerCase()) return {name:'Dr. '+ov.doctor, role:'Emergency Veterinarian'};
  if(n && ov.liaison && n.toLowerCase()===ov.liaison.toLowerCase()) return {name:ov.liaison, role:'Liaison'};
  return {name:n||'Care Team', role:'Care Team'};
}

/* ---------- state ---------- */
let TOKEN=null, OV=null, MSGS=[], TAB='updates', lastSync=0, pollT=null, tickT=null, shellBuilt=false;

/* ================= ENTRY ================= */
function renderEntry(prefillErr){
  stopPoll(); shellBuilt=false;
  $('root').innerHTML=
    '<div class="entry"><div class="entry-card card">'
    + '<div class="entry-logo">'+IC.paw+'</div>'
    + '<h1>Track your pet’s visit</h1>'
    + '<p>Enter the check-in code from the front desk to see your pet’s live status and message our care team.</p>'
    + '<input id="codeIn" inputmode="text" autocomplete="one-time-code" maxlength="8" placeholder="F6539F" aria-label="Check-in code">'
    + '<button class="go" id="codeGo">View live status</button>'
    + '<div class="err" id="codeErr">'+(prefillErr||'')+'</div>'
    + '</div></div>';
  const inp=$('codeIn'); inp.focus();
  const submit=async()=>{ const code=(inp.value||'').trim(); if(!code){ inp.focus(); return; }
    $('codeErr').textContent=''; $('codeGo').textContent='Checking…';
    try{ const tok=await rpc('track_resolve',{p_code:code});
      if(tok){ TOKEN=tok; history.replaceState(null,'', '?t='+encodeURIComponent(tok)); boot(); }
      else{ $('codeGo').textContent='View live status'; $('codeErr').textContent='That code wasn’t found. Please check with the front desk.'; }
    }catch(e){ $('codeGo').textContent='View live status'; $('codeErr').textContent='Something went wrong. Please try again.'; } };
  $('codeGo').onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
}

/* ---- section renderers ---- */
function renderHero(){
  const ov=OV, pet=ov.patient_name||'Your Pet';
  const metaBits=[ov.breed, ov.age, ov.sex].filter(Boolean).join(' · ');
  const stage=STAGE_LABEL_FRIENDLY[ov.status]||ov.status||'In Care';
  const discharged=(ov.is_active===false||ov.discharged_at);
  const loc = discharged?'Discharge':stage;
  $('tbVisit').textContent='Care Connect';
  $('hero').innerHTML=
    '<div class="hero-top">'
    + '<div class="avatar">'+esc(initials(pet))+'</div>'
    + '<div class="hero-id"><div class="hero-name">'+esc(pet)+' '+IC.heart+'</div>'
    +   (metaBits?'<div class="hero-meta">'+esc(metaBits)+'</div>':'')
    +   '<div class="badge"><span class="d"></span> '+ (discharged?'Ready to Go Home':('Currently in '+esc(stage)))+'</div>'
    + '</div></div>';
}
function fact(ic,l,v){ return '<div class="fact"><div class="fi">'+ic+'</div><div><div class="fl">'+l+'</div><div class="fv">'+v+'</div></div></div>'; }

function renderJourney(){
  const ov=OV, cur=currentIdx(ov), pet=petName(ov);
  let cells='';
  STAGES.forEach((name,i)=>{
    const state = i<cur?'done':(i===cur?'current':'future');
    const t = state==='done'?stageTime(ov,i):'';
    const inner = state==='done'?IC.check:'<i></i>';
    cells+='<div class="jstage '+state+'"><div class="jnode">'+inner+'</div><div class="jlabel">'+name+'</div>'
      + '<div class="jtime">'+(state==='current'?'CURRENT':(t?fmtTime(t):''))+'</div></div>';
  });
  $('journey').innerHTML='<div class="jscroll"><div class="jrow">'+cells+'</div></div>';
}

function renderSidebar(){
  const ov=OV;
  const doc=ov.doctor?('Dr. '+esc(ov.doctor)):'Being assigned';
  let team='<p class="side-title">Your care team</p>'
    + '<div class="team-row"><div class="team-av">'+esc(initials(ov.doctor||'Dr'))+'</div>'
    +   '<div><div class="team-name">'+doc+'</div><div class="team-role">Emergency Veterinarian</div></div></div>';
  if(ov.liaison){
    team+='<div class="team-row"><div class="team-av lia">'+esc(initials(ov.liaison))+'</div>'
      + '<div><div class="team-name">'+esc(ov.liaison)+'</div><div class="team-role">Liaison</div></div></div>';
  } else {
    team+='<div class="team-row"><div class="team-av lia">—</div>'
      + '<div><div class="team-name" style="color:var(--ink3)">Not yet assigned</div><div class="team-role">Liaison</div></div></div>';
  }
  $('sTeam').innerHTML=team;

  const url=TRACK_BASE+'?t='+encodeURIComponent(TOKEN);
  $('sAccess').innerHTML='<p class="side-title">Visit access</p>'
    + '<div class="access"><div class="qrbox">'+makeQR(url)+'</div>'
    +   '<div><div class="al">Check-in code</div><div class="code mono">'+esc(ov.track_code||'—')+'</div>'
    +   '<button class="copy-link" id="copyLink">'+IC.copy+' Copy tracker link</button></div></div>';
  $('copyLink').onclick=()=>{ try{ navigator.clipboard.writeText(url); toast('Tracker link copied'); }catch(e){ toast(url); } };

  $('sAbout').innerHTML='<p class="side-title">About messages</p>'
    + '<div class="about-txt"><div class="ai">'+IC.shield+'</div><div>This is a secure two-way conversation with your care team.</div></div>';

  $('sUrgent').innerHTML='<p class="side-title">For non-urgent questions</p>'
    + '<div class="urgent-txt">'+IC.info+'<div>If you have an urgent concern while at the hospital, please speak with our front desk team.</div></div>';
}

/* ---- feed (single Apple-style message thread) ---- */
function renderFeed(force){
  const feed=$('feed'); if(!feed) return;
  const nearBottom = feed.scrollHeight-feed.scrollTop-feed.clientHeight < 90;
  if(!MSGS.length){
    feed.innerHTML='<div class="feed-empty">No messages yet. Send your care team a note below — for non-urgent questions.</div>';
    return;
  }
  const GAP=5*60000; // messages within 5 min from the same sender group together
  const sameSender=(a,b)=> a&&b&&a.sender===b.sender && (a.sender!=='staff' || (a.staff_name||'')===(b.staff_name||''));
  feed.innerHTML = MSGS.map(function(m,i){
    const prev=MSGS[i-1], next=MSGS[i+1];
    const newGroup = !sameSender(prev,m) || (new Date(m.created_at)-new Date(prev.created_at))>GAP;
    const lastOfGroup = !sameSender(m,next) || (new Date(next.created_at)-new Date(m.created_at))>GAP;
    return msgHTML(m, newGroup, lastOfGroup);
  }).join('');
  if(force||nearBottom) feed.scrollTop=feed.scrollHeight;
}

/* ---- resuscitation preference ---- */
let _resusEditing=false, _resusConfirm=null;
function renderResus(){
  const el=$('sResus'); if(!el||!OV) return;
  const ov=OV, pet=petName(ov);
  let body;
  if(_resusConfirm){
    const isCPR=_resusConfirm==='CPR';
    body='<div class="resus-confirm"><div class="rc-t">Confirm '+_resusConfirm+' Preference</div>'
      + '<div class="rc-d">'+(isCPR
          ? 'You are requesting that the medical team attempt cardiopulmonary resuscitation if '+esc(pet)+' experiences cardiopulmonary arrest.'
          : 'You are requesting that cardiopulmonary resuscitation not be attempted if '+esc(pet)+' experiences cardiopulmonary arrest.')+'</div>'
      + '<div class="rc-btns"><button class="rc-cancel" id="rcCancel">Cancel</button>'
      + '<button class="rc-go '+(isCPR?'cpr':'dnr')+'" id="rcGo">Confirm '+_resusConfirm+'</button></div></div>';
  } else if(ov.resus_pref && !_resusEditing){
    const isCPR=ov.resus_pref==='CPR';
    body='<div class="resus-sum"><span class="resus-cap '+(isCPR?'cpr':'dnr')+'">'+IC.activity+esc(ov.resus_pref)+'</span></div>'
      + '<div class="resus-when">Preference Recorded'+(ov.resus_recorded_at?' at '+fmtTime(ov.resus_recorded_at):'')+'</div>'
      + '<button class="resus-change" id="resChange">Change preference</button>';
  } else {
    body='<div class="resus-choices">'
      + '<button class="resus-opt cpr" id="optCPR"><span class="ro-radio"></span><span><span class="ro-t">CPR</span><span class="ro-d">Attempt cardiopulmonary resuscitation if your pet experiences cardiopulmonary arrest.</span></span></button>'
      + '<button class="resus-opt dnr" id="optDNR"><span class="ro-radio"></span><span><span class="ro-t">DNR</span><span class="ro-d">Do not attempt cardiopulmonary resuscitation if your pet experiences cardiopulmonary arrest.</span></span></button>'
      + '</div>';
  }
  el.innerHTML='<p class="side-title">Resuscitation preference</p>'+body;
  if(_resusConfirm){
    $('rcCancel').onclick=()=>{ _resusConfirm=null; renderResus(); };
    $('rcGo').onclick=async()=>{ const pref=_resusConfirm; const b=$('rcGo'); b.textContent='Saving…'; b.disabled=true;
      try{ await rpc('track_resus_set',{p_token:TOKEN,p_pref:pref}); _resusConfirm=null; _resusEditing=false; await loadOverview(); toast(pref+' preference recorded'); }
      catch(e){ toast('Could not save preference. Please try again.'); _resusConfirm=null; renderResus(); } };
  } else if(ov.resus_pref && !_resusEditing){
    $('resChange').onclick=()=>{ _resusEditing=true; renderResus(); };
  } else {
    $('optCPR').onclick=()=>{ _resusConfirm='CPR'; renderResus(); };
    $('optDNR').onclick=()=>{ _resusConfirm='DNR'; renderResus(); };
  }
}
function msgHTML(m, newGroup, lastOfGroup){
  const grpCls = newGroup ? ' grp' : ' cont';
  if(m.sender==='client'){
    return '<div class="mrow client'+grpCls+'"><div class="m-col">'
      + (newGroup ? '<div class="m-head">'+fmtTime(m.created_at)+'</div>' : '')
      + '<div class="m-b">'+esc(m.body)+'</div>'
      + (lastOfGroup ? '<div class="m-tick">Delivered</div>' : '')
      + '</div></div>';
  }
  const s=senderInfo(OV,m);
  return '<div class="mrow staff'+grpCls+'"><div class="m-av">'+(newGroup?esc(initials(s.name.replace(/^Dr\.\s*/,''))):'')+'</div>'
    + '<div class="m-col">'
    + (newGroup ? '<div class="m-head"><b>'+esc(s.name)+'</b> · '+esc(s.role)+' · '+fmtTime(m.created_at)+'</div>' : '')
    + '<div class="m-b">'+esc(m.body)+'</div></div></div>';
}

/* ---- send ---- */
async function doSend(){
  const box=$('msgBox'), send=$('sendBtn'); const body=box.value.trim(); if(!body) return;
  box.value=''; box.style.height='auto'; send.disabled=true;
  MSGS.push({sender:'client',body:body,created_at:new Date().toISOString()});
  renderFeed(true);
  try{ await rpc('track_send',{p_token:TOKEN,p_body:body}); await loadMsgs(); }
  catch(e){ toast('Message could not be sent. Please try again.'); }
}

/* ---- loaders ---- */
async function loadOverview(){
  try{ const ov=await rpc('track_overview',{p_token:TOKEN});
    if(!ov){ renderEntry('This visit link is no longer active.'); return false; }
    OV=ov; markSync();
    renderHero(); renderJourney(); renderSidebar();
    if(!_resusConfirm) renderResus();
    return true;
  }catch(e){ return false; }
}
async function loadMsgs(){
  try{ const rows=await rpc('track_messages',{p_token:TOKEN}); MSGS=rows||[]; markSync(); renderFeed(false); }catch(e){}
}
function markSync(){ lastSync=Date.now(); tickUpd(); }
function tickUpd(){ const el=$('tbUpd'); if(!el) return; const s=Math.round((Date.now()-lastSync)/1000);
  el.textContent='Last updated '+(s<8?'just now':(s<60?s+'s ago':Math.round(s/60)+'m ago')); }

function startPoll(){ stopPoll(); pollT=setInterval(async()=>{ await loadOverview(); await loadMsgs(); },5000); }
function stopPoll(){ if(pollT){ clearInterval(pollT); pollT=null; } }

/* ================= BOOT ================= */
async function boot(){
  if(!TOKEN){ renderEntry(); return; }
  if(!shellBuilt) buildShell();
  const ok=await loadOverview();
  if(!ok) return;
  await loadMsgs();
  startPoll();
}

/* init */
(function(){
  startThemeSchedule();   // automatic hospital-time theme + live transitions at 06:00 / 18:00
  const q=new URLSearchParams(location.search);
  const t=q.get('t'); const code=q.get('code')||q.get('c');
  if(t){ TOKEN=t; boot(); }
  else if(code){ rpc('track_resolve',{p_code:code}).then(tok=>{ if(tok){ TOKEN=tok; history.replaceState(null,'','?t='+encodeURIComponent(tok)); boot(); } else renderEntry(); }).catch(()=>renderEntry()); }
  else renderEntry();
})();
</script>
