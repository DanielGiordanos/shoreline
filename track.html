<script>/* Automatic theme by HOSPITAL local time — no client toggle. Light 06:00–17:59, Dark 18:00–05:59. */

  document.documentElement.classList.toggle('dark', !(h>=6 && h<18));
}catch(e){ document.documentElement.classList.add('dark'); }})();</script>
<style>
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* Flow LIGHT tokens */
  --page-bg:#f5f5f7; --surface-0:#ffffff; --surface-1:#f5f5f7; --surface-2:#ececef;
  --nav-bg:#0A1222;
  --ink-900:#1d1d1f; --ink-700:#3a3a3c; --ink-500:#6e6e73; --ink-400:#86868b; --ink-300:#aeaeb2;
  --border:rgba(20,30,60,0.10); --border-subtle:rgba(20,30,60,0.06); --border-strong:rgba(20,30,60,0.16);
  --glass:rgba(255,255,255,0.52); --glass-strong:rgba(234,238,244,0.50);
  --glass-border:rgba(255,255,255,0.65); --glass-hairline:rgba(20,30,60,0.07); --ctl-border:rgba(30,41,59,0.22);
  --panel-shadow:0 20px 60px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.75);
  --orb-1:transparent; --orb-2:transparent;
  --accent:#38BDD2; --accent-2:#4DC8E0; --accent-ink:#1F8FA8;
  --brand-cyan:#4DC8E0; --brand-green:#1a9e6e; --brand-coral:#E8644A;
  --fill-soft:rgba(20,30,60,0.05); --fill-track:rgba(20,30,60,0.07);
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --s-exam:#38BDD2; --s-exam-bg:rgba(56,189,210,.16);
  --s-admitted:#48B888; --s-admitted-bg:rgba(72,184,136,.17);
  /* ---- track.html semantic aliases -> Flow tokens (resolve per active theme) ---- */
  --bg:var(--page-bg); --bg2:var(--surface-1); --raise:var(--fill-track);
  --hair:var(--glass-hairline); --hair2:var(--border);
  --ink:var(--ink-900); --ink2:var(--ink-700); --ink3:var(--ink-500);
  --cyan:var(--accent); --cyan2:var(--accent-2); --cyan-soft:var(--s-exam-bg);
  --teal:var(--brand-green); --teal-soft:var(--s-admitted-bg);
  --blue:#0A84FF; --blue2:#0066E6; --r:var(--r-lg);
}
html.dark{
  --page-bg:#080E1A; --surface-0:#0E1628; --surface-1:#131E34; --surface-2:#192540;
  --nav-bg:#0A1222;
  --ink-900:#D8E8F4; --ink-700:#A7C2D8; --ink-500:#7A98B8; --ink-400:#5E7C9C; --ink-300:#3A5070;
  --border:rgba(77,200,224,0.10); --border-subtle:rgba(77,200,224,0.05); --border-strong:rgba(77,200,224,0.18);
  --glass:rgba(14,22,40,0.42); --glass-strong:rgba(18,28,48,0.66);
  --glass-border:rgba(77,200,224,0.28); --glass-hairline:rgba(77,200,224,0.10); --ctl-border:rgba(150,185,220,0.32);
  --panel-shadow:0 8px 40px rgba(0,0,0,0.5),0 2px 4px rgba(0,0,0,0.6),inset 0 1px 0 rgba(77,200,224,0.08);
  --orb-1:rgba(56,189,210,0.16); --orb-2:rgba(168,136,224,0.13);
  --brand-cyan:#38BDD2; --brand-green:#48B888; --brand-coral:#E07060;
  --accent:#38BDD2; --accent-2:#4DC8E0;
  --fill-soft:rgba(150,185,220,0.12); --fill-track:rgba(150,185,220,0.14);
  --s-exam:#38BDD2; --s-exam-bg:rgba(56,189,210,.16);
  --s-admitted:#48B888; --s-admitted-bg:rgba(72,184,136,.17);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--page-bg);
  color:var(--ink-900); font-family:var(--font);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:0.9375rem; line-height:1.45; letter-spacing:-0.01em; transition:background .4s,color .4s;
}
button{font-family:inherit;}
.mesh{display:none;}
.mono{font-variant-numeric:tabular-nums;}
#root{position:relative;z-index:1;}  /* content above the fixed mesh/star-field (like Flow .app) */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:content-box;}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:14px clamp(16px,3vw,32px);
  background:var(--nav-bg);
  border-bottom:1px solid rgba(77,200,224,0.10);
}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-width:0;}
.hdr-logo{height:72px;width:auto;display:block;flex:0 0 auto;}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;}
.logo .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(150deg,#1a3352,#0d1b30);border:1px solid var(--hair2);}
.logo .mark svg{width:15px;height:15px;color:var(--cyan);}
.logo .vca{font-size:0.9375rem;color:#dfe8f5;}
.logo .sub{font-size:0.5625rem;letter-spacing:.34em;color:var(--ink3);font-weight:700;margin-top:1px;}
.tb-div{width:1px;height:22px;background:var(--hair2);}
.tb-visit{font-size:0.9062rem;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-tagline{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% - 2px));
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;
  font-size:clamp(26px,3vw,46px);line-height:1.06;letter-spacing:-.02em;
  color:rgba(240,238,232,0.95);white-space:nowrap;pointer-events:none;}
@media(max-width:680px){.tb-tagline{display:none;}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:9px;}
.tb-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;
  font-size:0.8125rem;font-weight:600;cursor:pointer;border:1px solid var(--hair2);
  background:rgba(255,255,255,.03);color:var(--ink2);transition:.18s;}
.tb-btn:hover{background:rgba(255,255,255,.07);color:var(--ink);}
.tb-btn svg{width:15px;height:15px;}
.tb-btn.end{color:#ffd7d0;border-color:rgba(255,120,100,.22);background:rgba(255,90,70,.07);}
.tb-btn.end:hover{background:rgba(255,90,70,.13);}
@media(max-width:680px){ .tb-btn span{display:none;} .tb-btn{padding:8px 10px;} }

/* ============ LAYOUT ============ */
.wrap{
  max-width:1400px; margin:0 auto; padding:clamp(16px,2.4vw,26px);
  display:grid; grid-template-columns:296px minmax(0,1fr);
  gap:clamp(14px,1.6vw,20px); align-items:start;
}
.sidebar{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;gap:14px;align-self:start;}
.hero{grid-column:2;grid-row:1;}
.journey{grid-column:2;grid-row:2;}
.convo{grid-column:2;grid-row:3;}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;}
  .sidebar,.hero,.journey,.convo{grid-column:1;grid-row:auto;}
}

.card{background:var(--glass-strong);
  backdrop-filter:blur(30px) saturate(1.6); -webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--glass-hairline); border-radius:var(--r-lg);
  box-shadow:var(--panel-shadow);}
.side-title{font-size:0.6875rem;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px;}

/* ============ PATIENT HERO ============ */
.hero{padding:22px 24px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(520px 200px at 88% -30%,rgba(56,201,224,.10),transparent 60%);pointer-events:none;}
.hero-top{display:flex;gap:18px;align-items:center;}
.avatar{width:78px;height:78px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:1.6875rem;font-weight:700;color:#eaf5ff;
  background:linear-gradient(155deg,#20456b,#122a45);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.7);}
.hero-id{min-width:0;}
.hero-name{font-size:1.6875rem;font-weight:730;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:9px;}
.hero-name svg{width:19px;height:19px;color:var(--ink3);}
.hero-meta{color:var(--ink2);font-size:0.875rem;margin-top:3px;}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:6px 13px;border-radius:999px;
  font-size:0.7812rem;font-weight:650;color:var(--s-exam);background:var(--s-exam-bg);border:1px solid rgba(56,189,210,.28);}
.badge .d{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan);}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
.fact{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:12px;background:var(--fill-soft);border:1px solid var(--ctl-border);}
.fact .fi{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:rgba(56,201,224,.10);color:var(--cyan);}
.fact .fi svg{width:16px;height:16px;}
.fact .fl{font-size:0.6875rem;color:var(--ink3);font-weight:600;letter-spacing:.02em;}
.fact .fv{font-size:0.9062rem;font-weight:640;color:var(--ink);margin-top:2px;}
@media(max-width:560px){ .hero-facts{grid-template-columns:1fr;} .avatar{width:64px;height:64px;font-size:1.375rem;} .hero-name{font-size:1.4375rem;} }

/* ============ CARE JOURNEY ============ */
.journey{padding:24px clamp(16px,2vw,26px);}
.jscroll{overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.jrow{display:flex;align-items:flex-start;min-width:520px;}
.jstage{flex:1 1 0;min-width:78px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;}
.jstage::before{content:'';position:absolute;top:15px;left:calc(-50% + 15px);width:calc(100% - 30px);height:2px;background:var(--hair2);border-radius:2px;}
.jstage:first-child::before{display:none;}
.jstage.done::before,.jstage.current::before{background:linear-gradient(90deg,var(--teal),var(--teal));}
.jnode{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;background:var(--bg2);}
.jstage.done .jnode{background:linear-gradient(160deg,#54c79b,#2f9e78);box-shadow:0 6px 16px -6px rgba(72,184,136,.55);}
.jstage.done .jnode svg{width:15px;height:15px;color:#04231b;stroke-width:3;}
.jstage.current .jnode{background:radial-gradient(circle at 50% 42%,rgba(56,189,210,.28),transparent 70%);border:2px solid var(--accent);
  box-shadow:0 0 0 5px rgba(56,189,210,.12),0 0 20px rgba(56,189,210,.5);}
.jstage.current .jnode i{width:9px;height:9px;border-radius:50%;background:var(--cyan2);box-shadow:0 0 10px var(--cyan2);}
.jstage.future .jnode{border:1.6px solid rgba(255,255,255,.16);}
.jstage.future .jnode i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);}
.jlabel{font-size:0.7188rem;margin-top:9px;color:var(--ink3);font-weight:600;line-height:1.25;max-width:92px;}
.jstage.done .jlabel{color:var(--ink2);}
.jstage.current .jlabel{color:var(--ink);font-weight:730;}
.jtime{font-size:0.6562rem;margin-top:3px;color:var(--ink3);}
.jstage.current .jtime{color:var(--cyan2);font-weight:750;letter-spacing:.08em;}
.status-msg{display:none;
  gap:13px;align-items:center;margin-top:22px;padding:15px 17px;border-radius:15px;
  background:linear-gradient(180deg,rgba(56,201,224,.07),rgba(56,201,224,.03));border:1px solid rgba(56,201,224,.16);}
.status-msg .si{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;background:var(--cyan-soft);color:var(--cyan);border:1px solid rgba(56,201,224,.2);}
.status-msg .si svg{width:20px;height:20px;}
.status-msg .st{font-size:0.9062rem;font-weight:650;color:var(--ink);}
.status-msg .ss{font-size:0.8125rem;color:var(--ink2);margin-top:2px;}

/* ============ SIDEBAR CARDS ============ */
.scard{padding:18px 18px;}
.team-row{display:flex;gap:12px;align-items:center;padding:9px 0;}
.team-row + .team-row{border-top:1px solid var(--hair);}
.team-av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:0.875rem;color:#eaf5ff;background:linear-gradient(155deg,#20456b,#12263f);border:1px solid var(--hair2);}
.team-av.lia{background:linear-gradient(155deg,#274a3f,#153027);}
.team-name{font-size:0.875rem;font-weight:640;color:var(--ink);}
.team-role{font-size:0.75rem;color:var(--ink3);margin-top:1px;}
.access{display:flex;gap:14px;align-items:center;}
.qrbox{width:88px;height:88px;flex:0 0 auto;background:#fff;border-radius:12px;padding:7px;line-height:0;box-shadow:0 8px 20px -12px rgba(0,0,0,.7);}
.qrbox svg{width:100%;height:100%;display:block;}
.access .al{font-size:0.6875rem;color:var(--ink3);font-weight:600;}
.access .code{font-size:1.25rem;font-weight:800;letter-spacing:.18em;color:var(--ink);margin-top:2px;}
.copy-link{margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:0.75rem;font-weight:640;color:var(--cyan);
  background:rgba(56,201,224,.08);border:1px solid rgba(56,201,224,.2);border-radius:10px;padding:7px 11px;cursor:pointer;transition:.16s;}
.copy-link:hover{background:rgba(56,201,224,.16);}
.copy-link svg{width:13px;height:13px;}
.about-txt{display:flex;gap:11px;align-items:flex-start;color:var(--ink2);font-size:0.8125rem;line-height:1.5;}
.about-txt .ai{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:rgba(47,211,172,.10);color:var(--teal);}
.about-txt .ai svg{width:15px;height:15px;}
.s-urgent .scard{background:rgba(255,255,255,.018);}
.urgent-txt{color:var(--ink3);font-size:0.7812rem;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.urgent-txt svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--ink3);}

/* ============ CONVERSATION ============ */
.convo{display:flex;flex-direction:column;overflow:hidden;min-height:440px;
  background:rgba(12,22,42,0.30);   /* very translucent — navy + star field show through */
  backdrop-filter:blur(8px) saturate(1.3); -webkit-backdrop-filter:blur(8px) saturate(1.3);}
html:not(.dark) .convo{background:rgba(255,255,255,0.34);}  /* translucent frosted-white in light mode */
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--hair);}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:11px;font-size:0.8438rem;font-weight:640;color:var(--ink3);
  background:none;border:0;cursor:pointer;transition:.16s;position:relative;}
.tab:hover{color:var(--ink2);}
.tab.on{color:var(--ink);background:rgba(255,255,255,.05);}
.feed{flex:1;overflow-y:auto;padding:16px clamp(14px,1.8vw,22px);display:flex;flex-direction:column;justify-content:flex-start;gap:0;max-height:52vh;min-height:200px;}
.feed-empty{margin:auto;text-align:center;color:var(--ink3);font-size:0.8438rem;max-width:280px;line-height:1.55;padding:24px;}

/* care update card */
.cu{border:1px solid rgba(56,201,224,.2);background:linear-gradient(180deg,rgba(56,201,224,.05),rgba(56,201,224,.02));border-radius:15px;padding:14px 16px;}
.cu-head{display:flex;align-items:center;gap:10px;}
.cu-ic{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);border:1px solid rgba(47,211,172,.22);}
.cu-ic svg{width:15px;height:15px;stroke-width:2.6;}
.cu-kick{font-size:0.6562rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}
.cu-title{font-size:0.9062rem;font-weight:680;color:var(--ink);margin-top:1px;}
.cu-body{font-size:0.8125rem;color:var(--ink2);margin-top:7px;line-height:1.5;padding-left:36px;}

.divider{display:flex;align-items:center;gap:12px;margin:6px 2px;color:var(--ink3);font-size:0.6875rem;font-weight:600;letter-spacing:.04em;}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:var(--hair);}

/* message rows */
.mrow{display:flex;gap:10px;max-width:100%;margin-top:7px;}
.feed .mrow:first-child{margin-top:0;}
.mrow.grp{margin-top:20px;}
.mrow.staff.cont .m-av{visibility:hidden;margin-top:0;}
.mrow.staff{justify-content:flex-start;}
.mrow.client{justify-content:flex-end;}
.m-av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:0.6875rem;font-weight:700;color:#eaf5ff;background:linear-gradient(155deg,#20456b,#12263f);border:1px solid var(--hair2);margin-top:16px;}
.m-col{max-width:74%;min-width:0;}
.m-head{font-size:0.6875rem;color:var(--ink3);margin:0 0 4px 3px;}
.m-head b{color:var(--ink2);font-weight:650;}
.m-b{padding:9px 13px;border-radius:16px;font-size:0.875rem;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;}
.mrow.staff .m-b{background:var(--surface-2);color:var(--ink);border-bottom-left-radius:5px;}  /* more solid navy/slate for readability over the translucent card */
.mrow.client .m-b{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:5px;}
.mrow.client .m-head{text-align:right;margin-right:3px;}
.m-tick{font-size:0.625rem;color:var(--ink3);text-align:right;margin-top:3px;margin-right:3px;}

/* composer */
.composer{flex:0 0 auto;padding:12px clamp(12px,1.6vw,18px) 10px;border-top:1px solid var(--glass-hairline);background:transparent;}
.comp-row{display:flex;gap:10px;align-items:flex-end;}
.comp-in{flex:1;display:flex;align-items:center;gap:8px;background:var(--fill-soft);border:1px solid var(--ctl-border);border-radius:22px;padding:6px 6px 6px 16px;transition:border-color .2s,box-shadow .2s,background .2s;}
.comp-in:focus-within{border-color:rgba(56,189,210,.55);background:var(--surface-0);box-shadow:0 0 0 3px rgba(56,189,210,.15);}
.comp-in textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font-family:inherit;font-size:0.9062rem;line-height:1.4;padding:6px 0;max-height:120px;outline:none;}
.comp-in textarea::placeholder{color:var(--ink3);}
.send{width:38px;height:38px;border-radius:50%;border:0;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(160deg,var(--cyan),#1aa7c4);color:#04222b;transition:.14s;}
.send:disabled{background:var(--fill-track);color:var(--ink-400);cursor:default;}
.send:not(:disabled):active{transform:scale(.9);}
.send svg{width:18px;height:18px;stroke-width:2.4;}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.6875rem;color:var(--ink3);margin-top:8px;}
.secure svg{width:12px;height:12px;}

/* ===== FOOTER — reused from main Shoreline Flow ===== */
.footer-bar{display:flex;height:4px;margin-top:14px;}
.fb1{background:#38c9e0;flex:3;}.fb2{background:#a888e0;flex:2;}.fb3{background:#e07060;flex:2;}.fb4{background:#0A1222;flex:5;}
.site-footer{background:#0A1222;padding:22px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.footer-text{font-size:0.6875rem;color:rgba(255,255,255,.4);line-height:1.7;}
.footer-text strong{color:rgba(255,255,255,.65);}
.version-bar{background:#080E1A;border-top:1px solid rgba(77,200,224,.08);padding:8px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.vb-left{display:flex;align-items:center;gap:10px;}
.vb-logo{font-size:0.75rem;font-weight:800;color:#cfe0f0;letter-spacing:.02em;}.vb-logo span{color:#8aa0bd;}
.vb-prog{font-size:0.625rem;color:rgba(77,200,224,.5);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.vb-right{display:flex;align-items:center;gap:14px;font-size:0.625rem;color:rgba(255,255,255,.2);}
.vb-div{width:1px;height:12px;background:rgba(255,255,255,.08);}
.vb-v{color:rgba(77,200,224,.4);font-weight:600;letter-spacing:1px;}

/* ===== MESSAGES header ===== */
.convo-head{padding:13px clamp(14px,1.8vw,20px);border-bottom:1px solid var(--hair);}
.convo-title{font-size:0.7188rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}

/* ===== RESUSCITATION PREFERENCE ===== */
.resus-choices{display:flex;flex-direction:column;gap:10px;}
.resus-opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:14px;cursor:pointer;border:1px solid var(--hair2);background:rgba(255,255,255,.02);transition:.16s;text-align:left;width:100%;font-family:inherit;}
.resus-opt .ro-radio{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid var(--ink3);margin-top:1px;transition:.16s;}
.resus-opt .ro-t{font-size:0.875rem;font-weight:750;color:var(--ink);letter-spacing:.03em;display:block;}
.resus-opt .ro-d{font-size:0.75rem;color:var(--ink2);margin-top:3px;line-height:1.45;display:block;}
.resus-opt.cpr:hover{border-color:rgba(47,211,172,.5);background:rgba(47,211,172,.05);}
.resus-opt.cpr:hover .ro-radio{border-color:var(--teal);}
.resus-opt.dnr:hover{border-color:rgba(225,120,110,.45);background:rgba(225,120,110,.05);}
.resus-opt.dnr:hover .ro-radio{border-color:#d98b82;}
.resus-confirm .rc-t{font-size:0.9062rem;font-weight:730;color:var(--ink);}
.resus-confirm .rc-d{font-size:0.7812rem;color:var(--ink2);margin:8px 0 14px;line-height:1.5;}
.rc-btns{display:flex;gap:8px;}
.rc-cancel{flex:1;padding:10px;border-radius:11px;border:1px solid var(--hair2);background:rgba(255,255,255,.03);color:var(--ink2);font-size:0.8125rem;font-weight:640;cursor:pointer;font-family:inherit;}
.rc-cancel:hover{background:rgba(255,255,255,.07);}
.rc-go{flex:1;padding:10px;border-radius:11px;border:0;font-size:0.8125rem;font-weight:730;cursor:pointer;font-family:inherit;}
.rc-go.cpr{background:linear-gradient(160deg,var(--teal),#1fb99a);color:#04231b;}
.rc-go.dnr{background:linear-gradient(160deg,#e79289,#cf7168);color:#2a0d0a;}
.resus-sum{margin:2px 0 9px;}
.resus-cap{position:relative;display:flex;align-items:center;justify-content:center;width:fit-content;min-width:160px;padding:9px 16px;border-radius:12px;font-size:0.8125rem;font-weight:750;letter-spacing:.1em;white-space:nowrap;}
.resus-cap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.85;}
/* calm, clinical — very low-opacity tint, thin border, no glow */
.resus-cap.cpr{color:#5cc4d6;background:rgba(56,189,210,0.08);border:1px solid rgba(56,189,210,0.24);}
.resus-cap.dnr{color:#d19a8f;background:rgba(224,112,96,0.08);border:1px solid rgba(224,112,96,0.24);}
html:not(.dark) .resus-cap.cpr{color:#1f8fa8;background:rgba(30,143,168,0.07);border-color:rgba(30,143,168,0.20);}
html:not(.dark) .resus-cap.dnr{color:#b0574a;background:rgba(176,87,74,0.07);border-color:rgba(176,87,74,0.20);}
.resus-when{display:block;font-size:0.7188rem;color:var(--ink3);}
.resus-change{margin-top:10px;display:inline-block;font-size:0.75rem;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;font-family:inherit;letter-spacing:.02em;opacity:.9;transition:opacity .15s;}
.resus-change:hover{opacity:1;}

/* ============ ENTRY / STATES ============ */
.entry{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px;}
.entry-card{width:100%;max-width:400px;padding:32px 28px;text-align:center;}
.entry-logo{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(150deg,#1a3352,#0d1b30);border:1px solid var(--hair2);}
.entry-logo svg{width:26px;height:26px;color:var(--cyan);}
.entry h1{font-size:1.3125rem;font-weight:720;margin:0 0 6px;}
.entry p{color:var(--ink2);font-size:0.8438rem;margin:0 0 22px;line-height:1.5;}
.entry input{width:100%;text-align:center;font-size:1.375rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink);background:var(--fill-soft);border:1px solid var(--ctl-border);border-radius:14px;padding:15px;outline:none;}
.entry input:focus{border-color:rgba(56,189,210,.55);background:var(--surface-0);box-shadow:0 0 0 3px rgba(56,189,210,.15);}
.entry .go{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:0;cursor:pointer;font-size:0.9375rem;font-weight:680;color:#04222b;
  background:linear-gradient(160deg,var(--cyan),#1aa7c4);transition:.14s;}
.entry .go:active{transform:scale(.99);}
.entry .err{color:#ff9a8c;font-size:0.7812rem;margin-top:12px;min-height:16px;}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(18,26,42,.96);border:1px solid var(--hair2);color:var(--ink);padding:12px 18px;border-radius:13px;
  font-size:0.8438rem;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);z-index:80;transition:.24s;max-width:82vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Header + footer stay dark navy in BOTH themes (matches Flow). Content flips via html.dark tokens. */
.topbar .tb-visit{font-size:0.625rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(77,200,224,0.65);white-space:nowrap;}  /* exact Flow .subnav-title treatment ("Patient Flow") */
.topbar .logo .sub{color:rgba(120,175,205,.72);}
.topbar .logo .mark{background:linear-gradient(150deg,#1a3352,#0d1b30);border-color:rgba(77,200,224,0.25);}
.topbar .logo .mark svg{color:var(--brand-cyan);}
.topbar .tb-div{background:rgba(255,255,255,.14);}
.topbar .tb-btn{color:rgba(226,236,247,.82);border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05);}
.topbar .tb-btn:hover{background:rgba(255,255,255,.10);color:#fff;}
.topbar .tb-btn.end{color:#ffd7d0;border-color:rgba(255,120,100,.28);background:rgba(255,90,70,.08);}

html{font-size:100%;} body{line-height:1.5;}

.card{background:var(--surface-0);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;}
.hero::after{display:none;}.hero h1{margin:0 0 8px;}.hero h2{font-size:1.125rem;}
.wrap>*{min-width:0;}.connection{grid-column:1/-1;grid-row:1;color:var(--ink3);font-size:.8125rem;}
.sidebar{grid-row:2/span 3;}.hero{grid-row:2;}.journey{grid-row:3;}.convo{grid-row:4;}
.wrap:has(.sidebar[hidden]) .hero,.wrap:has(.sidebar[hidden]) .convo{grid-column:1/-1;}
.languages{display:flex;gap:4px;flex-wrap:wrap;}.languages button{padding:8px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-1);color:var(--ink);font-size:.8125rem;cursor:pointer;}
.languages button[aria-pressed=true]{border:2px solid #08758a;font-weight:700;}
.topbar .languages button{background:#15243a;color:#e3edf6;border-color:#819db9;}.topbar .languages button[aria-pressed=true]{border-color:#74d4e4;}
.topbar{position:relative;flex-wrap:wrap;}.tb-right{flex-wrap:wrap;}.tb-tagline{position:static;transform:none;margin:auto;font-size:1.625rem;white-space:normal;}
.topbar .tb-visit{color:#8bd8e4;}.site-footer a,.footer-text,.footer-text strong{color:#c8d8e8;}.version-bar{color:#b8cadb;font-size:.75rem;}
.hero-name,.hero-meta,.team-name,.m-head,.timeline-label{overflow-wrap:anywhere;}
.badge{color:#08677a;}.jstage.current .jtime,.resus-change{color:#08677a;}.badge .d{box-shadow:none;}
html.dark .badge,html.dark .jstage.current .jtime,html.dark .resus-change{color:#74d4e4;}
html.dark{--ink-500:#a4b9cf;--ink3:#a4b9cf;}
.timeline{padding-left:20px;margin-bottom:0;}.timeline li{padding:8px 0;}.timeline time{display:block;font-size:.8125rem;color:var(--ink3);}
.journey h2{margin-top:24px;}.m-col{max-width:90%;}.mrow.client .m-b{background:#0868c9;}
.comp-in{min-width:0;}.comp-in textarea{min-width:0;width:100%;font-size:1rem;}.send{width:auto;height:auto;min-height:44px;border-radius:12px;padding:10px;}
.composer label{display:block;font-size:.875rem;margin-bottom:8px;}.secure{flex-wrap:wrap;text-align:center;}
#sendError{font-size:.875rem;color:#9d342b;}html.dark #sendError{color:#ffb4a8;}
.rc-go{background:#38bdd2;color:#08232b;}.rc-btns{flex-wrap:wrap;}.resus-cap{min-width:0;white-space:normal;overflow-wrap:anywhere;}
.entry .err{color:#9d342b;}html.dark .entry .err{color:#ffb4a8;}.entry .languages{justify-content:center;margin-bottom:20px;}
.toast{color:#e3edf6;pointer-events:none;}.toast.on{pointer-events:auto;}
@media(max-width:1100px){.tb-tagline{display:none;}}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);}.connection,.hero,.journey,.convo,.sidebar{grid-column:1;grid-row:auto;}.connection{order:0;}.hero{order:1;}.journey{order:2;}.convo{order:3;}.sidebar{order:4;}}
@media(max-width:560px){.topbar{gap:12px;}.tb-right{margin-left:0;gap:6px;}.brand{align-items:flex-start;}.hdr-logo{height:48px;}.hero{padding:18px;}.hero-top{align-items:flex-start;gap:12px;}.avatar{width:44px;height:44px;font-size:1rem;}.entry{padding:16px;}.entry-card{padding:24px 18px;}.jrow{min-width:0;flex-direction:column;gap:12px;}.jstage{flex-direction:row;text-align:left;gap:12px;}.jstage::before{display:none;}.jlabel{max-width:none;margin:0;}.jtime{margin:0;}.access{flex-wrap:wrap;}}

.copy-link{color:#08677a;opacity:1;}html.dark .copy-link{color:#74d4e4;}

.timeline-time{display:block;background:none;border:0;padding:4px 0;color:var(--ink3);font-size:.8125rem;text-align:left;text-decoration:underline;cursor:pointer;}

  return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

/* Firestore-backed RPC shim. Same names/return shapes the page already
   expects, so no downstream render code changed. */
function _iso(v){ if(!v) return null; if(typeof v==='string') return v; if(v && v.toDate) try{ return v.toDate().toISOString(); }catch(e){} return v; }
async function rpc(fn,body){
  body = body || {};
  if(!DB) throw new Error('offline');
  if(fn==='track_send'){
    const text=String(body.p_body||'').trim(); if(!canMessage() || !text || text.length>1000) throw new Error('invalid');
    await DB.collection('messages').doc(body.p_token).collection('items').add({ sender:'client', body:text, created_at:new Date().toISOString() });
    return true;
  }
  if(fn==='track_resus_set'){
    if(!canWrite()) throw new Error('inactive');
    await DB.collection('pub').doc(body.p_token).set({ resus_pref:body.p_pref, resus_status:'client_selected', resus_recorded_at:firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
    return true;
  }
  throw new Error('unknown rpc '+fn);
}

/* ---------- automatic theme by hospital local time (no client override) ----------
   One centralized rule: LIGHT 06:00–17:59, DARK 18:00–05:59, in the hospital's timezone. */
const HOSPITAL_TZ = (typeof window!=='undefined' && window.HOSPITAL_TZ) || 'America/New_York';
function getAutomaticTheme(tz){
  try{ const h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hourCycle:'h23'}).format(new Date()),10);
    return (h>=6 && h<18) ? 'light' : 'dark'; }
  catch(e){ return 'dark'; }
}
function applyAutoTheme(){
  const dark = getAutomaticTheme(HOSPITAL_TZ)==='dark';
  if(dark !== document.documentElement.classList.contains('dark')){
    document.documentElement.classList.toggle('dark', dark);            // body/mesh transition .4s handles the fade
    const mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.setAttribute('content', dark?'#080E1A':'#f5f5f7');
  }
}

const STATUS_IDX={Waiting:1,Exam:2,Diagnostics:3,Ultrasound:3,Procedure:4,Admitted:5,Hospitalized:5,Discharged:6};
function visitMode(ov){ if(!ov) return 'active'; const st=ov.status,end=ov.visit_end,known=Object.prototype.hasOwnProperty.call(STATUS_IDX,st);
  if(st==='Euthanized'||end==='loss'||!known) return 'loss';   /* a status we don't know never gets a guessed happy ending */
  if(end==='transferred') return 'transferred'; if(end==='home') return 'home'; if(end==='ended') return 'ended';
  if(st==='Admitted'||st==='Hospitalized') return 'staying';   /* admitted: the front-desk visit closes, the pet is still with us */
  return 'active'; }

function canMessage(){ return !!OV&&!gentle(OV)&&!stopped&&(canWrite()||visitMode(OV)==='staying'); }
function canWrite(){return OV&&OV.is_active===true&&!ended(OV)&&!gentle(OV)&&!stopped;}

async function resolveCode(){
 if(!pendingCode||resolving||document.hidden)return;
 if(!/^[A-Z0-9]{6}$/.test(pendingCode)){renderEntry('Visit not found. Please check with the front desk.');pendingCode=null;return;}
 resolving=true;const requested=pendingCode;if($('codeGo'))$('codeGo').disabled=true;
 try{
  if(!DB)throw Error('offline');const snap=await DB.collection('codes').doc(requested).get();
  if(!snap.exists||!snap.data().public_token){pendingCode=null;renderEntry('Visit not found. Please check with the front desk.');return;}
  const data=snap.data();TOKEN=data.public_token;codeInactive=data.is_active===false;pendingCode=null;
  history.replaceState(null,'','?t='+encodeURIComponent(TOKEN));boot();
 }catch(e){renderEntry('Unable to connect. Please try again.');if($('codeIn'))$('codeIn').value=requested;}
 finally{resolving=false;if($('codeGo'))$('codeGo').disabled=false;}
}

function patientAge(ov){
 if(ov.birthday&&!ov.age_estimated){
  const birth=dateValue(ov.birthday);if(birth){const now=new Date();let months=(now.getFullYear()-birth.getUTCFullYear())*12+now.getMonth()-birth.getUTCMonth()-(now.getDate()<birth.getUTCDate()?1:0);if(months>=12){const years=Math.floor(months/12);const remainder=months%12;return years+' '+tr(years===1?'year':'years')+(remainder?' '+remainder+' '+tr(remainder===1?'month':'months'):'');}if(months>0)return months+' '+tr(months===1?'month':'months');const days=Math.floor((now-birth)/86400000);if(days>=7){const weeks=Math.floor(days/7);return weeks+' '+tr(weeks===1?'week':'weeks');}if(days>=0)return days+' '+tr(days===1?'day':'days');}
 }
 // Staff-entered age text is preserved; the estimated label is interface text.
 return (ov.age_estimated?tr('Approximate age')+': ':'')+(ov.age||'');
}
function sexLabel(v){
 const map={mn:'Male (Neutered)',male_neutered:'Male (Neutered)',fs:'Female (Spayed)',female_spayed:'Female (Spayed)',mi:'Male (Intact)',male_intact:'Male (Intact)',fi:'Female (Intact)',female_intact:'Female (Intact)',male:'Male',female:'Female',unknown:'Unknown'};
 const value=String(v||'');return tr(map[value.toLowerCase()]||value);
}

 const el=$('sResus');el.hidden=!canWrite();if(!canWrite()){el.innerHTML='';_resusConfirm=null;return;}
 let body='';
 if(_resusConfirm){body='<div class="resus-confirm"><h3 class="rc-t">'+tx('Confirm')+' '+_resusConfirm+'</h3><p class="rc-d">'+tx(explanations[_resusConfirm])+'</p><p>'+tx('Send this request to the care team?')+'</p><div class="rc-btns"><button class="rc-cancel" id="rcCancel">'+tx('Cancel')+'</button><button class="rc-go" id="rcGo"'+(resusSending?' disabled':'')+'>'+tx(resusSending?'Sending…':'Confirm')+' '+_resusConfirm+'</button></div></div>';}
 else if(OV.resus_pref&&!_resusEditing){body='<div class="resus-sum"><span class="resus-cap">'+esc(OV.resus_pref)+'</span></div><div class="resus-when">'+tx(OV.resus_status==='client_selected'?'Sent to the care team':OV.resus_status==='confirmed'?'Confirmed by the care team':'Current preference')+(OV.resus_recorded_at?' · '+esc(absolute(OV.resus_recorded_at)):'')+'</div><button class="resus-change" id="resChange">'+tx('Change preference')+'</button>';}
 else body='<div class="resus-choices">'+['CPR','DNR'].map(pref=>'<button class="resus-opt" id="opt'+pref+'"><span><span class="ro-t">'+pref+'</span><span class="ro-d">'+tx(explanations[pref])+'</span></span></button>').join('')+'</div>';
 el.innerHTML='<h2 class="side-title">'+tx('CPR / DNR preference')+'</h2>'+body;
 if(_resusConfirm){$('rcCancel').onclick=()=>{_resusConfirm=null;renderResus();};$('rcGo').onclick=async()=>{
  if(resusSending||!canWrite())return;const pref=_resusConfirm,token=TOKEN;resusSending=true;renderResus();
  try{await rpc('track_resus_set',{p_token:token,p_pref:pref});if(token===TOKEN){_resusConfirm=null;_resusEditing=false;toast(tr('Sent to the care team'));}}
  catch(e){if(token===TOKEN)toast(tr('Could not send your preference. Please try again.'));}
  finally{resusSending=false;if(token===TOKEN&&shellBuilt)renderResus();}
 };}else if(OV.resus_pref&&!_resusEditing)$('resChange').onclick=()=>{_resusEditing=true;renderResus();};
 else for(const pref of ['CPR','DNR'])$('opt'+pref).onclick=()=>{_resusConfirm=pref;renderResus();};
}
function renderFeed(){
 const feed=$('feed');if(!feed)return;const bottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<90;
 if(failedMsgs&&!messagesLoaded){feed.innerHTML='<p>'+tx('Messages could not be loaded.')+'</p><button id="retryThread">'+tx('Retry')+'</button>';$('retryThread').onclick=async()=>{if(document.hidden||!TOKEN)return;try{acceptMessages(await refs().msgs.get());}catch(e){}};return;}
 feed.innerHTML=MSGS.length?MSGS.map(m=>'<div class="mrow '+(m.sender==='client'?'client':'staff')+' grp"><div class="m-col"><div class="m-head"><b>'+(m.sender==='client'?tx('You'):(m.staff_name?esc(m.staff_name):tx('Care Team')))+'</b> · '+esc(absolute(m.created_at))+'</div><div class="m-b">'+esc(m.body)+'</div></div></div>').join(''):'<div class="feed-empty">'+tx('No messages yet.')+'</div>';
 if(bottom)feed.scrollTop=feed.scrollHeight;
}
function updateSend(){
 if(!$('msgBox'))return;const value=$('msgBox').value.trim();$('sendBtn').disabled=sending||!canMessage()||!value||value.length>1000;
 $('sendBtn').textContent=tr(sending?'Sending…':sendFailed?'Retry':'Send');$('sendError').textContent=sendFailed?tr('Message could not be sent. Your text is saved below.'):'';
}
async function doSend(){
 const box=$('msgBox');if(!box)return;const body=box.value.trim(),token=TOKEN;
 if(!canMessage()||sending||!body||body.length>1000)return;
 sending=true;sendFailed=false;updateSend();
 try{await rpc('track_send',{p_token:token,p_body:body});if(token===TOKEN&&$('msgBox')?.value.trim()===body)$('msgBox').value='';}
 catch(e){if(token===TOKEN)sendFailed=true;}
 finally{sending=false;if(token===TOKEN)updateSend();}
}
function renderVisit(){
 renderHero();renderJourney();renderSidebar();renderResus();renderFeed();
 document.querySelector('.composer').hidden=!canMessage();document.querySelector('.sidebar').hidden=gentle(OV);updateSend();tickUpd();
}
function refs(){return {doc:DB.collection('pub').doc(TOKEN),msgs:DB.collection('messages').doc(TOKEN).collection('items').orderBy('created_at','asc')};}
function serverSnapshot(s){return !s.metadata?.fromCache&&!s.metadata?.hasPendingWrites;}
function acceptMessages(s){
 MSGS=s.docs.map(x=>{const m=x.data();return {sender:m.sender,body:m.body,staff_name:m.staff_name,created_at:m.created_at};});messagesLoaded=true;
 msgReady=serverSnapshot(s);if(msgReady)lastSync=Date.now();if(OV)renderFeed();tickUpd();
}
function acceptOverview(s){
 docReady=serverSnapshot(s);if(docReady)lastSync=Date.now();
 if(!s.exists){if(docReady){stopped=true;renderEntry('Visit not found. Please check with the front desk.');}else tickUpd();return;}
 OV=s.data();OV.resus_recorded_at=_iso(OV.resus_recorded_at);renderVisit();
 if(ended(OV)&&docReady){
  stopped=true;clearInterval(pollT);pollT=null;if(offDoc){offDoc();offDoc=null;}
  if(messagesLoaded&&msgReady)stopPoll();tickUpd();
 }
}
function relative(v){const d=dateValue(v);if(!d)return tr('Time unavailable');const min=Math.floor((Date.now()-d.getTime())/60000);if(min<0)return absolute(v);return min<1?tr('just now'):min<60?tr('{n} min ago',min):min<1440?tr('{n} hr ago',Math.floor(min/60)):tr('{n} days ago',Math.floor(min/1440));}
function tickUpd(){
 for(const button of document.querySelectorAll('.timeline-time[aria-pressed="false"]'))button.textContent=relative(button.dataset.at);
 const el=$('tbUpd');if(!el)return;
 if(stopped&&OV){el.textContent=tr('This visit has ended');return;}
 if(!connected()){el.textContent=tr(lastSync||!navigator.onLine||failedDoc||failedMsgs?'Reconnecting…':'Connecting…')+(OV?' · '+tr('Not live'):'');return;}
 const min=Math.floor((Date.now()-lastSync)/60000);el.textContent=tr(min<1?'Updated just now':'Updated {n} min ago',min);
}
function stopPoll(){generation++;if(offDoc)offDoc();if(offMsgs)offMsgs();offDoc=offMsgs=null;clearInterval(pollT);pollT=null;}
function startPoll(){
 stopPoll();if(stopped||document.hidden||!TOKEN)return;
 docReady=msgReady=false;tickUpd();if(!DB){failedDoc=true;tickUpd();$('hero').innerHTML='<p>'+tx('Unable to load the connection. Reload to try again.')+'</p><button id="reloadTracker">'+tx('Reload')+'</button><p>'+PHONE+'</p>';$('reloadTracker').onclick=()=>location.reload();return;}
 const gen=generation,r=refs();const valid=()=>gen===generation&&!document.hidden;
 function fallback(kind){
  if(!valid())return;
  if(kind==='doc'){failedDoc=true;docReady=false;if(offDoc)offDoc();offDoc=null;}else{failedMsgs=true;msgReady=false;if(offMsgs)offMsgs();offMsgs=null;}
  if(kind==='msgs'&&OV)renderFeed();tickUpd();if(stopped){stopPoll();return;}
  if(!pollT)pollT=setInterval(async()=>{
   if(!valid()||stopped||!navigator.onLine)return;
   try{
    if(failedDoc){const s=await r.doc.get();if(!valid())return;acceptOverview(s);}
    if(!valid()||stopped)return;
    if(failedMsgs){const s=await r.msgs.get();if(!valid())return;acceptMessages(s);}
    if(valid())startPoll();
   }catch(e){tickUpd();}
  },60000);
 }
 failedDoc=failedMsgs=false;
 offMsgs=r.msgs.onSnapshot({includeMetadataChanges:true},s=>{if(!valid())return;acceptMessages(s);if(stopped&&msgReady)stopPoll();},()=>fallback('msgs'));
 offDoc=r.doc.onSnapshot({includeMetadataChanges:true},s=>{if(valid())acceptOverview(s);},()=>fallback('doc'));
}
function boot(){
 if(typeof TOKEN!=='string'||!TOKEN||TOKEN.includes('/')){renderEntry('Visit not found. Please check with the front desk.');return;}
 stopped=false;messagesLoaded=false;docReady=msgReady=false;failedDoc=failedMsgs=false;lastSync=0;
 if(!shellBuilt)buildShell();startPoll();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPoll();tickUpd();}else if(pendingCode)resolveCode();else startPoll();});
window.addEventListener('offline',tickUpd);
window.addEventListener('online',()=>{if(pendingCode)resolveCode();else startPoll();});
window.addEventListener('pagehide',stopPoll);
window.addEventListener('pageshow',e=>{if(e.persisted&&!document.hidden)startPoll();});
startThemeSchedule();tickT=setInterval(tickUpd,15000);
const params=new URLSearchParams(location.search);TOKEN=params.get('t');pendingCode=(params.get('code')||params.get('c')||'').trim().toUpperCase();
if(TOKEN)boot();else{renderEntry();if(pendingCode)resolveCode();}
});
</script>
