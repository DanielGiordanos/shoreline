<script>(function(){try{var m=document.cookie.match(/(?:^|;\s*)pvx_theme=(light|dark)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);}catch(e){}})();</script>
<style>
/* Pravix · verify a signed copy (n126, Oct 13 2026). Public: opened from the QR code printed on a signed form.
   It reads one record by its code — the fingerprint, the day, the hospital, the form's title — and nothing else.
   A PDF chosen here is fingerprinted in this browser and never sent anywhere. */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --bg:#F2F4F8;--s0:#FFFFFF;--s1:#F7F8FB;--ink:#14181F;--ink2:#4B5563;--ink3:#6B7280;--line:rgba(30,45,90,.10);--line2:rgba(30,45,90,.2);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080E1A;--s0:#0E1628;--s1:#131E34;--ink:#E6EEF6;--ink2:#A7C2D8;--ink3:#7A98B8;--line:rgba(150,185,220,.14);--line2:rgba(150,185,220,.3);
  --good:#7FD6AE;--good-bg:rgba(72,184,136,.16);--bad:#F0A59D;--bad-bg:rgba(232,146,138,.14);--btn:#E6EEF6;--btn-ink:#0B1220}}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 0 4px}.brand img.vca{height:30px;width:auto}.brand .div{width:1px;height:26px;background:var(--line2)}
.brand .pvx{display:flex;align-items:center;gap:7px}.brand .pvx small{display:block;font-size:8.5px;letter-spacing:.14em;color:var(--ink3);font-weight:600}.brand .pvx .mk{height:13px;width:auto;margin-top:2px}.brand .pvx .ic{height:22px;width:22px}
.brand img{display:block}.brand img.lite{display:none}
:root[data-theme="light"] .brand img.drk{display:none}:root[data-theme="light"] .brand img.lite{display:block}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .brand img.drk{display:none}:root:not([data-theme="dark"]) .brand img.lite{display:block}}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:6px 0 0}
.lede{margin:-12px 0 0;font-size:16px;line-height:1.45;color:var(--ink2)}
.card{background:var(--s0);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.hero{display:flex;gap:14px;align-items:flex-start;padding:18px 18px 16px}
.hero i{width:44px;height:44px;flex:0 0 44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.hero i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero.good i{background:var(--good-bg);color:var(--good)}.hero.bad i{background:var(--bad-bg);color:var(--bad)}.hero.plain i{background:var(--s1);color:var(--ink2)}
.hero b{display:block;font-size:19px;font-weight:650;line-height:1.25}.hero span{display:block;font-size:15px;line-height:1.45;color:var(--ink2);margin-top:3px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:48px;padding:12px 18px}.row+.row{border-top:1px solid var(--line)}
.row span{font-size:15px;color:var(--ink2)}.row b{font-size:15px;font-weight:600;text-align:right;overflow-wrap:anywhere}
.row code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13.5px;font-weight:500}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px 4px}
.drop{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:22px 18px;border:1.5px dashed var(--line2);border-radius:18px;background:var(--s0)}
.drop.over{border-color:var(--focus);background:rgba(47,123,234,.07)}
.drop p{margin:0;font-size:15px;line-height:1.45;color:var(--ink2)}
.btn{min-height:50px;padding:0 22px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font:600 17px var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.quiet{background:var(--s1);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:active{filter:brightness(.9);transform:scale(.985)}.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

form.code input{min-height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--s0);padding:0 16px;font:500 20px "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);width:100%}
.lbl{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin:0 0 -4px 4px}
.note{font-size:14px;line-height:1.5;color:var(--ink3);margin:0}
.result{margin-top:12px}
.link{align-self:flex-start;border:0;background:none;padding:0;min-height:44px;font:inherit;font-size:15px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink3);padding:4px 4px 0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--ink2);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.btn:active{transform:none}}
@media (prefers-contrast:more){:root{--line:rgba(20,30,60,.35);--line2:rgba(20,30,60,.6);--ink2:#2F3742;--ink3:#3F4856}}

</style>
</head>

</main>
<script>
(function(){

  en:{title:'Verify a signed form',lede:'Scan the code on a signed form, or type the code printed next to it.',enter:'Code',check:'Check',checking:'Checking…',
    good:'A genuine signed copy',goodSub:function(h){ return 'Signed and filed by '+h+'.'; },signed:'Signed',hospital:'Hospital',pages:'Pages',code:'Code',fp:'Fingerprint',fpAll:'Show the whole fingerprint',
    pdfH:'Have the PDF?',pdfP:'Choose it to check it hasn’t changed since it was signed. It stays on this device.',choose:'Choose a PDF…',reading:'Checking the PDF…',

    notFound:'No encontramos este código',notFoundSub:'Revise el código e inténtelo de nuevo. Son 16 letras y números, impresos junto al código QR.',

    offline:'No se pudo verificar ahora',offlineSub:'Revise la conexión e inténtelo de nuevo.',retry:'Intentar de nuevo',another:'Verificar otro código',
    privacy:'Aquí no se muestra nada sobre el paciente ni la familia.',lang:'English',pages1:function(n){ return n+(n===1?' página':' páginas'); }}};

function day(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ''; try{ return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(es?'es-US':'en-US',{month:'long',day:'numeric',year:'numeric'}); }catch(e){ return s; } }
var ICON={shield:'<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',x:'<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5v.01"/>',doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>'};

  +'<span class="pvx"><img class="ic drk" src="/assets/img/pvx-icon-dark.png" alt=""><img class="ic lite" src="/assets/img/pvx-icon-light.png" alt=""><span><small>POWERED BY</small><img class="mk drk" src="/assets/img/pvx-mark-dark.png" alt="Pravix"><img class="mk lite" src="/assets/img/pvx-mark-light.png" alt="Pravix"></span></span></div>';
var st={code:'',rec:null,state:'enter',file:null,fpAll:false};

function codeForm(v){ var l=L(); return '<form class="code" id="cf" novalidate><label class="lbl" for="ci">'+l.enter+'</label><input id="ci" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="K7Q2 M9XA 4HCD 3PRT" value="'+esc(pretty(v||''))+'"><button class="btn" type="submit">'+l.check+'</button></form>'; }

  else if(st.state==='bad') h+='<div class="card"><div class="hero bad"><i>'+svg('q')+'</i><span><b>'+l.bad+'</b><span>'+l.badSub+'</span></span></div></div>'+codeForm(st.code);
  else if(st.state==='missing') h+='<div class="card"><div class="hero bad"><i>'+svg('q')+'</i><span><b>'+l.notFound+'</b><span>'+l.notFoundSub+'</span></span></div></div>'+codeForm(st.code);
  else if(st.state==='offline') h+='<div class="card"><div class="hero plain"><i>'+svg('q')+'</i><span><b>'+l.offline+'</b><span>'+l.offlineSub+'</span></span></div></div><button class="btn" type="button" data-act="retry">'+l.retry+'</button>';
  else if(st.state==='found'){ var r=st.rec, hosp=r.hospital||'VCA Shoreline', fp=String(r.sha256||'');

      +'<div class="row"><span>'+l.signed+'</span><b>'+esc(day(r.signed_on))+'</b></div><div class="row"><span>'+l.hospital+'</span><b>'+esc(hosp)+'</b></div>'
      +(r.pages?'<div class="row"><span>'+l.pages+'</span><b>'+esc(l.pages1(+r.pages))+'</b></div>':'')
