  background:var(--glass-strong);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--glass-border);box-shadow:0 16px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  transform:translateY(-16px);opacity:0;transition:transform .45s var(--ease-spring),opacity .35s var(--ease);}
.note.show{transform:none;opacity:1;}
.note.hide{transform:translateY(-10px) scale(.97);opacity:0;}
.note .n-ic{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;color:#fff;}
.note .n-ic svg{width:16px;height:16px;}
.note .n-body{min-width:0;flex:1;}
.note .n-title{font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink-900);line-height:1.25;}
.note .n-sub{font-size:11.5px;color:var(--ink-400);margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.note .n-time{font-size:10.5px;color:var(--ink-400);flex:0 0 auto;font-weight:600;}

/* ── Spotlight search results ── */
.search-results{position:absolute;top:calc(100% + 8px);right:0;left:auto;width:380px;max-width:78vw;z-index:120;
  background:var(--glass-strong);backdrop-filter:blur(34px) saturate(1.7);-webkit-backdrop-filter:blur(34px) saturate(1.7);
  border:1px solid var(--glass-border);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;
  opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;
  transition:opacity .2s var(--ease),transform .28s var(--ease-spring);max-height:64vh;overflow-y:auto;}
.search-results.open{opacity:1;transform:none;pointer-events:auto;}
.search-results::-webkit-scrollbar{width:7px;} .search-results::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:20px;}
.sr-group{padding:6px;}
.sr-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-400);padding:8px 10px 4px;}
.sr-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;
  transition:background .15s var(--ease);}
.sr-item:hover,.sr-item.hl{background:rgba(56,189,210,.14);}
.sr-ic{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;}
.sr-ic svg{width:15px;height:15px;stroke:#fff;}
.sr-main{min-width:0;flex:1;}
.sr-t{font-size:13px;font-weight:600;color:var(--ink-900);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-s{font-size:11px;color:var(--ink-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-kind{font-size:10px;color:var(--ink-400);font-weight:600;flex:0 0 auto;}
.sr-none{padding:26px 16px;text-align:center;color:var(--ink-400);font-size:12.5px;}

/* ═══ FOOTER — identical to Profile Dashboard.html ═══ */
.footer-bar{display:flex;height:4px;}
.fb1{background:var(--brand-cyan);flex:3;}
.fb2{background:var(--brand-purple);flex:2;}
.fb3{background:var(--brand-coral);flex:2;}
.fb4{background:var(--brand-navy);flex:5;}
body.dark .fb4{background:#0A1222;}
.site-footer{background:var(--nav-bg);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;transition:background .4s;}
.footer-text{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.7;}
.footer-text strong{color:rgba(255,255,255,0.65);}
.version-bar{background:#080E1A;border-top:1px solid rgba(77,200,224,0.08);padding:8px 32px;display:flex;align-items:center;justify-content:space-between;}
.vb-left{display:flex;align-items:center;gap:10px;}
.vb-left img{height:22px;width:auto;opacity:.9;}
.vb-prog{font-size:10px;color:rgba(77,200,224,0.5);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.vb-right{display:flex;align-items:center;gap:14px;font-size:10px;color:rgba(255,255,255,0.2);}
.vb-div{width:1px;height:12px;background:rgba(255,255,255,0.08);}
.vb-v{color:rgba(77,200,224,0.4);font-weight:600;letter-spacing:1px;}

/* ═══════════════════════════════════════════════════════════
   FLOW · CLINICAL MODULE — additions (token-based, dark+light)
   ═══════════════════════════════════════════════════════════ */
.hidden{display:none!important}
.pointer{cursor:pointer}

/* module placeholder for non-clinical segs */
.mod-holder{display:grid;place-items:center;min-height:52vh}
.mod-holder .panel{max-width:440px;text-align:center;padding:40px 34px}
.mod-holder .mh-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto 16px;
  background:rgba(56,189,210,.14);color:var(--accent)}
.mod-holder h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.mod-holder p{color:var(--ink-400);font-size:13.5px;line-height:1.5;margin-bottom:18px}

/* clinical internal tab strip */
.clin-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.clin-tabs .spacer{flex:1}
.role-dd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-400);font-weight:600}
.role-dd select{height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface-0);
  color:var(--ink-900);font-family:var(--font);font-weight:600;font-size:12.5px;padding:0 12px;cursor:pointer}
.ctab{animation:viewIn .4s var(--ease) both}

/* KPI icon + emphasis (uses existing .kpi) */
.kpi .kicon{position:absolute;top:16px;right:16px;width:20px;height:20px;color:var(--ink-400);opacity:.55;z-index:2}

/* ── patient command bar (glass, sticky) ── */
.clinical-patient-header{flex:0 0 auto;background:var(--glass-strong);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--panel-shadow);
  padding:9px 18px;margin:8px 24px 0}
.cmd-r1{display:flex;align-items:center;gap:12px}
.c-back{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--surface-0);
  display:grid;place-items:center;color:var(--ink-500);flex-shrink:0;cursor:pointer;transition:.15s}
.c-back:hover{background:var(--fill-soft);color:var(--ink-900)}
.cmd-name{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.cmd-name .pid{font-size:11.5px;font-weight:700;color:var(--ink-400);background:var(--fill-soft);padding:2px 8px;border-radius:7px}
.cmd-sig{color:var(--ink-400);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.cmd-sig .d{width:3px;height:3px;border-radius:50%;background:var(--ink-300)}
.cmd-vitals{display:flex;gap:16px;margin-left:auto;align-items:center}
.vstat{text-align:center;min-width:48px}
.vstat .vv{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink-900)}
.vstat .vl{font-size:9.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:1px}
.cmd-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ── clinical workspace (CSS grid, full-height, internal scroll) ── */
.clinical-workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);gap:14px;padding:8px 24px 12px;overflow:hidden}
.clinical-sidebar{min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:5px;display:flex;flex-direction:column;gap:12px}
.clinical-sidebar::-webkit-scrollbar{width:7px}
.clinical-sidebar::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:20px;border:2px solid transparent;background-clip:content-box}
.clinical-sidebar .panel{padding:0;flex:0 0 auto}
.treatment-main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--panel-shadow)}
.treatment-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--glass-hairline);flex-wrap:wrap}
.treatment-grid-shell{flex:1 1 auto;min-width:0;min-height:0;overflow:auto;position:relative}
.treatment-legend{flex:0 0 auto;display:flex;gap:15px;align-items:center;padding:10px 16px;border-top:1px solid var(--glass-hairline);flex-wrap:wrap}
.cbrief{display:flex;flex-direction:column;gap:12px}
.cbrief .panel{padding:0}
.brief-toggle{display:none;flex:0 0 auto;width:auto;height:38px;padding:0 14px;align-items:center;gap:7px}
.brief-scrim{position:fixed;inset:0;background:rgba(6,10,20,.5);backdrop-filter:blur(3px);z-index:115;opacity:0;pointer-events:none;transition:.25s}
.brief-scrim.show{opacity:1;pointer-events:auto}
.cbrief h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:800;
  padding:13px 15px 0}
/* Patient Visit sidebar cards */
.ps{padding:13px 15px}
.ps-top{display:flex;align-items:center;gap:11px}
.ps-top .nm{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink-900)}
.ps-top .id{font-size:11px;font-weight:700;color:var(--ink-400);margin-top:1px}
.ps-sig{font-size:11.5px;color:var(--ink-400);margin-top:9px}
.ps-cc{margin-top:10px}
.ps-cc .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);font-weight:800}
.ps-cc .val{font-size:13px;font-weight:650;color:var(--ink-900);margin-top:2px}
.ps-meta{font-size:11px;color:var(--ink-400);margin-top:10px;padding-top:9px;border-top:1px solid var(--glass-hairline)}
.alert-list{padding:10px 15px 13px;display:flex;flex-direction:column;gap:8px}
.alert-row{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:650;color:var(--ink-900)}
.alert-row .ai{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.alert-row .ai svg{width:13px;height:13px}
.alert-row.crit .ai{background:rgba(232,100,74,.16);color:var(--coral)}
.alert-row.warn .ai{background:rgba(232,168,48,.16);color:var(--amber)}
.alert-row.ok .ai{background:rgba(26,158,110,.16);color:var(--green)}
.alert-row.info .ai{background:rgba(56,189,210,.16);color:var(--accent-ink)}
.kvlist{padding:7px 15px 12px;display:flex;flex-direction:column}
.kvrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--glass-hairline);font-size:12.5px}
.kvrow:last-child{border-bottom:none}
.kvrow .kk{min-width:104px;color:var(--accent);font-weight:700;flex-shrink:0}
.kvrow .vv{color:var(--ink-900);font-weight:600;flex:1;min-width:0}
.ci-time{font-weight:800;color:var(--ink-900);font-size:12.5px;font-variant-numeric:tabular-nums}
.ci-pill{font-size:10.5px;font-weight:700;color:var(--ink-400);background:var(--fill-soft);padding:2px 8px;border-radius:7px}
/* click-to-edit inline values */
.inline-edit-value{display:inline-flex;align-items:center;gap:4px;color:var(--ink-900);font-weight:700;cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.inline-edit-value:hover,.inline-edit-value.active{color:var(--brand-cyan);background:rgba(77,200,224,.11);box-shadow:0 0 0 1px rgba(77,200,224,.22)}
.inline-edit-value:hover .ie-txt,.inline-edit-value.active .ie-txt{text-decoration:underline}
.ie-chev{width:11px;height:11px;opacity:.5;flex-shrink:0}
/* generic Flow popover — frosted glass */
.fl-pop{position:fixed;z-index:330;max-width:92vw;max-height:320px;overflow:hidden;
  background:rgba(18,24,38,.42);backdrop-filter:blur(16px) saturate(135%);-webkit-backdrop-filter:blur(16px) saturate(135%);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;
  box-shadow:0 26px 64px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);padding:8px;animation:ctin .18s ease}
body:not(.dark) .fl-pop{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.62);
  backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);
  box-shadow:0 26px 64px rgba(20,30,45,.18),inset 0 1px 0 rgba(255,255,255,.75)}
.lp{width:234px}
.lp-search{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-0);margin-bottom:6px}
.lp-search svg{width:14px;height:14px;color:var(--ink-400);flex-shrink:0}
.lp-search input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink-900);font-family:var(--font)}
.lp-list{max-height:220px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.lp-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;background:transparent;border:none;text-align:left;font-size:13px;font-weight:600;color:var(--ink-900);cursor:pointer;font-family:var(--font)}
.lp-item:hover{background:rgba(56,189,210,.10)}
.lp-item.sel{color:var(--accent-ink);background:rgba(56,189,210,.08)}
.lp-chk{width:15px;height:15px;color:var(--accent);flex-shrink:0}
.lp-empty{padding:12px;text-align:center;color:var(--ink-400);font-size:12.5px}
/* time picker */
.tp{width:224px}
.tp-head{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);padding:3px 6px 8px}
.tp-cols{display:flex;align-items:flex-start;gap:6px}
.tp-colwrap{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-400);text-align:center;margin-bottom:4px}
.tp-col{max-height:158px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.tp-opt{padding:7px 8px;border-radius:8px;border:none;background:transparent;color:var(--ink-900);font-size:13px;font-weight:700;cursor:pointer;text-align:center;font-family:var(--font);font-variant-numeric:tabular-nums}
.tp-opt:hover{background:rgba(56,189,210,.10)}
.tp-opt.sel{background:var(--accent);color:#04252e}
.tp-sep{align-self:center;padding-top:16px;font-weight:800;color:var(--ink-400)}
.tp-set{margin-top:10px}
/* frosted glass pill button (1:1 glassmorphism reference) */
.glass-btn{width:100%;height:38px;border-radius:999px;cursor:pointer;font-family:var(--font);font-size:13.5px;font-weight:700;letter-spacing:.01em;
  color:var(--ink-900);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(8px) saturate(120%);backdrop-filter:blur(8px) saturate(120%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.20);transition:background .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.glass-btn:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.44);transform:translateY(-1px)}
.glass-btn:active{transform:translateY(0)}
body:not(.dark) .glass-btn{color:var(--ink-900);background:rgba(255,255,255,.34);border:1px solid rgba(120,140,170,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 14px rgba(20,30,45,.10)}
body:not(.dark) .glass-btn:hover{background:rgba(255,255,255,.5);border-color:rgba(120,140,170,.45)}

/* ═══════════ STATUS BOARD (Instinct-style, Flow-skinned) ═══════════ */
.sb{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;min-height:calc(100vh - 210px)}
.sb-toolbar{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-title{display:flex;align-items:center;gap:10px}
.sb-back{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;flex-shrink:0}
.sb-back svg{width:16px;height:16px}
.sb-title h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sb-txview{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ink-400)}
.sb-switch{width:44px;height:24px;border-radius:20px;background:var(--fill-track);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.sb-switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sb-switch.on{background:var(--accent)}
.sb-switch.on::after{left:22px}
.sb-tabs{display:flex;gap:4px;background:var(--fill-soft);padding:3px;border-radius:11px}
.sb-tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-500);cursor:pointer;transition:.15s;white-space:nowrap}
.sb-tab:hover:not(.active){color:var(--ink-900)}
.sb-tab.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
.sb-tool-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.sb-search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--ink-400);width:200px}
.sb-search svg{width:15px;height:15px;flex-shrink:0} .sb-search input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink-900);min-width:0}
.sb-filters{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none}
.sb-filters svg{width:15px;height:15px}

.sb-scroll{flex:1;overflow:auto;position:relative}
.sb-inner{width:max-content;min-width:100%;position:relative}
.sb-nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);z-index:4;pointer-events:none}
.sb-nowline::before{content:"";position:absolute;top:-1px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--coral)}
.sb-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2)}
.sb-row:hover .sb-left{background:var(--surface-2)}
.sb-left{display:flex;flex-shrink:0;position:sticky;left:0;z-index:5;background:var(--surface);border-right:1px solid var(--line)}
.sbc{flex-shrink:0;padding:11px 10px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line-2);min-height:74px}
.sbc.c-pt{width:300px} .sbc.c-dr{width:56px;align-items:center} .sbc.c-ward{width:120px} .sbc.c-io{width:126px} .sbc.c-timer{width:42px;align-items:center} .sbc.c-alerts{width:158px}
.sb-head .sbc{min-height:38px;padding:9px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-400);flex-direction:row;align-items:center;gap:4px}
.sb-head{position:sticky;top:0;z-index:8;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sb-head .sb-left{background:var(--surface-2);z-index:9}
.sb-sort{color:var(--ink-300);font-size:9px}

/* patient cell */
.pt-top{display:flex;align-items:center;gap:7px}
.pt-pin{color:var(--accent);width:13px;height:13px;flex-shrink:0}
.pt-dots{color:var(--ink-300);width:14px;height:14px;flex-shrink:0;cursor:pointer}
.pt-nm{font-weight:700;font-size:14px;letter-spacing:-.01em}
.pt-sig2{font-size:11.5px;color:var(--ink-500);margin-top:2px}
.pt-cage-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-500);margin-top:1px}
.pt-reason{font-size:12px;color:var(--ink-700);margin-top:4px}
.ls-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.02em;padding:1px 6px;border-radius:6px}
.ls-als{background:rgba(26,158,110,.16);color:var(--green)} .ls-bls{background:rgba(232,168,48,.18);color:var(--amber-ink)} .ls-dnr{background:rgba(232,100,74,.16);color:var(--coral)}
.ls-pill svg{width:11px;height:11px}
.vit-ic{width:15px;height:15px;color:var(--ink-300);flex-shrink:0}
.dr-box{border:1px solid var(--line);border-radius:7px;padding:5px 0;width:40px;text-align:center;font-size:12px;font-weight:800;color:var(--ink-700);background:var(--surface-2)}
.ward-sel{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-900);font-size:12.5px;font-weight:600;font-family:var(--font);padding:6px 8px;cursor:pointer;width:100%;outline:none}
.ward-sel:focus{border-color:var(--accent)}
.io-badge{display:inline-grid;place-items:center;width:26px;height:20px;border-radius:5px;background:var(--fill-soft);font-size:10px;font-weight:800;color:var(--ink-500);float:left;margin-right:7px}
.io-date{font-size:12px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums} .io-time{font-size:11.5px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.al-row{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-900);margin:1px 0}
.al-row svg{width:14px;height:14px;flex-shrink:0}
.al-row.warn svg{color:var(--amber)} .al-row.crit svg{color:var(--coral)}
.al-empty{color:var(--ink-300);font-size:12px}

/* timeline right */
.sb-hours{display:flex}
.sb-hcell{width:46px;flex-shrink:0;border-right:1px solid var(--line-2);display:grid;place-items:center}
.sb-head .sb-hcell{font-size:11px;font-weight:700;color:var(--ink-500);min-height:38px}
.sb-head .sb-hcell.now{color:var(--coral)}
.sb-row .sb-hcell{min-height:74px;padding:8px 4px;align-items:stretch}
.sb-blk{width:100%;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.sb-blk.completed{background:var(--gray)} .sb-blk.scheduled{background:var(--green)} .sb-blk.due{background:var(--amber)} .sb-blk.overdue{background:var(--coral)}

/* cage card info right */
.sb-cage{display:flex;flex-shrink:0}
.cage-col{padding:11px 14px;border-right:1px solid var(--line-2);min-height:74px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.cage-col.c1{width:230px} .cage-col.c2{width:210px} .cage-col.c3{width:210px}
.sb-head .cage-head{padding:9px 14px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-400);display:flex;align-items:center;min-height:38px}
.cage-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-700)}
.cage-line svg{width:14px;height:14px;color:var(--ink-400);flex-shrink:0}
.cage-line .cp{font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums}
.cage-copy{width:13px;height:13px;color:var(--ink-300);cursor:pointer}
.cage-date{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink-500);font-size:11.5px;padding:5px 8px;font-family:var(--font);outline:none;width:100%}
.cage-notes{font-size:12px;color:var(--ink-700)}
.cage-notes .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-400);font-weight:800;margin-bottom:3px}

.sb-section{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;left:0}
.sb-section .st{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent-ink)}
.sb-section .sc{font-size:11px;color:var(--ink-400);font-weight:700}
.sb-legend{display:flex;gap:16px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sb-legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-500);font-weight:600}
.sb-legend .dot{width:10px;height:10px;border-radius:50%}
.sb-filter-pop .fp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid var(--glass-hairline)}
.sb-filter-pop .fp-row:last-child{border-bottom:none}
.sb-filter-pop .fp-lab{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink-900)}
.sb-filter-pop .fp-lab svg{width:15px;height:15px;color:var(--ink-400)}
.sb-filter-pop .fp-add{font-size:12.5px;font-weight:700;color:var(--accent-ink);cursor:pointer}
.sb-filter-pop .fp-clear{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-700)}
/* ── glass calendar (centered modal) ── */
.modal-backdrop{position:fixed;inset:0;z-index:9998;background:rgba(3,8,18,.18);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);animation:calFade .2s ease}
@keyframes calFade{from{opacity:0}to{opacity:1}}
.cal-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;z-index:10000;
  width:360px;max-width:92vw;max-height:92vh;overflow:auto;padding:26px 28px 28px;border-radius:24px;border:1px solid transparent;
  background:radial-gradient(circle at 16% 14%,rgba(139,77,181,.26),transparent 46%) padding-box,
    radial-gradient(circle at 84% 90%,rgba(77,200,224,.13),transparent 48%) padding-box,
    linear-gradient(rgba(16,20,32,.34),rgba(16,20,32,.34)) padding-box,
    linear-gradient(135deg,rgba(77,200,224,.8),rgba(255,255,255,.16) 50%,rgba(139,77,181,.7)) border-box;
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 34px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px rgba(139,77,181,.22);
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,.9,.3,1.1)}
.cal-modal.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cal-modal .dp{width:100%}
.cal-modal .dp-title{color:#EAF3FB}
.cal-modal .dp-dow span{color:rgba(200,220,235,.55)}
.cal-modal .dn{color:#EAF3FB}
.cal-modal .dp-cell:not(.empty):hover .dn{background:rgba(77,200,224,.20)}
.cal-modal .dp-nav{color:#5FD4E8}
.cal-modal .dp-nav:hover{background:rgba(77,200,224,.16)}
/* today = thin cyan outline only; selected = filled glowing cyan circle */
.cal-modal .dp-cell.today .dn{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(95,212,232,.75);color:#EAF3FB;font-weight:700}
.cal-modal .dp-cell.sel .dn,.cal-modal .dp-cell.sel.today .dn{background:linear-gradient(135deg,#38BDD2,#2C7FB8);color:#fff;font-weight:700;
  box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 18px rgba(56,189,210,.55),0 10px 26px rgba(56,189,210,.28)}
/* light mode = white frosted glass calendar (cyan accent, matches Weight Trend) */
body:not(.dark) .modal-backdrop{background:rgba(20,40,55,.12)}
/* liaison selector = centered glass modal (shares .modal-backdrop) */
.liaison-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;z-index:10000;
  width:360px;max-width:92vw;max-height:min(620px,82vh);overflow:hidden;display:flex;flex-direction:column;padding:22px;border-radius:24px;
  background:rgba(14,22,40,.44);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(56,189,210,.42);box-shadow:0 34px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16);
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,.9,.3,1.1)}
.liaison-modal.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
body:not(.dark) .liaison-modal{background:rgba(255,255,255,.5);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);
  border:1px solid rgba(56,189,210,.28);box-shadow:0 28px 80px rgba(20,30,50,.18),inset 0 1px 0 rgba(255,255,255,.68)}
.lm-head{padding:2px 2px 14px;flex:0 0 auto}
.lm-title{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink-900)}
.lm-sub{font-size:12.5px;color:var(--ink-400);margin-top:2px}
.liaison-modal .lp-search{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);margin-bottom:10px;flex:0 0 auto}
body:not(.dark) .liaison-modal .lp-search{background:rgba(255,255,255,.5);border:1px solid rgba(120,140,170,.28)}
.liaison-modal .lp-list{max-height:390px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.liaison-modal .lp-item{height:42px;border-radius:14px;padding:0 12px;font-size:13.5px}
/* estimate authorization modal (reuses .liaison-modal glass) */
.estimate-modal{display:block;overflow-y:auto}
.estimate-modal h2{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink-900);margin-bottom:12px}
.em-rows{display:flex;flex-direction:column}
.em-rows>div,.em-linked{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;font-size:13px}

.est-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px}
.est-row .k{color:var(--ink-700);font-weight:600}
.est-row .v{font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums}
.est-row .v.cyan{color:var(--accent-ink)}
.est-row .v.amber{color:#b4740e} .est-row .v.coral,.est-row .v.red{color:var(--coral)}
.est-card{cursor:pointer;transition:box-shadow .15s var(--ease)}
.est-card:hover,.est-card:focus-visible{outline:none;box-shadow:var(--shadow),0 0 0 1px rgba(56,189,210,.42)}
.est-foot{text-align:right;font-size:10.5px;color:var(--ink-400);font-weight:600;margin-top:12px}
.est-bar-wrap{margin:16px 0 4px}
.est-bar{position:relative;height:8px;border-radius:20px;background:var(--fill-track)}
.est-fill{position:relative;height:100%;border-radius:20px;min-width:8px}
.est-fill.cyan{background:linear-gradient(90deg,var(--accent-ink),var(--cyan))}
.est-fill.amber{background:linear-gradient(90deg,#c98a12,var(--amber))}
.est-fill.coral{background:linear-gradient(90deg,#c4432a,var(--coral))}
.est-fill.red{background:linear-gradient(90deg,#b5271b,var(--coral))}
.est-fill::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06)}
.est-marklabel{position:absolute;bottom:15px;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;white-space:nowrap;background:var(--accent-ink);font-variant-numeric:tabular-nums}
.est-marklabel.amber{background:#b4740e} .est-marklabel.coral,.est-marklabel.red{background:var(--coral)}
.est-marklabel::after{content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%) rotate(45deg);width:6px;height:6px;background:inherit}
.est-cap{position:absolute;right:0;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;border:1.5px dashed var(--ink-300);background:var(--surface)}
.est-ends{display:flex;justify-content:space-between;margin-top:11px;font-size:11px;color:var(--ink-500);line-height:1.35;font-variant-numeric:tabular-nums}
.est-ends .hi{text-align:right}
.est-ends b{display:block;color:var(--ink-900);font-weight:800;font-size:12px}
.est-note{display:flex;gap:9px;margin-top:15px;padding:11px 12px;border-radius:12px;background:var(--fill-soft);font-size:12px;line-height:1.5;color:var(--ink-700)}
.est-note svg{width:16px;height:16px;color:var(--accent-ink);flex-shrink:0;margin-top:1px}
/* weight trend mini-chart */
.weight-trend{margin:10px 15px;padding:10px 12px 8px;border-radius:14px;background:rgba(77,200,224,0.06);border:1px solid rgba(77,200,224,0.16)}
.trend-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.trend-header span{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.trend-header strong{font-size:12px;font-weight:800;color:var(--brand-cyan)}
.weight-trend svg{width:100%;height:58px;display:block;overflow:visible}
.trend-fill{fill:rgba(77,200,224,0.16)}
.trend-line{fill:none;stroke:var(--brand-cyan);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px rgba(77,200,224,0.30))}
.trend-dot{fill:var(--brand-cyan);opacity:.85}
.trend-dot.current{fill:#ffffff;stroke:var(--brand-cyan);stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 7px rgba(77,200,224,0.55))}
.weight-trend text{font-size:9px;font-weight:700;fill:var(--ink-400)}
.cbrief .pc{padding:9px 15px 14px}
.cbrief .complaint{font-weight:600;font-size:13px;line-height:1.45;color:var(--ink-900)}
.cbrief ol{list-style:none;counter-reset:p;margin:0}
.cbrief ol li{counter-increment:p;padding:5px 0 5px 25px;position:relative;font-size:12.5px;color:var(--ink-700);border-bottom:1px solid var(--glass-hairline)}
.cbrief ol li:last-child{border-bottom:none}
.cbrief ol li::before{content:counter(p);position:absolute;left:0;top:5px;width:17px;height:17px;border-radius:6px;
  background:rgba(56,189,210,.14);color:var(--accent);font-size:10px;font-weight:800;display:grid;place-items:center}
.cbrief ul{list-style:none;margin:0}
.cbrief ul li{padding:5px 0 5px 18px;position:relative;font-size:12.5px;color:var(--ink-700)}
.cbrief ul li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cbrief ul.alerts li::before{background:var(--amber)}
.mvits{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px 15px 14px}
.mvits .mv{background:var(--fill-soft);border-radius:10px;padding:8px 10px}
.mvits .mv .k{font-size:9.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.mvits .mv .v{font-size:15px;font-weight:800;margin-top:1px;color:var(--ink-900)}
.handoff{display:flex;align-items:center;gap:11px;padding:9px 15px 14px}
.handoff .mono-av{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--navy),var(--accent));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.handoff .ho-txt{font-size:12.5px;color:var(--ink-700)}
.handoff .ho-txt b{color:var(--ink-900);font-weight:800}
.handoff .ho-txt .sub{font-size:11px;color:var(--ink-400);margin-top:1px}
.ownercomm{padding:9px 15px 14px}
.ownercomm .oc-body{font-size:12.5px;color:var(--ink-700);line-height:1.5}
.ownercomm .oc-meta{display:flex;align-items:center;gap:7px;margin-top:8px}

/* ── grid toolbar / search ── */
.qadd{flex:1;min-width:220px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-0);
  border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:var(--ink-400);cursor:text}
.qadd svg{width:15px;height:15px}
.qadd span{font-size:13px}
/* toolbar quick-add search + anchored dropdown */
.order-search-wrapper{position:relative;flex:1;min-width:220px;max-width:420px}
.order-search-wrapper .qadd{width:100%;max-width:none}
.order-search-wrapper .qadd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,210,.14)}
.qadd input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:13px;color:var(--ink-900);font-family:var(--font)}
.qadd input::placeholder{color:var(--ink-400)}
.order-search-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:min(620px,100%);z-index:9000;
  background:var(--surface-0);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.ts-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);padding:8px 8px 4px}
.ts-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-900);font-family:var(--font)}
.ts-item svg{width:14px;height:14px;color:var(--accent);flex-shrink:0}
.ts-item.hi,.ts-item:hover{background:rgba(56,189,210,.12)}
.ts-empty{padding:18px;text-align:center;color:var(--ink-400);font-size:12.5px}
.day-nav{display:flex;align-items:center;gap:5px}
.day-nav button{height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-0);
  color:var(--ink-500);font-weight:700;cursor:pointer;font-size:13px;display:grid;place-items:center}
.day-nav .today{font-size:12px;color:var(--ink-700)}

.sheet-inner{width:max-content;position:relative;min-width:100%}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);z-index:8;pointer-events:none}
.nowline::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.nowline .now-lbl{position:absolute;top:2px;left:8px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;
  padding:2px 6px;border-radius:5px;white-space:nowrap;letter-spacing:.03em}

.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--glass-hairline)}
.rl{width:240px;flex-shrink:0;position:sticky;left:0;z-index:6;background:var(--surface-0);
  border-right:1px solid var(--glass-hairline);display:flex;align-items:center;gap:8px;padding:0 12px;min-height:31px}
.rl .rl-name{font-size:12.5px;font-weight:600;color:var(--ink-900);letter-spacing:-.005em}
.rl .rl-meta{font-size:10.5px;color:var(--ink-400);font-weight:500}
.rl .route-pill{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--fill-soft);color:var(--ink-500);letter-spacing:.02em;margin-left:auto}
.hcells{display:flex;position:relative}
.hcell{width:54px;flex-shrink:0;border-right:1px solid var(--glass-hairline);display:grid;place-items:center;min-height:31px}
.ghead{position:sticky;top:0;z-index:9;background:var(--surface-1);border-bottom:1px solid var(--glass-hairline)}
.ghead .rl{z-index:11;background:var(--surface-1)}
.ghead .hcell{font-size:11px;font-weight:700;color:var(--ink-500);min-height:28px}
.ghead .hcell .ampm{font-size:8px;color:var(--ink-300);font-weight:700}
.ghead .hcell.hour-now{color:var(--coral)}
.gsection{display:flex;align-items:center;position:sticky;left:0;background:var(--fill-soft);z-index:5;
  padding:4px 12px;gap:9px;width:100%}
.gsection .sicon{width:15px;height:15px;color:var(--accent)}
.gsection .stitle{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.gsection .scount{font-size:10px;color:var(--ink-400);font-weight:700;background:var(--surface-0);padding:1px 7px;border-radius:10px}

.cell{width:54px;flex-shrink:0;border-right:1px solid var(--glass-hairline);min-height:31px;display:grid;place-items:center;padding:2px 3px}
.mark{width:calc(100% - 4px);height:25px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;
  cursor:pointer;transition:.12s;position:relative;line-height:1}
.mark:hover{transform:translateY(-1px)}
.mk-ic{width:14px;height:14px;display:block}
.mark.completed{background:rgba(26,158,110,.16);color:var(--green)}
.mark.due{background:var(--accent);color:#04252e;box-shadow:0 4px 12px -2px rgba(56,189,210,.5)}
.mark.due::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:0 0 0 0 rgba(56,189,210,.5);animation:cpulse 1.8s infinite}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(56,189,210,.45)}70%{box-shadow:0 0 0 6px rgba(56,189,210,0)}100%{box-shadow:0 0 0 0 rgba(56,189,210,0)}}
.mark.overdue{background:rgba(232,168,48,.22);color:var(--amber);box-shadow:inset 0 0 0 1.5px rgba(232,168,48,.6),0 4px 12px -2px rgba(232,168,48,.4)}
.mark.scheduled{background:transparent;color:var(--ink-300);border:1px dashed rgba(56,189,210,.4)}
.mark.skipped{background:var(--fill-soft);color:var(--ink-400)}
.mark.abn{background:rgba(232,168,48,.18);color:var(--amber)}
.mark.abn.sev{background:rgba(232,100,74,.18);color:var(--coral)}
.cell.inf{padding:0}
.inf-fill{width:100%;height:19px;display:flex;align-items:center;padding-left:6px;font-size:10px;font-weight:800;cursor:pointer}
.inf-fill.on{background:rgba(26,158,110,.16);color:var(--green);border-top:2px solid var(--green)}
.inf-fill.future{background:rgba(26,158,110,.07);color:rgba(26,158,110,.7);border-top:2px dashed rgba(26,158,110,.4)}
.inf-fill.off{background:transparent}

:root{--status-completed:#1a9e6e;--status-scheduled:#5E7C9C;--status-due:#38BDD2;--status-overdue:#E8A830;--status-skipped:#86868b;}
.treatment-legend .li{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-400);font-weight:600}
.treatment-legend .sw{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:statusBreathe 3s ease-in-out infinite}
.treatment-legend .li:nth-child(1) .sw{animation-delay:0s}
.treatment-legend .li:nth-child(2) .sw{animation-delay:.25s}
.treatment-legend .li:nth-child(3) .sw{animation-delay:.5s}
.treatment-legend .li:nth-child(4) .sw{animation-delay:.75s}
.treatment-legend .li:nth-child(5) .sw{animation-delay:1s}
@keyframes statusBreathe{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 6px currentColor}50%{opacity:.72;transform:scale(1.22);box-shadow:0 0 10px currentColor,0 0 14px currentColor}}
@media (prefers-reduced-motion: reduce){.treatment-legend .sw{animation:none}}

/* ═══════════ VITALS BOARD ═══════════ */
.vitals-main{min-width:0}
.clinical-workspace.vitals-mode{display:block}
.clinical-workspace.vitals-mode .vitals-main{width:100%;max-width:none;height:100%}
.v-header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--glass-hairline)}
.v-filter{display:flex;align-items:center;gap:7px;background:var(--surface-0);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--ink-400);width:210px}
.v-filter svg{width:14px;height:14px;flex-shrink:0} .v-filter input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:12.5px;color:var(--ink-900);font-family:var(--font)}
.v-title{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--ink-500)}
.v-toggle{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--ink-400);cursor:pointer}
.v-luna{flex:0 0 auto;display:flex;align-items:center;gap:14px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:rgba(56,189,210,.08);border:1px solid rgba(56,189,210,.22)}
.v-luna-l{flex:1;min-width:0} .v-luna-txt{font-size:12.5px;color:var(--ink-700);line-height:1.45;margin-top:3px}
.v-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px 10px}
.v-sec-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);padding:14px 2px 6px;display:flex;align-items:center;justify-content:space-between}
.v-sec-h.clp{cursor:pointer}
.v-chev svg{width:14px;height:14px;transform:rotate(180deg);transition:.2s;color:var(--ink-400)} .v-chev.open svg{transform:rotate(0)}
.v-row{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:14px;padding:9px 6px;border-bottom:1px solid var(--glass-hairline)}
.v-name{font-size:13.5px;font-weight:700;color:var(--ink-900)}
.v-trend{min-width:0;overflow-x:auto}
.v-strip{display:flex;align-items:flex-end;gap:0}
.v-pt{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.v-chip{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--fill-soft);color:var(--ink-700);font-variant-numeric:tabular-nums;white-space:nowrap}
.v-chip.cur.cyan{background:var(--accent);color:#04252e} .v-chip.cur.amber{background:var(--amber);color:#3a2a04} .v-chip.cur.coral{background:var(--coral);color:#fff}
.v-t{font-size:9.5px;color:var(--ink-400);font-weight:700}
.v-dash{flex:1;min-width:14px;height:2px;background:linear-gradient(90deg,var(--border-strong),var(--border-strong));border-radius:2px;margin:0 3px;align-self:flex-start;margin-top:11px}
.v-empty{font-size:12px;color:var(--ink-400)}
.v-input{display:flex;align-items:center;gap:6px;flex-shrink:0}
.v-in{width:74px;border:1px solid var(--border);border-radius:9px;padding:7px 9px;background:var(--surface-0);color:var(--ink-900);font-size:12.5px;outline:none;font-family:var(--font)}
.v-in:focus{border-color:var(--accent)}
.v-unit{font-size:11px;color:var(--ink-400);font-weight:700;min-width:26px}
.v-utoggle{font-size:11px;font-weight:800;color:var(--accent-ink);background:rgba(56,189,210,.12);border:1px solid rgba(56,189,210,.28);border-radius:8px;padding:5px 9px;cursor:pointer}
.v-note{width:150px;border:1px solid var(--border);border-radius:9px;padding:7px 9px;background:var(--surface-0);color:var(--ink-900);font-size:12.5px;outline:none;font-family:var(--font)}
.v-note:focus{border-color:var(--accent)}
.v-rec{height:34px;padding:0 15px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;font-family:var(--font)}
.v-rec:hover{background:var(--cyan-deep)}
.v-footer{flex:0 0 auto;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--glass-hairline)}
.vh-modal{width:640px;max-width:94vw;display:block;overflow-y:auto}
.vh h2{font-size:17px;font-weight:800;color:var(--ink-900);margin-bottom:2px;display:flex;align-items:center;gap:7px}
.vh h2 svg{width:16px;height:16px;color:var(--accent-ink)}
.vh-sub{font-size:12.5px;color:var(--ink-400);margin-bottom:12px}
.vh-scroll{overflow-x:auto}
.vh-table{width:100%;border-collapse:collapse;font-size:12px}
.vh-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-400);font-weight:800;padding:7px 8px;border-bottom:1px solid var(--glass-hairline);white-space:nowrap}
.vh-table td{padding:8px;border-bottom:1px solid var(--glass-hairline);color:var(--ink-700);font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:900px){.v-row{grid-template-columns:120px 1fr;grid-template-rows:auto auto}.v-input{grid-column:1/-1;flex-wrap:wrap}}

/* ── rounds ── */
.rounds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.rc .panel{padding:0}
.rc-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--glass-hairline)}
.rc-body{padding:4px 18px 14px}
.rc-sec{padding:9px 0;border-bottom:1px solid var(--glass-hairline)}
.rc-sec:last-child{border-bottom:none}
.rc-sec .lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);font-weight:800;margin-bottom:3px}
.rc-sec .val{font-size:12.5px;line-height:1.5;color:var(--ink-700)}

/* ── timeline ── */
.tl-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--glass-hairline)}
.tl-item{position:relative;padding:0 0 20px 22px}
.tl-item::before{content:"";position:absolute;left:-16px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface-0);border:2.5px solid var(--accent)}
.tl-item.med::before{border-color:var(--accent)} .tl-item.vital::before{border-color:var(--green)}
.tl-item.fluid::before{border-color:var(--cyan)} .tl-item.doctor::before{border-color:var(--purple)}
.tl-item.note::before{border-color:var(--amber)} .tl-item.comm::before{border-color:var(--coral)}
.tl-item .tl-time{font-size:12px;font-weight:800;color:var(--ink-500);font-variant-numeric:tabular-nums}
.tl-item .tl-desc{font-size:13px;margin-top:2px;color:var(--ink-900)}
.tl-item .tl-desc b{font-weight:800}
.tl-item .tl-who{font-size:11px;color:var(--ink-400);margin-top:2px}

/* ── notes ── */
.cnote{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--r-md);
  padding:14px 16px;box-shadow:var(--panel-shadow);margin-bottom:12px}
.cnote .nh{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.cnote .ntype{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:capitalize}
.ntype.nursing{background:rgba(26,158,110,.16);color:var(--green)}
.ntype.doctor{background:rgba(139,77,181,.16);color:var(--purple)}
.ntype.communication{background:rgba(232,100,74,.16);color:var(--coral)}
.ntype.event{background:rgba(232,168,48,.16);color:var(--amber)}
.ntype.discharge{background:rgba(56,189,210,.16);color:var(--accent-ink)}
.cnote .nmeta{font-size:12px;color:var(--ink-400)}
.cnote .nbody{font-size:13px;line-height:1.5;color:var(--ink-700);margin-top:2px}

/* ── drawer fields / scrim ── */
.scrim{position:fixed;inset:0;background:rgba(6,10,20,.5);backdrop-filter:blur(3px);z-index:310;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{z-index:320}
.drawer.wide{width:520px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--ink-500);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;
  background:var(--surface-0);outline:none;color:var(--ink-900);font-size:13.5px;transition:.13s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(56,189,210,.16)}
.field textarea{resize:vertical;min-height:68px;font-family:var(--font)}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc-box{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border-radius:14px;padding:14px 16px;margin:4px 0 16px}
.calc-box .cl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;font-weight:700}
.calc-box .cv{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.calc-box .cs{font-size:12px;opacity:.92;margin-top:2px}
.status-line{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;margin-bottom:16px;font-weight:700;font-size:13px}
.status-line .sw{width:9px;height:9px;border-radius:50%;background:currentColor}
.status-line.due{background:rgba(56,189,210,.14);color:var(--accent-ink)}
.status-line.completed{background:rgba(26,158,110,.14);color:var(--green)}
.status-line.overdue{background:rgba(232,168,48,.14);color:var(--amber)}
.status-line.skipped{background:var(--fill-soft);color:var(--ink-500)}
.status-line.scheduled{background:rgba(56,189,210,.10);color:var(--accent-ink)}
.drow{display:flex;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--glass-hairline)}
.drow:last-child{border-bottom:none}
.drow .k{color:var(--ink-400);min-width:120px;font-weight:600}
.drow .v{font-weight:700;flex:1;color:var(--ink-900)}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.type-grid button{padding:13px 12px;border-radius:13px;border:1px solid var(--border);background:var(--surface-0);text-align:left;transition:.13s;cursor:pointer;color:var(--ink-900)}
.type-grid button:hover{border-color:var(--accent)}
.type-grid button.sel{border-color:var(--accent);background:rgba(56,189,210,.08);box-shadow:0 0 0 2px rgba(56,189,210,.2)}
.type-grid button .ti{font-size:13.5px;font-weight:700}
.type-grid button .td{font-size:11px;color:var(--ink-400);margin-top:2px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tpl-grid button{padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-0);text-align:left;
  font-size:12.5px;font-weight:700;transition:.13s;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink-900)}
.tpl-grid button:hover{border-color:var(--accent)}
.tpl-grid button small{font-weight:500;color:var(--ink-400);font-size:10.5px}
.drawer-sub-label{font-size:11px;font-weight:800;color:var(--ink-500);text-transform:uppercase;letter-spacing:.03em;margin:20px 0 9px}

/* ── clinical toast ── */
.ctoast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.ctoast{background:var(--toast-bg);color:#fff;padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;
  box-shadow:0 20px 48px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px;animation:ctin .3s ease;border:1px solid rgba(255,255,255,.08)}
.ctoast .tk{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.ctoast .tk svg{width:11px;height:11px;color:#fff}
@keyframes ctin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* small pill helpers reused from Flow: use .pill .st-* .prio-* */
.pill.code-dnr{color:var(--coral);background:rgba(232,100,74,.16);border-color:rgba(232,100,74,.24)}
.pill.soft{color:var(--ink-500);background:var(--fill-soft);border-color:var(--border)}

/* ── sheet-active: fill viewport, no page scroll, internal scroll regions ── */
.stage.sheet-active{overflow:hidden;padding:0}
.stage.sheet-active>#view-clinical{flex:1 1 auto;min-height:0;height:100%;max-width:none;width:100%;margin:0;padding:0;
  display:flex;flex-direction:column;overflow:hidden}
.stage.sheet-active #ctab-sheet,.stage.sheet-active #ctab-vitals{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;animation:none}

@media(max-width:1240px){.cmd-vitals{gap:11px}}
@media(max-width:1100px){

    border-right:1px solid var(--glass-border);box-shadow:30px 0 80px rgba(16,22,44,.28);
    transform:translateX(-102%);transition:transform .3s var(--ease);padding:18px 14px;display:none}
  .clinical-sidebar.open{transform:none;display:flex}

}

border-radius:var(--r-sm);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font);}
.nav-btn:hover{background:rgba(255,255,255,0.16);color:#fff;}

.theme-toggle{cursor:pointer;background:none;border:none;border-radius:50px;overflow:hidden;width:72px;height:34px;
flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,0.15);position:relative;transition:box-shadow .2s;}
.theme-toggle:hover{box-shadow:0 0 0 2px rgba(77,200,224,0.5);}
.theme-toggle img{width:72px;height:34px;object-fit:cover;display:block;border-radius:50px;pointer-events:none;transition:opacity .3s;position:absolute;top:0;left:0;}
.theme-toggle .img-light{opacity:1;} .theme-toggle .img-dark{opacity:0;}
body.dark .theme-toggle .img-light{opacity:0;} body.dark .theme-toggle .img-dark{opacity:1;}

.live-dot{width:7px;height:7px;border-radius:50%;background:var(--brand-green);display:inline-block;
animation:live-breathe 3s ease-in-out infinite;box-shadow:0 0 6px rgba(26,158,110,0.6);margin-right:6px;flex-shrink:0;}
@keyframes live-breathe{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 5px rgba(26,158,110,0.5),0 0 0px rgba(26,158,110,0);}
50%{opacity:.7;transform:scale(1.25);box-shadow:0 0 8px rgba(26,158,110,0.7),0 0 12px rgba(26,158,110,0.3);}}

body:not(.dark) .topnav{background:rgba(255,255,255,.96);
border-bottom:1px solid rgba(29,29,31,.08);box-shadow:0 1px 0 rgba(29,29,31,.03);}
body:not(.dark) .nav-item{color:#333333;}

body:not(.dark) .nav-center .nav-item:not(#navFlow):not(#navUltrasound):not(#navRounds){color:#333333;}
body:not(.dark) .nav-item:hover{background:#EBEBEB;color:#636365;}
body:not(.dark) .nav-item.active{background:#EBEBEB;color:#636365;border-color:transparent;}
body:not(.dark) .nav-btn{background:#F5F5F7;color:#1D1D1F;border-color:rgba(29,29,31,.10);}
body:not(.dark) .nav-btn:hover{background:#ECECEF;color:#1D1D1F;}
body:not(.dark) .theme-toggle{box-shadow:0 0 0 1.5px rgba(29,29,31,.12);}
body:not(.dark) .theme-toggle:hover{box-shadow:0 0 0 2px rgba(44,184,210,.5);}

.subnav{display:flex;align-items:center;gap:16px;padding:11px 32px;position:relative;z-index:200;
background:var(--nav-bg);opacity:.97;border-bottom:1px solid var(--glass-hairline);
box-shadow:0 6px 20px rgba(0,0,0,0.12);}
body.dark .subnav{background:rgba(12,20,38,0.9);}
.subnav-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(77,200,224,0.65);white-space:nowrap;}
.switcher{display:flex;gap:3px;align-items:center;padding:0;background:transparent;border:none;}
.seg{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;cursor:pointer;
font-family:var(--font);font-size:13px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.01em;
padding:8px 14px;border-radius:var(--r-sm);transition:all .2s var(--ease);}
.seg svg{width:16px;height:16px;stroke-width:1.9;}
.seg:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);}
.seg.active{background:rgba(77,200,224,.15);color:var(--brand-cyan);border-color:rgba(77,200,224,.25);}
.spacer{flex:1;}

/* --- Light-mode sub-nav + .seg — Flow index.html lines 317–322 --- */
body:not(.dark) .subnav{background:#FFFFFF;border-bottom:1px solid rgba(29,29,31,.08);
box-shadow:0 1px 0 rgba(29,29,31,.03);}
body:not(.dark) .subnav-title{color:#86868B;}
body:not(.dark) .seg{color:#6E6E73;}
body:not(.dark) .seg:hover{background:rgba(29,29,31,.05);color:#1D1D1F;}
body:not(.dark) .seg.active{background:#EBEBEB;color:#636365;border-color:transparent;}

/* ===== Flow search bar ===== */


:root{
--search-shell-bg:rgba(232,237,246,.92); --search-shell-border:rgba(120,140,170,.55);
--search-bg:#FFFFFF; --search-focus-bg:#FFFFFF; --search-border:rgba(120,138,168,.55);
--search-border-focus:rgba(52,183,207,.34); --search-focus-ring:rgba(52,183,207,.08);
--search-text:#44505F; --search-ph:#7B8796; --search-ico:#657181;
}
body.dark{
--search-shell-bg:rgba(20,31,52,.60); --search-shell-border:rgba(120,150,185,.16);
--search-bg:#17233A; --search-focus-bg:#19253C; --search-border:rgba(150,185,220,.18);
--search-border-focus:rgba(77,200,224,.42); --search-focus-ring:rgba(56,189,210,.10);
--search-text:#D1D9E5; --search-ph:#8190A6; --search-ico:#8190A6;
}
.search{width:310px;max-width:32vw;position:relative;flex:0 0 auto;}

.search .search-wrap{padding:5px;border-radius:15px;background:var(--search-shell-bg);border:1px solid var(--search-shell-border);
box-shadow:inset 0 1px 0 rgba(255,255,255,.10);transition:border-color .16s ease,background .16s ease;}
.search .search-wrap:focus-within{border-color:var(--search-border-focus);}

.search .search-bar{display:flex;align-items:center;gap:9px;height:40px;padding:0 9px 0 13px;border-radius:11px;
background:var(--search-bg)!important;border:1px solid var(--search-border)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important;
transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;}
.search .search-bar:focus-within{border-color:var(--search-border-focus)!important;background:var(--search-focus-bg)!important;box-shadow:0 0 0 2px var(--search-focus-ring)!important;}

body:not(.dark) .search .search-wrap{box-shadow:0 2px 10px rgba(60,80,120,.12),inset 0 1px 0 rgba(255,255,255,.6);}
body:not(.dark) .search .search-bar{box-shadow:0 1px 3px rgba(60,80,120,.10),inset 0 1px 0 rgba(255,255,255,.9)!important;}
body:not(.dark) .search .search-bar:focus-within{box-shadow:0 1px 3px rgba(60,80,120,.10),0 0 0 2px var(--search-focus-ring)!important;}

.search .search-icon{position:relative;width:20px;height:20px;flex:0 0 20px;}
.search .search-icon::before{content:"";position:absolute;left:1px;top:1px;width:13px;height:13px;border:2px solid var(--search-ico);border-radius:50%;}
.search .search-icon::after{content:"";position:absolute;width:8px;height:2px;background:var(--search-ico);transform:rotate(45deg);transform-origin:left center;left:14px;top:15px;border-radius:999px;}
.search input.search-input{flex:1;min-width:0;border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important;
color:var(--search-text)!important;font-size:14px;font-weight:500;letter-spacing:-.012em;padding:0!important;height:auto!important;}
.search input.search-input::placeholder{color:var(--search-ph)!important;opacity:1;font-weight:500;transition:opacity .14s ease,color .14s ease;}
.search input.search-input:focus::placeholder{opacity:0!important;color:transparent!important;}

.search input.search-input::-webkit-search-cancel-button,
.search input.search-input::-webkit-search-decoration,
.search input.search-input::-webkit-search-results-button,
.search input.search-input::-webkit-search-results-decoration{
-webkit-appearance:none;appearance:none;display:none;
}

.search .premium-search-caret{
position:absolute;left:42px;top:50%;margin-top:-8.5px;width:2px;height:17px;border-radius:999px;
background:rgba(220,242,255,.95);
box-shadow:0 0 4px rgba(115,200,235,.45),0 0 8px rgba(115,200,235,.18);
display:none;opacity:0;pointer-events:none;z-index:2;
}
.search .search-bar.caret-active .premium-search-caret{
display:block;
animation:premiumCaret 1.35s ease-in-out infinite;
}
.search input.search-input.custom-caret-active{caret-color:transparent;}

body:not(.dark) .search .premium-search-caret{
background:rgba(48,150,190,.95);
box-shadow:0 0 4px rgba(70,175,210,.35),0 0 8px rgba(70,175,210,.14);
}
@keyframes premiumCaret{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
.search .search-bar.caret-active .premium-search-caret{animation:none;opacity:.9;}
}
.search .actions{display:flex;align-items:center;flex:0 0 auto;}

.search .search-wrap{position:relative;isolation:isolate;overflow:visible;}
.search .search-bar{position:relative;z-index:1;}
.search .search-wrap::before{
content:"";
position:absolute;
inset:-4px;
border-radius:inherit;
background:conic-gradient(from 20deg,
rgba(122,92,255,.55),
rgba(79,125,255,.48),
rgba(54,213,255,.46),
rgba(184,77,255,.5),
rgba(255,60,134,.5),
rgba(255,139,61,.42),
rgba(122,92,255,.55));
filter:blur(9px);
opacity:0;
transition:opacity .24s ease;
pointer-events:none;
z-index:-1;
}
.search .search-wrap:focus-within::before{
opacity:.525;
animation:siriGlowBreathe 2.8s ease-in-out infinite;
}
@keyframes siriGlowBreathe{
0%,100%{opacity:.350;transform:scale(.985)}
50%{opacity:.569;transform:scale(1.015)}
}
@media(prefers-reduced-motion:reduce){
.search .search-wrap:focus-within::before{animation:none;}
}

/* ── Treatment Sheets on the Flow shell ── */
html,body{background:var(--page-bg);}
body:not(.dark) .mesh{background:var(--page-bg)!important;}
body.dark .mesh{background:#080E1A!important;}
.bg-orb-1,.bg-orb-2,.bg-bloom{display:none!important;}
.subnav .role-dd{color:var(--ink-500);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
body.dark .subnav .role-dd{color:rgba(255,255,255,.6);}
.subnav .role-dd select{height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-0);color:var(--ink-900);font:inherit;font-weight:600;padding:0 10px;}
body.dark .subnav .role-dd select{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.14);}
.sbc svg,.sb-sort svg{width:11px;height:11px;flex:0 0 11px;}
.subnav .seg{white-space:nowrap;}
/* tablet header: logo, scrollable app nav, full-width search */
@media (max-width:1024px){
 .topnav{grid-template-columns:auto minmax(0,1fr) auto!important;grid-template-areas:none!important;column-gap:10px}
 .topnav .brandwrap{grid-column:1!important;grid-row:1!important}
 .topnav .nav-center{grid-column:2!important;grid-row:1!important;justify-self:stretch!important;position:static!important;transform:none!important;left:auto!important;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;-webkit-overflow-scrolling:touch}
 .topnav .nav-center::-webkit-scrollbar{display:none}
 .topnav .nav-right{grid-column:3!important;grid-row:1!important}
 .topnav .cobrand-div,.topnav .pvx-lockup{display:none!important}
 .subnav{flex-wrap:wrap;row-gap:10px}
 .subnav .subnav-title,.subnav .fs-btn,.subnav .spacer{display:none}
 .subnav .switcher{overflow-x:auto;scrollbar-width:none;max-width:100%}
 .subnav .search{order:10;flex:1 1 100%;width:100%;max-width:none}
}


/* ===== Treatment Sheets database UI ===== */
/* ── Treatment Sheets: patient switcher, empty state, modal, sign-in gate ── */
.ts-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface-0);color:var(--ink-900);
 font:600 13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;cursor:pointer;max-width:320px;white-space:nowrap;transition:background .15s,box-shadow .15s}
.ts-chip:hover{box-shadow:0 2px 10px rgba(20,30,50,.08)}
.ts-chip .dot{width:8px;height:8px;border-radius:50%;background:#C7CAD1;flex:0 0 8px}
.ts-chip .dot.on{background:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.ts-chip .nm{overflow:hidden;text-overflow:ellipsis}
.ts-chip .loc{font-weight:500;color:var(--ink-400)}
.ts-chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;opacity:.6;flex:0 0 14px}
body.dark .ts-chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#EEF1F6}
.ts-menu{position:fixed;z-index:9400;width:290px;max-height:60vh;overflow:auto;padding:6px;border-radius:16px;background:rgba(255,255,255,.98);border:1px solid rgba(0,0,0,.07);
 box-shadow:0 20px 50px rgba(20,30,50,.18);display:none;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#1D1D1F}
.ts-menu.show{display:block;animation:tsPop .25s cubic-bezier(.32,1.22,.5,1) both}
.ts-menu .mh{padding:8px 10px 4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#86868B}
.ts-menu .me{padding:10px;color:#86868B}
.ts-menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ts-menu .mi:hover{background:rgba(0,0,0,.05)}
.ts-menu .mi.cur{background:rgba(56,189,210,.12)}
.ts-menu .mi .av{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#38BDD2,#3E8BFF)}
.ts-menu .mi .tx{min-width:0}.ts-menu .mi b{display:block;font-weight:600}.ts-menu .mi small{display:block;color:#86868B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-menu .mi.act{font-weight:600;color:#1F8FA8}.ts-menu .mi.danger{color:#C9352B}
.ts-menu .sep{height:1px;background:rgba(0,0,0,.07);margin:6px 4px}
body.dark .ts-menu{background:rgba(18,24,36,.98);color:#EEF1F6;border-color:rgba(255,255,255,.08)}
body.dark .ts-menu .mi:hover{background:rgba(255,255,255,.06)}
@keyframes tsPop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.ts-empty{display:flex;align-items:center;justify-content:center;min-height:52vh;padding:40px 20px}
.ts-empty-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:360px;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink-500)}
.ts-empty-card .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#1F8FA8;background:rgba(56,189,210,.12);margin-bottom:6px}
.ts-empty-card .ic svg{width:28px;height:28px}
.ts-empty-card b{font-size:18px;color:var(--ink-900)}
.ts-empty-card .row{display:flex;gap:8px;margin-top:10px}
.ts-btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-0);color:var(--ink-900);font:600 13.5px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;cursor:pointer;text-decoration:none}
.ts-btn.primary{background:#1D1D1F;color:#fff;border-color:#1D1D1F}
body.dark .ts-btn{background:rgba(255,255,255,.06);color:#EEF1F6;border-color:rgba(255,255,255,.14)}
body.dark .ts-btn.primary{background:#EEF1F6;color:#0C1424}
#tsModal{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center}
#tsModal.show{display:flex}
#tsModal .tm-scrim{position:absolute;inset:0;background:rgba(10,16,28,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#tsModal .tm-card{position:relative;width:min(560px,calc(100vw - 28px));max-height:88vh;overflow:auto;padding:22px;border-radius:24px;background:rgba(255,255,255,.98);color:#1D1D1F;
 box-shadow:0 30px 80px rgba(10,20,40,.28);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;animation:tsPop .4s cubic-bezier(.32,1.22,.5,1) both}
#tsModal h3{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
#tsModal p{margin:0 0 14px;color:#6E6E73;font-size:13px}
#tsModal .tm-note{margin:12px 0 0}
#tsModal .tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
#tsModal .tm-grid .wide{grid-column:1/-1}
#tsModal label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#6E6E73}
#tsModal input,#tsModal select{height:38px;border-radius:10px;border:1px solid rgba(0,0,0,.12);padding:0 10px;font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;color:#1D1D1F;background:#fff}
#tsModal input:focus,#tsModal select:focus{outline:none;border-color:#38BDD2;box-shadow:0 0 0 3px rgba(56,189,210,.18)}
#tsModal .tm-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#tsModal .ts-seg{display:flex;flex-wrap:wrap;gap:6px}
#tsModal .ts-seg button{height:34px;padding:0 13px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:#fff;font:600 13px -apple-system,sans-serif;cursor:pointer}
#tsModal .ts-seg button.on{background:#1D1D1F;color:#fff;border-color:#1D1D1F}
body.dark #tsModal .tm-card{background:rgba(18,24,36,.98);color:#EEF1F6}
body.dark #tsModal input,body.dark #tsModal select{background:rgba(255,255,255,.06);color:#EEF1F6;border-color:rgba(255,255,255,.14)}
#tsGate{position:fixed;inset:0;z-index:9600;display:none;align-items:center;justify-content:center;background:rgba(245,245,247,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#tsGate.show{display:flex}
#tsGate .tg-card{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:380px;padding:28px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 30px 80px rgba(10,20,40,.18);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#6E6E73}

/* ===== LUNA voice (from Pravix Flow) ===== */

/* ── Voice commands (pilot, per workstation) ── */
#fvTalk{position:relative;inset:auto;flex:0 0 auto;box-shadow:none;gap:0;width:28px;height:28px;margin-right:4px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--search-ph,#7B8796);
 cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;transition:color .2s ease,background .2s ease,transform .25s cubic-bezier(.32,1.22,.5,1)}
#fvTalk svg{width:16px;height:16px;position:relative;left:auto;top:auto;transform:none;color:inherit;z-index:1}
#fvTalk:hover{background:rgba(120,130,150,.12);color:var(--text,#1D1D1F)}
#fvTalk:active{transform:scale(.92)}
#fvTalk.on{color:#fff;background:#2F7BEA;transform:scale(1.06)}
#fvTalk.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(47,123,234,.45);animation:fvRing 1.3s ease-out infinite}
#fvTalk.fv-float{position:fixed;right:20px;bottom:20px;z-index:9350;width:40px;height:40px;margin:0;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:0 6px 18px rgba(20,30,50,.14),inset 0 0 0 1px rgba(255,255,255,.6)}
#fvTalk.fv-float.on{background:#2F7BEA}
/* Listening: the search bar becomes the listening surface */
@property --fvA{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes fvSpin{to{--fvA:360deg}}
@keyframes fvShimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes fvIn{from{opacity:0;transform:translateY(-35%)}to{opacity:1;transform:translateY(-50%)}}
.search .search-wrap>.fv-ring,.search .search-wrap>.fv-halo{position:absolute;inset:-1px;border-radius:16px;pointer-events:none;z-index:0;opacity:0;
 background:conic-gradient(from var(--fvA),#5EE7F5,#3E8BFF,#8E6CFF,#FF6FB1,#FFB36B,#5EE7F5);transition:opacity .35s ease}
.search .search-wrap>.fv-ring{padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.search .search-wrap>.fv-halo{inset:2px;filter:blur(14px);transform:scale(calc(1 + var(--fvL,0)*.045));transition:opacity .35s ease,transform .12s linear}
.search .search-wrap.fv-listening>.fv-ring{opacity:1;animation:fvSpin 4s linear infinite}
.search .search-wrap.fv-listening>.fv-halo{opacity:calc(.28 + var(--fvL,0)*.62);animation:fvSpin 4s linear infinite}
.search .search-wrap.fv-thinking>.fv-ring{opacity:.9;animation:fvSpin 1.1s linear infinite}
.search .search-wrap.fv-thinking>.fv-halo{opacity:.3;animation:fvSpin 1.1s linear infinite}
.search .search-wrap.fv-listening,.search .search-wrap.fv-thinking{border-color:transparent!important}
.search .search-bar.fv-listening input.search-input{color:transparent!important}
.search .search-bar.fv-listening input.search-input::placeholder{color:transparent!important}
.search .search-bar.fv-listening .premium-search-caret{opacity:0!important;animation:none!important}
.fv-live{position:absolute;top:50%;transform:translateY(-50%);line-height:20px;height:20px;z-index:2;pointer-events:none;white-space:nowrap;overflow:hidden;font-size:14px;font-weight:500;letter-spacing:-.012em;color:var(--search-text,#D1D9E5)}
.fv-live:empty{display:none}
.fv-live.idle{background:linear-gradient(90deg,var(--search-ph) 0%,var(--search-ph) 38%,var(--search-text) 50%,var(--search-ph) 62%,var(--search-ph) 100%);background-size:240% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:fvShimmer 1.8s linear infinite}
.fv-live.hint{font-weight:500;animation:fvIn .3s ease both,fvShimmer 2.4s linear infinite}
.fv-live.words{animation:fvIn .18s ease both}
#fvTalk .fv-bars{display:none;align-items:center;gap:2px;height:14px;position:relative;z-index:1}
#fvTalk .fv-bars i{display:block;width:2.5px;height:3px;border-radius:2px;background:#fff;transition:height .08s linear}
#fvTalk.on svg{display:none}
#fvTalk.on .fv-bars{display:flex}
#fvTalk.on{background:linear-gradient(135deg,#3E8BFF,#8E6CFF)!important;box-shadow:0 2px 10px rgba(80,110,255,.45)}
#fvTalk.on::after{display:none}
@keyframes fvRing{from{transform:scale(.9);opacity:1}to{transform:scale(1.45);opacity:0}}
#fvPanel{position:fixed;top:76px;right:16px;left:auto;bottom:auto;z-index:9360;width:min(460px,calc(100vw - 24px));border-radius:22px;background:rgba(16,20,30,.97);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
 color:#EEF1F6;box-shadow:0 22px 60px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;
 opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .2s ease,transform .4s cubic-bezier(.32,1.22,.5,1)}
#fvPanel.show{opacity:1;transform:none;pointer-events:auto}
#fvPanel.fv-bottom{top:auto!important;right:20px!important;bottom:72px;transform-origin:bottom right}
#fvPanel .fv-in{padding:16px 18px}
#fvPanel .fv-heard{font-size:13px;color:#AEB6C4;min-height:18px}
#fvPanel .fv-heard q{color:#fff;font-weight:500}
#fvPanel .fv-wave{display:flex;align-items:center;gap:4px;height:34px;margin:6px 0 2px}
#fvPanel .fv-wave i{width:4px;height:6px;border-radius:3px;background:linear-gradient(180deg,#6FD3E6,#3E9BFF)}
#fvPanel .fv-act{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
#fvPanel .fv-btns{margin-left:auto}
#fvPanel .fv-med{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c,#6FD3E6);font-weight:800;font-size:13px;color:#fff;background:rgba(255,255,255,.06)}
#fvPanel .fv-t{flex:1;min-width:0}
#fvPanel .fv-t b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fvPanel .fv-path{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:#C9D0DC;flex-wrap:wrap}
#fvPanel .fv-pill{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:600}
#fvPanel .fv-pill.to{background:rgba(111,211,230,.2);color:#9BE6F2}
#fvPanel .fv-btns{display:flex;gap:8px;flex:0 0 auto}
#fvPanel .fv-no{height:40px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#EEF1F6;font:inherit;font-weight:600;cursor:pointer}
#fvPanel .fv-ok{height:40px;padding:0 18px;border-radius:999px;border:0;background:#EEF1F6;color:#0C1424;font:inherit;font-weight:700;cursor:pointer}
#fvPanel .fv-sub{font-size:12px;color:#8F98A8;margin-top:10px}
#fvPanel .fv-ans{font-size:15px;margin-top:8px}
#fvPanel .fv-err{color:#F3C95B}
#fvPanel .fv-choices{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#fvPanel .fv-choice{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;text-align:left;cursor:pointer}
#fvPanel .fv-choice small{display:block;color:#AEB6C4;font-size:11.5px}
#fvPanel button:focus-visible,#fvTalk:focus-visible{outline:2px solid #6FD3E6;outline-offset:2px}
#fvToast{position:fixed;left:50%;top:18px;z-index:9370;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 16px;border-radius:999px;background:rgba(16,20,30,.94);color:#EEF1F6;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.28);opacity:0;transform:translate(-50%,-14px);pointer-events:none;transition:opacity .25s,transform .45s cubic-bezier(.32,1.22,.5,1)}
#fvToast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#fvToast button{border:0;border-radius:999px;background:#EEF1F6;color:#0C1424;font:inherit;font-weight:700;padding:5px 12px;cursor:pointer}
/* Light theme: frosted white, like Spotlight */
body:not(.dark) #fvPanel{background:rgba(255,255,255,.96);color:#1D1D1F;border-color:rgba(0,0,0,.06);box-shadow:0 18px 50px rgba(30,40,70,.18),inset 0 1px 0 rgba(255,255,255,.9)}
body:not(.dark) #fvPanel .fv-heard{color:#6E6E73}
body:not(.dark) #fvPanel .fv-heard q,body:not(.dark) #fvPanel .fv-med{color:#1D1D1F}
body:not(.dark) #fvPanel .fv-med{background:rgba(0,0,0,.04)}
body:not(.dark) #fvPanel .fv-path{color:#3A3A3C}
body:not(.dark) #fvPanel .fv-pill{background:rgba(0,0,0,.06)}
body:not(.dark) #fvPanel .fv-pill.to{background:rgba(47,123,234,.12);color:#1F5FC4}

body:not(.dark) #fvPanel .fv-err{color:#B26A00}
