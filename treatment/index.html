<!-- Same theme bootstrap as Pravix Flow: shared pvx_theme cookie (light unless the user chose dark). -->
<script>(function(){function paint(t){try{document.documentElement.style.background=(t==='dark')?'#080E1A':'#FFFFFF';}catch(e){}}try{var m=document.cookie.match(/(?:^|;\s*)pvx_theme=(dark|light)/);var t=(m&&m[1])||'light';document.body.classList.toggle('dark',t==='dark');paint(t);}catch(e){paint('light');}})();</script>
